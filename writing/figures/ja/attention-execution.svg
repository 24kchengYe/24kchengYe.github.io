<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 750" width="1440" height="750" lang="ja"><foreignObject width="1440" height="750"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>*{box-sizing:border-box}.diagram-root{margin:0;color:#303c38;background:white;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1440px;background:white;overflow:hidden}.node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;background:white;border:1.5px solid #8c9a90;border-radius:3px;padding:10px 16px;font-size:25px;line-height:1.4}.soft{background:#edf3e9;border-color:#8a9c7d}.quiet{background:#f7f8f6;border-color:#d6dcd5}.label{position:absolute;font-size:23px;line-height:1.45;color:#65736a}.title{font-size:29px;color:#303c38;font-weight:500}.center{text-align:center}.small{font-size:21px}.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.line{position:absolute;height:0;border-top:1.5px solid #8c9a90}.arrow:after{content:"";position:absolute;right:-1px;top:-4.5px;border-left:7px solid #8c9a90;border-top:4px solid transparent;border-bottom:4px solid transparent}.vertical{width:0;border-top:0;border-left:1.5px solid #8c9a90}.down:after{content:"";position:absolute;bottom:-1px;left:-4.5px;border-top:7px solid #8c9a90;border-left:4px solid transparent;border-right:4px solid transparent}.dashed{border-style:dashed}.rule{border-color:#e0e5dd;border-width:1px}.cells{position:absolute;display:grid}.cells i{display:block;background:#f4f6f2;border:1px solid #e0e5dd;border-radius:1px}.cells i.on{background:#ceddc4;border-color:#afc39f}.canvas{height:750px}</style><main class="canvas">
<div class="label title" style="left:40px;top:24px;width:1360px">情報源</div><div class="label center title" style="left:40px;top:94px;width:660px">Self-attention</div><div class="label center title" style="left:740px;top:94px;width:660px">Cross-attention</div><div class="node quiet mono" style="left: 40px; top: 188px; width: 134px; height: 80px; font-size: 26px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">X</span></div><div class="line arrow" style="left:174px;top:228px;width:60px"></div><div class="node soft mono" style="left: 234px; top: 188px; width: 236px; height: 80px; font-size: 26px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">Q, K, V</span></div><div class="line arrow" style="left:470px;top:228px;width:60px"></div><div class="node small" style="left: 530px; top: 188px; width: 170px; height: 80px; font-size: 22px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">Attention</span></div><div class="node quiet mono" style="left: 740px; top: 150px; width: 134px; height: 60px; font-size: 26px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">X → Q</span></div><div class="node quiet mono" style="left: 740px; top: 244px; width: 134px; height: 60px; font-size: 23px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">Y → K,V</span></div><div class="line " style="left:874px;top:180px;width:52px"></div><div class="line " style="left:874px;top:274px;width:52px"></div><div class="line vertical" style="left:926px;top:180px;height:94px"></div><div class="line arrow" style="left:926px;top:228px;width:68px"></div><div class="node soft mono" style="left: 994px; top: 188px; width: 406px; height: 80px; font-size: 26px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">Attention(Qₓ, Kᵧ, Vᵧ)</span></div><div class="line rule" style="left:40px;top:370px;width:1360px"></div><div class="label title" style="left:40px;top:410px;width:1360px">実行方法 · FlashAttention</div><div class="node quiet" style="left: 40px; top: 520px; width: 330px; height: 106px; font-size: 26px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">GPUメモリ上のQ・K・V</span></div><div class="line arrow" style="left:370px;top:573px;width:66px"></div><div class="node soft" style="left: 436px; top: 520px; width: 568px; height: 106px; font-size: 26px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">オンチップのタイル計算＋オンラインSoftmax</span></div><div class="line arrow" style="left:1004px;top:573px;width:66px"></div><div class="node " style="left: 1070px; top: 520px; width: 330px; height: 106px; font-size: 26px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">注意の出力</span></div><div class="label center" style="left:260px;top:678px;width:920px">N × Nスコア行列全体を実体化しない</div>
</main></div></foreignObject></svg>
