<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 590" width="1440" height="590" lang="zh"><foreignObject width="1440" height="590"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>*{box-sizing:border-box}.diagram-root{margin:0;color:#303c38;background:white;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1440px;background:white;overflow:hidden}.node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;background:white;border:1.5px solid #8c9a90;border-radius:3px;padding:10px 16px;font-size:25px;line-height:1.4}.soft{background:#edf3e9;border-color:#8a9c7d}.quiet{background:#f7f8f6;border-color:#d6dcd5}.label{position:absolute;font-size:23px;line-height:1.45;color:#65736a}.title{font-size:29px;color:#303c38;font-weight:500}.center{text-align:center}.small{font-size:21px}.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.line{position:absolute;height:0;border-top:1.5px solid #8c9a90}.arrow:after{content:"";position:absolute;right:-1px;top:-4.5px;border-left:7px solid #8c9a90;border-top:4px solid transparent;border-bottom:4px solid transparent}.vertical{width:0;border-top:0;border-left:1.5px solid #8c9a90}.down:after{content:"";position:absolute;bottom:-1px;left:-4.5px;border-top:7px solid #8c9a90;border-left:4px solid transparent;border-right:4px solid transparent}.dashed{border-style:dashed}.rule{border-color:#e0e5dd;border-width:1px}.cells{position:absolute;display:grid}.cells i{display:block;background:#f4f6f2;border:1px solid #e0e5dd;border-radius:1px}.cells i.on{background:#ceddc4;border-color:#afc39f}.canvas{height:590px}</style><main class="canvas">
<div class="label title" style="left:40px;top:26px;width:1360px">写入状态，再按查询读取</div><div class="node quiet mono" style="left:40px;top:192px;width:228px;height:80px"><span style="min-width: 0; overflow-wrap: anywhere;">Sₜ₋₁</span></div><div class="line arrow" style="left:268px;top:232px;width:76px"></div><div class="node soft" style="left:344px;top:192px;width:264px;height:80px"><span style="min-width: 0; overflow-wrap: anywhere;">状态更新</span></div><div class="label mono center" style="left:344px;top:108px;width:264px">kₜ , vₜ</div><div class="line vertical down" style="left:476px;top:149px;height:43px"></div><div class="line arrow" style="left:608px;top:232px;width:76px"></div><div class="node soft mono" style="left:684px;top:192px;width:228px;height:80px"><span style="min-width: 0; overflow-wrap: anywhere;">Sₜ</span></div><div class="line arrow" style="left:912px;top:232px;width:76px"></div><div class="node " style="left:988px;top:192px;width:228px;height:80px"><span style="min-width: 0; overflow-wrap: anywhere;">按查询读取</span></div><div class="label mono center" style="left:988px;top:108px;width:228px">qₜ</div><div class="line vertical down" style="left:1102px;top:149px;height:43px"></div><div class="line arrow" style="left:1216px;top:232px;width:76px"></div><div class="node quiet mono" style="left:1292px;top:192px;width:108px;height:80px"><span style="min-width: 0; overflow-wrap: anywhere;">oₜ</span></div><div class="line rule" style="left:40px;top:340px;width:1360px"></div><div class="label title center" style="left:40px;top:382px;width:420px">Kernel linear</div><div class="node quiet" style="left:40px;top:442px;width:420px;height:92px"><span style="min-width: 0; overflow-wrap: anywhere;">累加外积</span></div><div class="label title center" style="left:510px;top:382px;width:420px">Gated DeltaNet</div><div class="node soft" style="left:510px;top:442px;width:420px;height:92px"><span style="min-width: 0; overflow-wrap: anywhere;">标量遗忘 + delta 写入</span></div><div class="label title center" style="left:980px;top:382px;width:420px">KDA</div><div class="node soft" style="left:980px;top:442px;width:420px;height:92px"><span style="min-width: 0; overflow-wrap: anywhere;">通道遗忘 + delta 写入</span></div>
</main></div></foreignObject></svg>
