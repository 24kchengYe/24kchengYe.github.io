<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>CSA</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1440px;overflow:hidden;background:#fff}.node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;border:1.5px solid #a4afa5;background:#fff;border-radius:4px;padding:10px 16px;font-size:24px;line-height:1.4;z-index:2}.node.soft{background:#eff4ec;border-color:#9eaf94}.math{font-size:.86em;color:#56645b}.title{position:absolute;left:40px;top:28px;font-size:29px;font-weight:500}.legend{position:absolute;top:36px;font-size:18px;color:#6a766d}.legend:before{content:"";display:inline-block;width:30px;border-top:1.5px solid #91a08f;vertical-align:middle;margin-right:12px}.legend.control:before{border-top-style:dashed}.edge{position:absolute;height:0;border-top:1.5px solid #91a08f;transform-origin:0 0;z-index:1}.edge.control{border-top-style:dashed}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #91a08f;border-top:4px solid transparent;border-bottom:4px solid transparent}.note{position:absolute;left:40px;width:1360px;font-size:20px;line-height:1.5;color:#68766c;border-top:1px solid #e0e6dc;padding-top:20px}.annotation{position:absolute;font-size:22px;color:#68766c}</style></head><body><main class="canvas" style="height:850px">
<div class="title">CSA</div><div class="legend" style="left:760px">实线：张量流</div><div class="legend control" style="left:1070px">虚线：选择 / 门控</div>
<div class="edge" data-from="history" data-to="compressed" style="left:260px;top:330px;width:40px;transform:rotate(0deg)"></div>
<div class="edge" data-from="history" data-to="compressed" style="left:300px;top:330px;width:135px;transform:rotate(-90deg)"></div>
<div class="edge arrow" data-from="history" data-to="compressed" style="left:300px;top:195px;width:60px;transform:rotate(0deg)"></div>
<div class="edge" data-from="history" data-to="index-key" style="left:260px;top:370px;width:40px;transform:rotate(0deg)"></div>
<div class="edge" data-from="history" data-to="index-key" style="left:300px;top:370px;width:35px;transform:rotate(90deg)"></div>
<div class="edge arrow" data-from="history" data-to="index-key" style="left:300px;top:405px;width:60px;transform:rotate(0deg)"></div>
<div class="edge" data-from="history" data-to="local" style="left: 150px; top: 410px; width: 200px; transform: rotate(90deg);"></div>
<div class="edge arrow" data-from="history" data-to="local" style="left:150px;top:610px;width:210px;transform:rotate(0deg)"></div>
<div class="edge arrow" data-from="compressed" data-to="gather" style="left:650px;top:195px;width:90px;transform:rotate(0deg)"></div>
<div class="edge arrow" data-from="index-key" data-to="indexer" style="left:650px;top:405px;width:90px;transform:rotate(0deg)"></div>
<div class="edge control arrow" data-from="indexer" data-to="gather" style="left:880px;top:350px;width:100px;transform:rotate(-90deg)"></div>
<div class="edge arrow" data-from="query" data-to="indexer" style="left: 880px; top: 550px; width: 90px; transform: rotate(-90deg);"></div>
<div class="edge" data-from="query" data-to="attention" style="left:1020px;top:610px;width:40px;transform:rotate(0deg)"></div>
<div class="edge" data-from="query" data-to="attention" style="left:1060px;top:610px;width:310px;transform:rotate(-90deg)"></div>
<div class="edge arrow" data-from="query" data-to="attention" style="left:1060px;top:300px;width:40px;transform:rotate(0deg)"></div>
<div class="edge arrow" data-from="gather" data-to="attention" style="left:1020px;top:195px;width:80px;transform:rotate(0deg)"></div>
<div class="edge" data-from="local" data-to="attention" style="left:650px;top:610px;width:40px;transform:rotate(0deg)"></div>
<div class="edge" data-from="local" data-to="attention" style="left:690px;top:610px;width:130px;transform:rotate(90deg)"></div>
<div class="edge" data-from="local" data-to="attention" style="left:690px;top:740px;width:560px;transform:rotate(0deg)"></div>
<div class="edge arrow" data-from="local" data-to="attention" style="left:1250px;top:740px;width:400px;transform:rotate(-90deg)"></div>
<div class="node " id="history" style="left: 40px; top: 290px; width: 220px; height: 120px; font-size: 24px;">历史隐状态<br><span class="math">X</span></div>
<div class="node soft" id="compressed" style="left:360px;top:140px;width:290px;height:110px;font-size:24px">序列压缩 KV<br><span class="math">N × c → ≈ (N/m) × c</span></div>
<div class="node " id="index-key" style="left: 360px; top: 330px; width: 290px; height: 150px; font-size: 24px;">独立投影的压缩索引键<br><span class="math">X → Kᴵ</span></div>
<div class="node soft" id="local" style="left: 360px; top: 550px; width: 290px; height: 120px; font-size: 24px;">局部原始 KV<br><span class="math">X → Kʷⁱⁿ, Vʷⁱⁿ</span></div>
<div class="node soft" id="gather" style="left:740px;top:140px;width:280px;height:110px;font-size:24px">读取选中压缩条目<br><span class="math">C[selected]</span></div>
<div class="node " id="indexer" style="left:740px;top:350px;width:280px;height:110px;font-size:24px">Lightning Indexer<br><span class="math">score(Qᴵ, Kᴵ) → Top-k</span></div>
<div class="node " id="query" style="left: 740px; top: 550px; width: 280px; height: 120px; font-size: 24px;">当前隐状态投影<br><span class="math">xₜ → cQ → Q, Qᴵ</span></div>
<div class="node soft" id="attention" style="left:1100px;top:140px;width:300px;height:200px;font-size:24px">注意力读取<br><span class="math">KV ← [C[selected]; KVʷⁱⁿ]<br>Attention(Q, KV) → oₜ</span></div>

<div class="note" style="top:755px">索引器只给出位置；压缩 KV 和局部 KV 一起参与主注意力。</div>
</main></body></html>
