ss="wire" style="left:590px;top:145px;height:75px;border-left:1.25px dashed #424942"></div><div class="tip" style="left:585px;top:150px;border-color:#424942;transform:rotate(315deg)"></div><div class="wire" style="left:1310px;top:435px;height:75px;border-left:1.25px solid #424942"></div><div class="tip" style="left:1305px;top:495px;border-color:#424942;transform:rotate(135deg)"></div><div class="wire" style="left:590px;top:510px;width:720px;border-top:1.25px dashed #424942"></div><div class="tip" style="left:595px;top:505px;border-color:#424942;transform:rotate(225deg)"></div><div class="wire" style="left:590px;top:435px;height:75px;border-left:1.25px dashed #424942"></div><div class="tip" style="left:585px;top:440px;border-color:#424942;transform:rotate(315deg)"></div><div class="label" style="left:760px;top:198px">失敗と教訓を記録</div><div class="label" style="left:745px;top:488px">更新 / 統合 / 矛盾確認</div></main></div></foreignObject></svg>
