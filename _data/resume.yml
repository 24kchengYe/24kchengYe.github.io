  - id: experience
    title: インターンシップ経験
    entries:
    - id: bytedance
      title: ByteDance · PDI-Seed-Lark Base AI
      date: 2026.05 – 現在
      role: LLMアルゴリズムインターン（ByteIntern）
      paragraphs:
      - Doubao OfficeのMoAシステムにおいて、Lark Base AI向けSeed 2の事後学習を担当。データ合成、Judge/Fix Infra Modelsの学習、Verifier Agent + AutoResearch、Spec-Verifier-SDKのCoding
        AgentおよびLark Base CLIの構築を通じ、企業ネイティブなB2Bシナリオに向けたAgentic能力を構築。
      projects:
      - id: spec-refine
        title: '[1] Spec-Refineのデータ合成の構築'
        paragraphs:
        - <strong>Baseシナリオにおける多次元テーブルのSpec生成能力の上限を突破</strong>し、<strong>Judge・Fixモデルに基づくRefineエージェントの強化学習</strong>に<strong>密な学習信号</strong>を提供するため、Table/Workflow/Dashboard/Permission/Viewの5領域をカバーする<strong>Category–Rubric–Mode</strong>の3階層Rubric体系と<strong>Judge–Fix–Router</strong>パイプラインを構築。複数候補の生成、領域別評価／根本原因に応じたルーティング、局所的な再確認／長期的な修復記憶に、投票による出力許可、終端バイパス、形式検証、許容誤差に基づく再確認／免除、難しい処理経路へのHardフォールバックを組み合わせた。早期停止／混合精度でコストを管理し、例外の隔離／トランザクションのロールバックで結果を保護。<strong>従来のLLM-as-Judgeが疎な判定しか出力しない問題</strong>に対し、Verifier
          Agentを構築し、Fix前後の局所Rubricに対するJudgeの判定について複数段階のtoken logprobsをサンプリング。マルチモーダル情報とrolloutを統合し、密な信号を精密に抽出した。E2Eの自動評価／人手評価で、<strong>データ正解率は29%から70%へ向上（+41パーセントポイント）</strong>。Doubao
          Officeのシナリオデータも組み込み、<strong>Infra Modelの学習データフライホイール</strong>を形成。
      - id: judge-fix
        title: '[2] Judge/Fix Infra Modelsの学習'
        paragraphs:
        - <strong>複数の問題を含むBase SpecサンプルにおけるSeed 2の正解率／再現率の低さ</strong>に対し、<strong>因果推論データ合成、カリキュラム強化学習、オンポリシー文脈蒸留</strong>を組み合わせた事後学習戦略を設計し、<strong>Seedモデルの自己蒸留</strong>に基づくSpec
          Rubric Modelを構築。Specベースの因果推論システムAssumption-Based Truth Maintenance Systemを構築して<strong>Spec-Refineのデータ合成を強化</strong>し、Baseの能力境界、Queryの要件、導出された推論に基づき、DFSによる集合伝播で最小仮定の組合せと矛盾する仮定の組合せを計算する方法を提案。DSH
          harnessで生成した1万件超の合成データ軌跡を用いて、<strong>Seed 2.0-based Judgeモデルを事後学習</strong>した。Strict-SFTでコールドスタートを行い、<strong>Category–Rubric–Modeの階層的F1
          Reward</strong>を導入。<strong>段階的に動的重みを進める</strong>ことで、確信度に基づいて構造化した思考連鎖を構築し、GRPOで学習したJudgeモデルを教師として、rubricとCoTのプロンプトを混合して生徒モデルSeed
          2を強化した。正解率はGPT-6.1と同等となり、<strong>Vote一致率とRubricカバレッジはそれぞれ35、45パーセントポイント向上</strong>。Fix効率を高めるため、異種の複数教師による軌跡から合成パイプラインのFix能力を抽出し、SFT+RFT+PPOで<strong>Fix
          Model</strong>を学習。<strong>正解率はGPT-6.1を20パーセントポイント上回った</strong>。
      - id: agentic-rl
        title: '[3] Agentic RLに基づくLark Base CLI'
        paragraphs:
        - <strong>オンラインモデルの単位当たりリソース制約を突破し、Code Agentの信号の疎さ、難例のカバレッジ不足、ロングテールの問題を解決するため</strong>、Spec、CodeAct、E2E Rewardを伴う長い軌跡、PI
          harnessを用いてCoding Agentを学習。DoubaoのSuper Mode harnessでskillsを動的に読み込み、<strong>最適化したSpecをCode Agent/CLIの思考連鎖</strong>としてAgentic
          RLを行い、Doubao OfficeのMoA体系におけるSubAgent向けLark Base CLIのAgentic RLを実現した。E2E Judge Modelを学習し、<strong>要件充足、設定の正確さ、モジュール間依存、全体の利用可能性</strong>などのフィードバックをCode
          Agentの密な信号に変換。コンパイル成功率、生成物の正確さ、コード効率を同時に考慮するAuto Thinkingモードを設計し、<strong>GRPO checkpoint</strong>が評価するリアルタイムのデータ難度に対して<strong>Learning-frontierによる動的サンプリング</strong>を行った。コンパイラエラー、失敗ログ、成功rolloutをprivileged
          contextとして利用。Base Spec生成シナリオ向けに<strong>自己進化するPE最適化用の動的Harness</strong>を構築し、バッチをまたぐ敵対的な統合分析でサンプリングノイズを除去し、共通する根本原因を特定。証拠／安定性／敵対的入力への頑健性／純便益のゲートを通じ、高い効果と低い回帰リスクを持つPrompt
          patchを合成した。<strong>token利用効率は38パーセントポイント向上</strong>。P50レイテンシは<strong>3.1分から23秒へ短縮</strong>し、大規模な本番展開を支えた。
      papers: []
