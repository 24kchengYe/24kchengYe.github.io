<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" width="1440" height="600" lang="zh"><foreignObject width="1440" height="600"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root" data-diagram-style="engineering" data-diagram-kind="flow"><style>
.diagram-root{margin:0;background:#fff;color:#303b36;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}
.canvas{position:relative;width:1440px;height:600px;background:#fff;box-sizing:border-box}
.node{position:absolute;box-sizing:border-box;padding:18px 24px;border:1.5px solid #bfcac1;border-radius:8px;background:#fff;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center;z-index:2}
.node strong{font-size:27px;line-height:1.23;font-weight:500;overflow-wrap:anywhere}
.node span{font-size:23px;line-height:1.35;color:#626e66;white-space:pre-line;overflow-wrap:anywhere}
.node.soft{background:#f3f6f1}.node.issue{background:#faf4ef;border-color:#d7c6b8}.node.result{background:#eff5ed;border-color:#9eaf96}
.edge{position:absolute;height:0;border-top:1.5px solid #9caa98;transform-origin:0 0;z-index:1}.edge.feedback{border-top-style:dashed}
.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #9caa98;border-top:4px solid transparent;border-bottom:4px solid transparent}
.label{position:absolute;font-size:21px;line-height:1.3;color:#687366;background:#fff;z-index:3;white-space:pre-line;box-sizing:border-box;padding:3px 6px}
.label.title{font-size:31px;font-weight:500;color:#303b36}.label.lane{font-size:24px;color:#405142}.label.center{text-align:center}
</style><div class="canvas" data-fixed-type="true" data-research-diagram="rubric-model-artifact-io"><div class="edge" data-from="query" data-to="judge" style="left:380px;top:245px;width:60px;transform:rotate(0deg)"></div><div class="edge" data-from="query" data-to="judge" style="left:440px;top:245px;width:85px;transform:rotate(90deg)"></div><div class="edge arrow" data-from="query" data-to="judge" style="left:440px;top:330px;width:80px;transform:rotate(0deg)"></div><div class="edge arrow" data-from="target" data-to="judge" style="left:380px;top:440px;width:140px;transform:rotate(0deg)"></div><div class="edge arrow" data-from="rules" data-to="judge" style="left:720px;top:165px;width:120px;transform:rotate(90deg)"></div><div class="edge" data-from="judge" data-to="verdict" style="left:920px;top:330px;width:80px;transform:rotate(0deg)"></div><div class="edge" data-from="judge" data-to="verdict" style="left:1000px;top:330px;width:55px;transform:rotate(-90deg)"></div><div class="edge arrow" data-from="judge" data-to="verdict" style="left:1000px;top:275px;width:60px;transform:rotate(0deg)"></div><div class="edge" data-from="judge" data-to="issues" style="left:920px;top:430px;width:80px;transform:rotate(0deg)"></div><div class="edge" data-from="judge" data-to="issues" style="left:1000px;top:430px;width:40px;transform:rotate(90deg)"></div><div class="edge arrow" data-from="judge" data-to="issues" style="left:1000px;top:470px;width:60px;transform:rotate(0deg)"></div><div class="node " id="query" style="left:40px;top:185px;width:340px;height:120px"><strong>原始 Query</strong><span>用户需求</span></div><div class="node " id="target" style="left:40px;top:375px;width:340px;height:130px"><strong>产物 Markdown</strong><span>实际配置的导出</span></div><div class="node " id="rules" style="left:520px;top:35px;width:400px;height:130px"><strong>领域规则</strong><span>产品边界 · 评审标准</span></div><div class="node soft" id="judge" style="left:520px;top:285px;width:400px;height:190px"><strong>Artifact-RJM</strong><span>需求落实
实际配置正确性</span><span data-node-detail="true" hidden="">一次输入一个评审领域：domain + query + artifact_markdown。
System 提供该领域的规则；User 提供原始 Query 和该领域的产物 Markdown，不输入 Spec。
覆盖 Table、Dashboard、Workflow、Permission、View 五域；本图展示 Artifact-RJM 的评审格式。</span></div><div class="node result" id="verdict" style="left:1060px;top:215px;width:340px;height:120px"><strong>领域裁决</strong><span>通过 / 不通过</span><span data-node-detail="true" hidden="">JSON：domain、category_reviews、verdict。
每个类别包含 category、status、issues；每条问题包含 rubric_id、mode、severity、reason。
