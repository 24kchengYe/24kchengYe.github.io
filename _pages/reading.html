---
permalink: /reading/
layout: reading
library: true
title: Reading
description: A bookshelf of reports, AI learning topics, and researchers’ writing.
author_profile: false
---
<div class="library" id="library">
  <section id="library-index">
    <header class="library-heading">
      <h1><span lang="en">Reading</span><span lang="zh">阅读</span><span lang="ja">読書</span></h1>
    </header>
    <div class="library-tools">
      <nav class="library-collections" aria-label="Collections">
        <a href="?collection=reports" data-collection="reports" aria-current="page" data-copy="reportsTab">Technical reports</a>
        <a href="?collection=learning" data-collection="learning" data-copy="learningTab">AI learning</a>
        <a href="?collection=researchers" data-collection="researchers" data-copy="researchersTab">Researchers</a>
      </nav>
      <label class="library-search"><span class="visually-hidden" id="library-search-label">Search reports</span><input id="library-search" type="search" autocomplete="off" placeholder="Search title, company, technology"></label>
    </div>
    <div class="library-filters">
      <label id="learning-topic-control"><span class="visually-hidden" data-copy="topicLabel">Topic</span><select id="learning-topic"><option value="" data-copy="allTopics">All topics</option></select></label>
      <label id="library-scope-control"><span class="visually-hidden" data-copy="collection">Collection</span><select id="library-scope">
        <option value="core" data-copy="core">Core · 20</option><option value="online" data-copy="online">Read here · 2</option><option value="selected" data-copy="selected">Selected · 105</option><option value="all" data-copy="all">All · 643</option>
      </select></label>
      <label id="library-tech-control"><span class="visually-hidden" data-copy="technology">Technology</span><select id="library-tech"><option value="" data-copy="allTech">All technologies</option></select></label>
      <button type="button" class="library-reset" id="library-reset" hidden data-copy="reset">Reset</button>
      <p id="library-count" aria-live="polite" role="status"></p>
      <div class="library-tabs" role="group" aria-label="View">
        <button type="button" data-view="shelf" aria-pressed="true"><span lang="en">Bookshelf</span><span lang="zh">书架</span><span lang="ja">本棚</span></button>
        <button type="button" data-view="list" aria-pressed="false"><span lang="en">Index</span><span lang="zh">目录</span><span lang="ja">目録</span></button>
      </div>

    </div>
    <div id="library-shelves" class="library-shelves"></div>
    <div id="library-list" hidden></div>
    <p id="library-empty" class="library-empty" hidden data-copy="empty">No matching reports. Clear the filters or try another term.</p>
    <button id="library-more" class="library-more" type="button" hidden data-copy="more">Show more</button>
    <section id="book-detail" class="book-detail" aria-labelledby="detail-title" hidden></section>
    <footer class="library-note"><p id="library-note-text"></p></footer>
  </section>
  <section id="library-reader" hidden></section>
  <noscript><p>Enable JavaScript for the bookshelf. The full report index is available below.</p>
    <ol>{% for report in site.data.reading.reports %}<li><a href="{{ report.source | escape }}">{{ report.short | escape }}</a> · {{ report.company | escape }}</li>{% endfor %}</ol>
  </noscript>
</div>
