<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>Kernel linear attention</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1440px;overflow:hidden;background:#fff}.node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;border:1.5px solid #a4afa5;background:#fff;border-radius:4px;padding:10px 16px;font-size:24px;line-height:1.4;z-index:2}.node.soft{background:#eff4ec;border-color:#9eaf94}.math{font-size:.86em;color:#56645b}.title{position:absolute;left:40px;top:28px;font-size:29px;font-weight:500}.legend{position:absolute;top:36px;font-size:18px;color:#6a766d}.legend:before{content:"";display:inline-block;width:30px;border-top:1.5px solid #91a08f;vertical-align:middle;margin-right:12px}.legend.control:before{border-top-style:dashed}.edge{position:absolute;height:0;border-top:1.5px solid #91a08f;transform-origin:0 0;z-index:1}.edge.control{border-top-style:dashed}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #91a08f;border-top:4px solid transparent;border-bottom:4px solid transparent}.note{position:absolute;left:40px;width:1360px;font-size:20px;line-height:1.5;color:#68766c;border-top:1px solid #e0e6dc;padding-top:20px}.annotation{position:absolute;font-size:22px;color:#68766c}</style></head><body><main class="canvas" style="height:630px">
<div class="title">Kernel linear attention</div><div class="legend" style="left:760px">实线：张量流</div><div class="legend control" style="left:1070px">虚线：选择 / 门控</div>
<div class="edge arrow" data-from="previous" data-to="update" style="left:290px;top:225px;width:120px;transform:rotate(0deg)"></div>
<div class="edge arrow" data-from="kv" data-to="update" style="left: 575px; top: 410px; width: 110px; transform: rotate(-90deg);"></div>
<div class="edge arrow" data-from="query" data-to="read" style="left:1205px;top:420px;width:120px;transform:rotate(-90deg)"></div>
<div class="edge arrow" data-from="update" data-to="read" style="left:820px;top:220px;width:190px;transform:rotate(0deg)"></div>
<div class="node soft" id="previous" style="left:40px;top:170px;width:250px;height:110px;font-size:24px">上一时刻状态<br><span class="math">Sₜ₋₁, zₜ₋₁</span></div>
<div class="node " id="kv" style="left: 410px; top: 410px; width: 330px; height: 120px; font-size: 24px;">当前隐状态投影<br><span class="math">xₜ → φ(kₜ), vₜ</span></div>
<div class="node soft" id="update" style="left:410px;top:140px;width:410px;height:160px;font-size:24px">外积累加 + 归一化状态<br><span class="math">Sₜ = Sₜ₋₁ + vₜφ(kₜ)ᵀ<br>zₜ = zₜ₋₁ + φ(kₜ)</span></div>
<div class="node " id="query" style="left:1010px;top:420px;width:390px;height:100px;font-size:24px">当前隐状态投影<br><span class="math">xₜ → φ(qₜ)</span></div>
<div class="node soft" id="read" style="left:1010px;top:140px;width:390px;height:160px;font-size:24px">读取并归一化<br><span class="math">oₜ = Sₜφ(qₜ) / (zₜᵀφ(qₜ))</span></div>

<div class="note" style="top:535px">S：value × key 特征；z 负责归一化。S 和 z 一起传递到下一时刻。</div>
</main></body></html>
