<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>cli-offline</title><style>*{box-sizing:border-box}body{margin:0;background:white;color:#303a31;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;overflow:hidden;background:white}.region{position:absolute;border:1px solid #dce2d5;border-radius:5px;background:radial-gradient(#d7dfd3 .65px,transparent .8px);background-size:6px 6px}.title{position:absolute;left:40px;top:18px;font-size:25px;font-weight:500}.node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 16px;border:1.2px solid #a4ae9d;border-radius:8px;background:#fff;font-size:20px;line-height:1.35;z-index:2}.node.source{border-radius:24px;background:#fafbf7}.node.gate{border-radius:0;border-color:#89947f}.node.pending{border-radius:24px;background:#f5f6f3;color:#737c6c}.node.output{background:#edf3e3;border-color:#8da668;border-radius:24px}.sub{font-size:.78em;color:#758269}.edge{position:absolute;height:0;border-top:1.3px solid #a0ac93;transform-origin:0 0;z-index:1}.edge.feedback,.edge.context{border-top-style:dashed}.edge.handoff{border-color:#86a45b;border-top-width:1.8px}.edge.failure{border-color:#c0c6b9}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-4px;border-left:6px solid #a0ac93;border-top:3px solid transparent;border-bottom:3px solid transparent}.edge.handoff.arrow:after{border-left-color:#86a45b}.edge.failure.arrow:after{border-left-color:#c0c6b9}.edge-label{position:absolute;transform:translate(-50%,-50%);font-size:15px;color:#758269;line-height:1.2;background:#fff;padding:2px 4px;white-space:nowrap;z-index:3}.bundle{position:absolute;border:1px solid #b7c5a9;background:#fcfdf9;padding:30px;border-radius:6px;font-size:22px}.bundle h3{margin:0 0 28px;font-size:25px;font-weight:500}.turns{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;color:#64765a}.turns b{padding:7px 18px;border:1px solid #c5d1b5;background:#f5f8ee;border-radius:4px;font-weight:400;font-style:italic}.bundle p{margin:22px 0;display:flex;justify-content:space-between;gap:20px}.bundle hr{border:0;border-top:1px solid #e0e6d6}.environment{position:absolute;display:flex;align-items:center;justify-content:space-evenly;border:1px solid #ced8c3;border-radius:10px;background:#fafcf6;font-size:22px}.dependencies{position:absolute;background:white;border:1px solid #b5c1a6;border-radius:10px;padding:20px;text-align:center;font-size:20px;z-index:2}.dependencies header{margin-bottom:20px}.dependency-row{display:grid;grid-template-columns:repeat(4,1fr);font-size:17px}.dependency-row span+span{border-left:1px solid #dae2d1}.query-note{position:absolute;font-size:19px;line-height:1.6;color:#758269}</style></head><body><main class="canvas" style="width:840px;height:1020px"><div class="region" style="left:25px;top:50px;width:780px;height:950px"></div><div class="title">c · Offline：编辑与准出</div><div class="connection" data-from="C0" data-to="CD"><div class="edge normal arrow" style="left:400px;top:110px;width:48px;transform:rotate(90deg)"></div></div><div class="connection" data-from="CD" data-to="CS"><div class="edge normal arrow" style="left:400px;top:272px;width:48px;transform:rotate(90deg)"></div></div><div class="connection" data-from="CS" data-to="CE"><div class="edge normal" style="left:350px;top:380px;width:26px;transform:rotate(90deg)"></div><div class="edge normal" style="left:350px;top:406px;width:150px;transform:rotate(180deg)"></div><div class="edge normal arrow" style="left:200px;top:406px;width:34px;transform:rotate(90deg)"></div></div><div class="edge-label" style="left:237px;top:388px">单点</div><div class="connection" data-from="CS" data-to="CF"><div class="edge normal" style="left:450px;top:380px;width:26px;transform:rotate(90deg)"></div><div class="edge normal" style="left:450px;top:406px;width:130px;transform:rotate(0deg)"></div><div class="edge normal arrow" style="left:580px;top:406px;width: 756px">通过</div><div class="connection" data-from="CV" data-to="CP"><div class="edge failure" style="left:275px;top:705px;width:230px;transform:rotate(180deg)"></div><div class="edge failure" style="left:45px;top:705px;width:225px;transform:rotate(90deg)"></div><div class="edge failure arrow" style="left:45px;top:930px;width:20px;transform:rotate(0deg)"></div></div><div class="edge-label" style="left:155px;top:685px">未通过</div><div class="connection" data-from="CJ" data-to="CO"><div class="edge handoff" style="left:400px;top:840px;width:35px;transform:rotate(90deg)"></div><div class="edge handoff" style="left:400px;top:875px;width:180px;transform:rotate(0deg)"></div><div class="edge handoff arrow" style="left:580px;top:875px;width:25px;transform:rotate(90deg)"></div></div><div class="edge-label" style="left:580px;top:855px">4 / 5 分</div><div class="connection" data-from="CJ" data-to="CP"><div class="edge failure" style="left:275px;top:810px;width:105px;transform:rotate(180deg)"></div><div class="edge failure arrow" style="left:170px;top:810px;width:90px;transform:rotate(90deg)"></div></div><div class="edge-label" style="left:219px;top:790px">未准出</div><div class="connection" data-from="BO" data-to="C0"><div class="edge handoff arrow" style="left:50px;top:80px;width:215px;transform:rotate(0deg)"></div></div><div class="edge-label" style="left:125px;top:58px">来自 Online</div><div class="node process" id="C0" style="left:265px;top:50px;width:270px;height:60px;font-size:20px">定位准出问题</div>
<div class="dependencies" id="CD" style="left:95px;top:158px;width:610px;height:114px"><header>Turn 依赖</header><div class="dependency-row"><span>资源状态</span><span>数值返回</span><span>控制条件</span><span>文字上下文</span></div></div>

<div class="node process" id="CE" style="left:90px;top:440px;width:220px;height:60px;font-size:20px">单 turn 编辑</div>
<div class="node process" id="CF" style="left:465px;top:440px;width:230px;height:60px;font-size:20px">依赖片段编辑</div>
<div class="node process" id="CC" style="left:255px;top:566px;width:290px;height:68px;font-size:20px">思维链清洗<br><span class="sub">教师痕迹 · 无关上下文</span></div>
<div class="node gate" id="CV" style="left:275px;top:675px;width:250px;height:60px;font-size:20px">修后校验</div>
<div class="node process" id="CJ" style="left:275px;top:780px;width:250px;height:60px;font-size:20px">三轮 Judge</div>
<div class="node output" id="CO" style="left:465px;top:900px;width:230px;height:60px;font-size:20px">SFT 数据</div>
<div class="node pending" id="CP" style="left:65px;top:900px;width:210px;height:60px;font-size:20px">Pending</div></main></body></html>
