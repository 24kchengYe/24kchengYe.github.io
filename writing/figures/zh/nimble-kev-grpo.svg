<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" width="1440" height="640" lang="zh"><foreignObject width="1440" height="640"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>
*{box-sizing:border-box}.diagram-root{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1440px;height:640px;background:#fff;overflow:hidden}.node{position:absolute;display:flex;align-items:center;justify-content:center;border:1.5px solid #63716a;background:#fff;padding:12px 16px;text-align:center;font-size:26px;line-height:1.4;border-radius:3px}.soft{background:#edf3e9;border-color:#768d6d}.quiet{background:#f6f7f5;border-color:#c6cdc6}.dotted{background-image:radial-gradient(#c7d3bd .9px,transparent .9px);background-size:7px 7px}.label{position:absolute;font-size:23px;line-height:1.45;color:#65736a}.title{font-size:28px;font-weight:500;color:#303c38}.mono{font-family:ui-monospace,Menlo,monospace}.arrow{position:absolute;height:0;border-top:1.5px solid #7b897f}.arrow:after{content:"";position:absolute;right:-1px;top:-4.5px;border-left:7px solid #7b897f;border-top:4px solid transparent;border-bottom:4px solid transparent}.vertical{position:absolute;width:0;border-left:1.5px solid #7b897f}.down:after{content:"";position:absolute;left:-4.5px;bottom:-1px;border-top:7px solid #7b897f;border-left:4px solid transparent;border-right:4px solid transparent}.up:after{content:"";position:absolute;left:-4.5px;top:-1px;border-bottom:7px solid #7b897f;border-left:4px solid transparent;border-right:4px solid transparent}.rule{position:absolute;border-top:1px solid #dce2dc;height:0}.note{position:absolute;font-size:22px;line-height:1.55;color:#65736a}
</style><main class="canvas">
<div class="label title" style="left:42px;top:32px">在 logits 上探索，在组内比较奖励</div>
<div class="label" style="left:42px;top:102px">每条 query 一组 · G = 8</div>
<div class="node" style="left:42px;top:232px;width:190px;height:116px"><span style="min-width: 0; overflow-wrap: anywhere;">模型分数<br /><span class="mono">z</span></span></div>
<div class="arrow" style="left:232px;top:290px;width:39px"></div>
<div class="node dotted" style="left:271px;top:232px;width:190px;height:116px"><span style="min-width: 0; overflow-wrap: anywhere;">8 次高斯扰动<br /><span class="mono">z + εg</span></span></div>
<div class="arrow" style="left:461px;top:290px;width:39px"></div>
<div class="node" style="left:500px;top:232px;width:190px;height:116px"><span style="min-width: 0; overflow-wrap: anywhere;">Softmax<br /><span class="mono">pg</span></span></div>
<div class="arrow" style="left:690px;top:290px;width:39px"></div>
<div class="node soft" style="left:729px;top:232px;width:214px;height:116px"><span style="min-width: 0; overflow-wrap: anywhere;">计算奖励<br />Brier / RLCR</span></div>
<div class="arrow" style="left:943px;top:290px;width:39px"></div>
<div class="node" style="left:982px;top:232px;width:190px;height:116px"><span style="min-width: 0; overflow-wrap: anywhere;">组内相对优势</span></div>
<div class="arrow" style="left:1172px;top:290px;width:36px"></div>
<div class="node soft" style="left:1208px;top:232px;width:190px;height:116px"><span style="min-width: 0; overflow-wrap: anywhere;">策略更新<br />+ 稳定项</span></div>
<div class="label" style="left:729px;top:117px;width:214px;text-align:center">参考目标 t</div>
<div class="vertical down" style="left:836px;top:160px;height:72px"></div>
<div class="vertical" style="left:1303px;top:348px;height:106px;border-left-style:dashed"></div>
<div class="rule" style="left:137px;top:454px;width:1166px;border-top:1.5px dashed #7b897f"></div>
<div class="vertical up" style="left:137px;top:348px;height:106px;border-left-style:dashed"></div>
<div class="label" style="left:466px;top:474px;width:600px;text-align:center">更新 LoRA / 选择头</div>
<div class="note" style="left:42px;top:566px;width:1356px">候选是概率向量；探索过程不生成推理文本。</div></main></div></foreignObject></svg>
