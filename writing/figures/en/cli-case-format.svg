<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1170" width="1200" height="1170" lang="en"><foreignObject width="1200" height="1170"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>*{box-sizing:border-box}.diagram-root{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1200px;background:#fff;overflow:hidden}.heading{position:absolute;left:50px;top:22px;font-size:30px;line-height:1.3}.node{position:absolute;display:flex;align-items:center;justify-content:center;padding:14px 18px;text-align:center;border:1px solid #a6b1a1;border-radius:5px;background:#fff;font-size:28px;line-height:1.28;z-index:2}.soft{background:#f1f5ec}.node.foundation{background:#eaf0e4;border-color:#839675}.node.plan{border-style:dashed}.sub{display:block;margin-top:8px;font-size:24px;line-height:1.4;color:#687568}.label{position:absolute;font-size:22px;line-height:1.35;color:#687568;background:#fff;padding:3px 4px;text-align:center;z-index:3}.region{position:absolute;border:1px solid #c6d0bf;border-radius:8px}.region-title{position:absolute;top:-21px;left:22px;padding:0 12px;background:#fff;font-size:28px;line-height:1.4}.edge{position:absolute;height:0;border-top:1.5px solid #8b9b83;transform-origin:0 0;z-index:1}.edge.support{border-top-style:dashed;stroke-dasharray:4 4}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #8b9b83;border-top:4px solid transparent;border-bottom:4px solid transparent}.note{position:absolute;font-size:22px;line-height:1.45;color:#687568}</style><main class="canvas" data-fixed-type="" style="height:1170px"><div class="heading">A trajectory: execution state, versions, and outcomes</div>
<div id="before" class="node " style="left:60px;top:120px;width:350px;height:330px"><span style="min-width: 0; overflow-wrap: anywhere;">Sₜ · Current state<br /><span class="sub">Message context Mₜ<br />Files / Base state Eₜ<br />Plan Pₜ (when integrated)<br />Remaining budget Bₜ</span></span></div>
<div id="action" class="node " style="left:470px;top:135px;width:260px;height:140px"><span style="min-width: 0; overflow-wrap: anywhere;">aₜ · Tool action<br /><span class="sub">Read / Write / Bash</span></span></div>
<div id="observation" class="node " style="left:470px;top:310px;width:260px;height:140px"><span style="min-width: 0; overflow-wrap: anywhere;">oₜ · Observation<br /><span class="sub">tool_call_id pairing</span></span></div>
<div id="after" class="node soft" style="left:790px;top:120px;width:350px;height:330px"><span style="min-width: 0; overflow-wrap: anywhere;">Sₜ₊₁ · Updated state<br /><span class="sub">Mₜ adds action &amp; response<br />Eₜ follows actual execution<br />Pₜ updates when needed<br />Bₜ accounts for usage</span></span></div>
<div class="connection" data-from="before" data-to="action" data-relation="flow"><div class="edge flow arrow" style="left:410px;top:205px;width:60px;transform:rotate(0deg)"></div></div>
<div class="connection" data-from="action" data-to="after" data-relation="flow"><div class="edge flow arrow" style="left:730px;top:205px;width:60px;transform:rotate(0deg)"></div></div>
<div class="connection" data-from="action" data-to="observation" data-relation="flow"><div class="edge flow arrow" style="left:600px;top:275px;width:35px;transform:rotate(90deg)"></div></div>
<div class="connection" data-from="observation" data-to="after" data-relation="flow"><div class="edge flow arrow" style="left:730px;top:380px;width:60px;transform:rotate(0deg)"></div></div>
<div class="note" style="left:60px;top:490px;width:1080px">Execution may change the environment; real observations enter context for the next turn.</div>
<div class="heading" style="top:570px">Repair example · preserve evidence for each version</div>
<div id="original" class="node " style="left:60px;top:650px;width:300px;height:150px"><span style="min-width: 0; overflow-wrap: anywhere;">Original trace v₀<br /><span class="sub">Messages &amp; real responses</span></span></div>
<div id="regenerated" class="node " style="left:450px;top:650px;width:300px;height:150px"><span style="min-width: 0; overflow-wrap: anywhere;">Regenerated v₁<br /><span class="sub">New run · new responses</span></span></div>
<div id="edited" class="node " style="left:840px;top:650px;width:300px;height:150px"><span style="min-width: 0; overflow-wrap: anywhere;">Edited v₁′<br /><span class="sub">Patch · dependency checks</span></span></div>
<div class="connection" data-from="original" data-to="regenerated" data-relation="flow"><div class="edge flow arrow" style="left:360px;top:725px;width:90px;transform:rotate(0deg)"></div></div>
<div class="connection" data-from="regenerated" data-to="edited" data-relation="flow"><div class="edge flow arrow" style="left:750px;top:725px;width:90px;transform:rotate(0deg)"></div></div>
<div class="label" style="left:360px;top:679px;width:90px">Online</div>
<div class="label" style="left:750px;top:679px;width:90px">Offline</div>
<div class="heading" style="top:855px">Each version has three distinct outcomes</div>
<div id="execution" class="node " style="left:60px;top:925px;width:320px;height:135px"><span style="min-width: 0; overflow-wrap: anywhere;">Run result<br /><span class="sub">succeeded / failed</span></span></div>
<div id="review" class="node " style="left:440px;top:925px;width:320px;height:135px"><span style="min-width: 0; overflow-wrap: anywhere;">Judge verdict<br /><span class="sub">Issues · score · evidence</span></span></div>
<div id="decision" class="node " style="left:820px;top:925px;width:320px;height:135px"><span style="min-width: 0; overflow-wrap: anywhere;">Release decision<br /><span class="sub">Released / Pending</span></span></div>
<div class="note" style="left:60px;top:1100px;width:1080px">A completed run may fail review; Pending does not mean execution failed.</div>
</main></div></foreignObject></svg>
