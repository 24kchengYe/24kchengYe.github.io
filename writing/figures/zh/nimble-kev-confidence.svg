<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" width="1440" height="640" lang="zh"><foreignObject width="1440" height="640"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root" data-diagram-style="openai-blog" data-diagram-kind="data"><style>
*{box-sizing:border-box}.diagram-root{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1440px;height:640px;background:#fff;overflow:hidden}.node{position:absolute;display:flex;align-items:center;justify-content:center;border:1.5px solid #63716a;background:#fff;padding:12px 16px;text-align:center;font-size:26px;line-height:1.4;border-radius:3px}.soft{background:#edf3e9;border-color:#768d6d}.quiet{background:#f6f7f5;border-color:#c6cdc6}.dotted{background-image:radial-gradient(#c7d3bd .9px,transparent .9px);background-size:7px 7px}.label{position:absolute;font-size:23px;line-height:1.45;color:#65736a}.title{font-size:28px;font-weight:500;color:#303c38}.mono{font-family:ui-monospace,Menlo,monospace}.arrow{position:absolute;height:0;border-top:1.5px solid #7b897f}.arrow:after{content:"";position:absolute;right:-1px;top:-4.5px;border-left:7px solid #7b897f;border-top:4px solid transparent;border-bottom:4px solid transparent}.vertical{position:absolute;width:0;border-left:1.5px solid #7b897f}.down:after{content:"";position:absolute;left:-4.5px;bottom:-1px;border-top:7px solid #7b897f;border-left:4px solid transparent;border-right:4px solid transparent}.up:after{content:"";position:absolute;left:-4.5px;top:-1px;border-bottom:7px solid #7b897f;border-left:4px solid transparent;border-right:4px solid transparent}.rule{position:absolute;border-top:1px solid #dce2dc;height:0}.note{position:absolute;font-size:22px;line-height:1.55;color:#65736a}
.legend{position:absolute;display:flex;align-items:center;gap:14px;font-size:23px;color:#65736a}.legend i{display:inline-block;width:24px;height:14px;background:#d4dad5;margin-left:32px}.legend i:first-child{margin-left:0}.legend .trained,.bar.trained{background:#c1d3ae}.panel{position:absolute;top:170px;width:424px;height:378px}.panel h2{font-size:26px;font-weight:500;margin:0 0 12px;line-height:1.4}.panel p{font-size:21px;color:#65736a;margin:0}.plot{position:absolute;top:121px;left:30px;width:344px;height:216px;border-bottom:1px solid #75847a;background:repeating-linear-gradient(to top,transparent 0,transparent 53px,#e8ece7 53px,#e8ece7 54px)}.bar{position:absolute;left:62px;bottom:0;width:78px;background:#d4dad5}.bar b{position:absolute;top:-34px;left:50%;transform:translateX(-50%);font-size:23px;white-space:nowrap;font-weight:500;color:#303c38}.ends{position:absolute;left:4px;top:354px;display:flex;gap:12px;font-size:18px;color:#75847a}.ends span:last-child{position:absolute;top:-246px;left:0}
.diagram-root{font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.label,.legend,.note,.annotation,.small-note,.caption,.axis{font-size:22px}.title,.label.title{font-size:30px}.group-title,.chart h2{font-size:26px}.chart-row,.plot-row,.matrix&gt;div,.stat-grid p,.val{font-size:26px}.matrix .muted,.math,.legend,.small{font-size:24px}</style><main class="canvas">
<div class="label title" style="left:42px;top:32px">从基线到硬标签 SFT</div>
<div class="legend" style="left:42px;top:94px"><i></i><span>训练前</span><i class="trained"></i><span>硬标签 SFT</span></div>
<div class="panel" style="left:42px"><h2>内部准确率</h2><p>499 · 内部回归集</p><div class="plot"><div class="scale"></div><div class="bar" style="height:78.76%"><b>78.76%</b></div><div class="bar trained" style="left:204px;height:98.20%"><b>98.20%</b></div></div><div class="ends"><span>0%</span><span>100%</span></div></div>
<div class="panel" style="left:508px"><h2>外部标签一致率</h2><p>20,000 · 原外部标签</p><div class="plot"><div class="scale"></div><div class="bar" style="height:65.53%"><b>65.53%</b></div><div class="bar trained" style="left:204px;height:65.02%"><b>65.02%</b></div></div><div class="ends"><span>0%</span><span>100%</span></div></div>
<div class="panel" style="left:974px"><h2>高置信预测占比</h2><p>20,000 · max(p) ≥ 0.9</p><div class="plot"><div class="scale"></div><div class="bar" style="height:26.35%"><b>26.35%</b></div><div class="bar trained" style="left:204px;height:88.33%"><b>88.33%</b></div></div><div class="ends"><span>0%</span><span>100%</span></div></div>
<div class="note" style="left:42px;top:581px;width:1356px">外部一致率基本不变，高置信预测占比却大幅上升。</div></main><style>[data-diagram-style="openai-blog"] {
  --diagram-ink:#202020;
  --diagram-muted:#62625e;
