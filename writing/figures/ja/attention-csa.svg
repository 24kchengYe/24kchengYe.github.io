<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 850" width="1440" height="850" lang="ja"><foreignObject width="1440" height="850"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>*{box-sizing:border-box}.diagram-root{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1440px;overflow:hidden;background:#fff}.node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;border:1.5px solid #a4afa5;background:#fff;border-radius:4px;padding:10px 16px;font-size:24px;line-height:1.4;z-index:2}.node.soft{background:#eff4ec;border-color:#9eaf94}.math{font-size:.86em;color:#56645b}.title{position:absolute;left:40px;top:28px;font-size:29px;font-weight:500}.legend{position:absolute;top:36px;font-size:18px;color:#6a766d}.legend:before{content:"";display:inline-block;width:30px;border-top:1.5px solid #91a08f;vertical-align:middle;margin-right:12px}.legend.control:before{border-top-style:dashed}.edge{position:absolute;height:0;border-top:1.5px solid #91a08f;transform-origin:0 0;z-index:1}.edge.control{border-top-style:dashed}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #91a08f;border-top:4px solid transparent;border-bottom:4px solid transparent}.note{position:absolute;left:40px;width:1360px;font-size:20px;line-height:1.5;color:#68766c;border-top:1px solid #e0e6dc;padding-top:20px}.annotation{position:absolute;font-size:22px;color:#68766c}
.diagram-root{font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.label,.legend,.note,.annotation,.small-note,.caption,.axis{font-size:22px}.title,.label.title{font-size:30px}.group-title,.chart h2{font-size:26px}.chart-row,.plot-row,.matrix&gt;div,.stat-grid p,.val{font-size:26px}.matrix .muted,.math,.legend,.small{font-size:24px}</style><main class="canvas" style="height:850px">
<div class="title">CSA</div><div class="legend" style="left:760px">実線：テンソル</div><div class="legend control" style="left:1070px">破線：選択・ゲート</div>
<div class="edge" data-from="history" data-to="compressed" style="left:260px;top:330px;width:40px;transform:rotate(0deg)"></div>
<div class="edge" data-from="history" data-to="compressed" style="left:300px;top:330px;width:135px;transform:rotate(-90deg)"></div>
<div class="edge arrow" data-from="history" data-to="compressed" style="left:300px;top:195px;width:60px;transform:rotate(0deg)"></div>
<div class="edge" data-from="history" data-to="index-key" style="left:260px;top:370px;width:40px;transform:rotate(0deg)"></div>
<div class="edge" data-from="history" data-to="index-key" style="left:300px;top:370px;width:35px;transform:rotate(90deg)"></div>
<div class="edge arrow" data-from="history" data-to="index-key" style="left:300px;top:405px;width:60px;transform:rotate(0deg)"></div>
<div class="edge" data-from="history" data-to="local" style="left: 150px; top: 410px; width: 200px; transform: rotate(90deg);"></div>
<div class="edge arrow" data-from="history" data-to="local" style="left:150px;top:610px;width:210px;transform:rotate(0deg)"></div>
<div class="edge arrow" data-from="compressed" data-to="gather" style="left:650px;top:195px;width:90px;transform:rotate(0deg)"></div>
<div class="edge arrow" data-from="index-key" data-to="indexer" style="left:650px;top:405px;width:90px;transform:rotate(0deg)"></div>
<div class="edge control arrow" data-from="indexer" data-to="gather" style="left:880px;top:350px;width:100px;transform:rotate(-90deg)"></div>
<div class="edge arrow" data-from="query" data-to="indexer" style="left: 880px; top: 550px; width: 90px; transform: rotate(-90deg);"></div>
<div class="edge" data-from="query" data-to="attention" style="left:1020px;top:610px;width:40px;transform:rotate(0deg)"></div>
<div class="edge" data-from="query" data-to="attention" style="left:1060px;top:610px;width:310px;transform:rotate(-90deg)"></div>
<div class="edge arrow" data-from="query" data-to="attention" style="left:1060px;top:300px;width:40px;transform:rotate(0deg)"></div>
<div class="edge arrow" data-from="gather" data-to="attention" style="left:1020px;top:195px;width:80px;transform:rotate(0deg)"></div>
<div class="edge" data-from="local" data-to="attention" style="left:650px;top:610px;width:40px;transform:rotate(0deg)"></div>
<div class="edge" data-from="local" data-to="attention" style="left:690px;top:610px;width:130px;transform:rotate(90deg)"></div>
<div class="edge" data-from="local" data-to="attention" style="left:690px;top:740px;width:560px;transform:rotate(0deg)"></div>
<div class="edge arrow" data-from="local" data-to="attention" style="left:1250px;top:740px;width:400px;transform:rotate(-90deg)"></div>
<div class="node " id="history" style="left: 40px; top: 290px; width: 220px; height: 120px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">履歴の隠れ状態<br /><span class="math">X</span></span></div>
<div class="node soft" id="compressed" style="left: 360px; top: 140px; width: 290px; height: 110px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">系列方向に圧縮した KV<br /><span class="math">N × c → ≈ (N/m) × c</span></span></div>
<div class="node " id="index-key" style="left: 360px; top: 330px; width: 290px; height: 150px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">独立投影した圧縮索引キー<br /><span class="math">X → Kᴵ</span></span></div>
<div class="node soft" id="local" style="left: 360px; top: 550px; width: 290px; height: 120px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">局所の非圧縮 KV<br /><span class="math">X → Kʷⁱⁿ, Vʷⁱⁿ</span></span></div>
<div class="node soft" id="gather" style="left: 740px; top: 140px; width: 280px; height: 110px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">選択した圧縮エントリを取得<br /><span class="math">C[selected]</span></span></div>
<div class="node " id="indexer" style="left: 740px; top: 350px; width: 280px; height: 110px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">Lightning Indexer<br /><span class="math">score(Qᴵ, Kᴵ) → Top-k</span></span></div>
<div class="node " id="query" style="left: 740px; top: 550px; width: 280px; height: 120px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">現在状態の投影<br /><span class="math">xₜ → cQ → Q, Qᴵ</span></span></div>
<div class="node soft" id="attention" style="left: 1100px; top: 140px; width: 300px; height: 200px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">注意力による読み出し<br /><span class="math">KV ← [C[selected]; KVʷⁱⁿ]<br />Attention(Q, KV) → oₜ</span></span></div>

<div class="note" style="top:755px">索引器が返すのは位置。選択した圧縮 KV と局所 KV を主注意力で読み出す。</div>
</main></div></foreignObject></svg>
