<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" width="1440" height="640" lang="ja"><foreignObject width="1440" height="640"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>
*{box-sizing:border-box}.diagram-root{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1440px;height:640px;background:#fff;overflow:hidden}.node{position:absolute;display:flex;align-items:center;justify-content:center;border:1.5px solid #63716a;background:#fff;padding:12px 16px;text-align:center;font-size:26px;line-height:1.4;border-radius:3px}.soft{background:#edf3e9;border-color:#768d6d}.quiet{background:#f6f7f5;border-color:#c6cdc6}.dotted{background-image:radial-gradient(#c7d3bd .9px,transparent .9px);background-size:7px 7px}.label{position:absolute;font-size:23px;line-height:1.45;color:#65736a}.title{font-size:28px;font-weight:500;color:#303c38}.mono{font-family:ui-monospace,Menlo,monospace}.arrow{position:absolute;height:0;border-top:1.5px solid #7b897f}.arrow:after{content:"";position:absolute;right:-1px;top:-4.5px;border-left:7px solid #7b897f;border-top:4px solid transparent;border-bottom:4px solid transparent}.vertical{position:absolute;width:0;border-left:1.5px solid #7b897f}.down:after{content:"";position:absolute;left:-4.5px;bottom:-1px;border-top:7px solid #7b897f;border-left:4px solid transparent;border-right:4px solid transparent}.up:after{content:"";position:absolute;left:-4.5px;top:-1px;border-bottom:7px solid #7b897f;border-left:4px solid transparent;border-right:4px solid transparent}.rule{position:absolute;border-top:1px solid #dce2dc;height:0}.note{position:absolute;font-size:22px;line-height:1.55;color:#65736a}

.diagram-root{font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.label,.legend,.note,.annotation,.small-note,.caption,.axis{font-size:22px}.title,.label.title{font-size:30px}.group-title,.chart h2{font-size:26px}.chart-row,.plot-row,.matrix&gt;div,.stat-grid p,.val{font-size:26px}.matrix .muted,.math,.legend,.small{font-size:24px}</style><main class="canvas">
<div class="label title" style="left:42px;top:32px">同じタスク、異なる採点ヘッド</div>
<div class="node quiet" style="left: 42px; top: 252px; width: 254px; height: 108px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">ルール + クエリ<br />選択肢の説明</span></div>
<div class="arrow" style="left:296px;top:306px;width:36px"></div><div class="vertical" style="left:332px;top:192px;height:228px"></div>
<div class="arrow" style="left:332px;top:192px;width:46px"></div><div class="arrow" style="left:332px;top:420px;width:46px"></div>
<div class="label" style="left:378px;top:101px">Nimble · 9B</div>
<div class="node" style="left: 378px; top: 140px; width: 266px; height: 104px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">回答位置の状態</span></div>
<div class="arrow" style="left:644px;top:192px;width:52px"></div>
<div class="node dotted" style="left: 696px; top: 117px; width: 294px; height: 150px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">固定した語彙ヘッド<br />A / B / C のスコア</span></div>
<div class="label" style="left:378px;top:329px">KEV · 0.8B</div>
<div class="node" style="left: 378px; top: 368px; width: 266px; height: 104px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">決定位置 + 選択肢の状態</span></div>
<div class="arrow" style="left:644px;top:420px;width:52px"></div>
<div class="node soft" style="left: 696px; top: 345px; width: 294px; height: 150px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">学習する選択ヘッド<br />256 次元射影 + 内積</span></div>
<div class="arrow" style="left:990px;top:192px;width:86px"></div><div class="arrow" style="left:990px;top:420px;width:86px"></div>
<div class="node quiet" style="left: 1076px; top: 140px; width: 322px; height: 104px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">Softmax<br />3 クラスの確率</span></div>
<div class="node quiet" style="left: 1076px; top: 368px; width: 322px; height: 104px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">Softmax<br />3 クラスの確率</span></div>
<div class="rule" style="left:42px;top:532px;width:1356px"></div>
<div class="note" style="left:42px;top:557px;width:1356px">両者とも基盤モデルを固定し、既存 LoRA を更新。KEV は選択ヘッドも更新する。</div></main></div></foreignObject></svg>
