worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    types { application/javascript mjs; text/plain md; }
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    map $uri $document_policy {
        default "";
        ~\.html$ "default-src 'none'; img-src https: data:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'";
    }
    server {
        listen 8080;
        root /srv/releases/current/site;
        index index.html;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        location = /healthz { access_log off; return 200 "ok\n"; }
        location ~ /\. { deny all; }
        location ~* \.(?:jsonl|log|env|ya?ml|pem|key|tar|gz|zip)$ { return 404; }
        location ~ "^/reading/files/([a-z0-9]{12}\.[a-f0-9]{16}\.(?:original|zh|dual|preview)\.(?:pdf|md|html))$" {
            alias /srv/releases/library-files/$1;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range" always;
            add_header Content-Security-Policy $document_policy;
        }
        location /reading/files/ { return 404; }
        location /reading/library-preview/files/ {
            add_header Cache-Control "public, max-age=86400";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }
        location / { try_files $uri $uri/ =404; }
    }
}
