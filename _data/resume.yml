        International</a>, <a href="https://doi.org/10.1016/j.jag.2022.102942">JAG</a>
      paragraphs:
      - 城市研究由于尺度多样、空间异质和变化复杂，缺乏标准化的大规模城市数据集。提出<strong>面向连续时空演化的多时相视觉解译和空间匹配</strong>方法。构建<a href="https://doi.org/10.1016/j.isci.2024.110125">GloPPRUA</a>、<a
        href="https://doi.org/10.1016/j.habitatint.2025.103350">GloGCI</a>与<a href="https://doi.org/10.1038/s41597-025-04730-5">CMAB</a>。针对历史—现代遥感影像的分辨率退化、轮廓锯齿与系统性位移，设计<strong>分辨率分布匹配增强的
        HRNet-W48+U-Net</strong>（强模糊 Dice 由<strong>0.684 提升至 0.756</strong>），以<strong>RGB–Mask 四通道 GAN</strong>联合对抗、L1、IoU
        与边缘损失规整轮廓（建筑轮廓直角率由<strong>0.398 提升至 0.624</strong>），再经 1 m DP 矢量化、条件形态路由与安全回退生成可追溯 Polygon；结合同年代多日期补证、全局—局部偏移校准及两轮七特征上下文匹配构建跨期关系图，在
        1,000 城形成约<strong>1,478 万个双期建筑观测实例</strong>。CMAB 与 GloGCI 均入选<strong>ESI 高被引论文</strong>（Top 1%），<a href="https://figshare.com/authors/Yecheng_Zhang/20402873"><strong>数据与代码累计获得
        79,500 次下载</strong></a>。
      papers:
