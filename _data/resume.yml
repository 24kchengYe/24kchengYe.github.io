    entries:
    - id: urbanalign
      title: '[1] LLM post-training | Semantic alignment with human visual preferences'
      date: 2025.10 – 2026.02
      role: First + corresponding author | <a href="https://doi.org/10.1007/978-3-032-37132-4_18">ECCV 2026</a>
      paragraphs:
      - 'Large vision-language models (VLMs) can recognize a rich range of visual elements, but their outputs systematically
        diverge from human preferences. Existing alignment methods depend on large amounts of annotated data and compute and
        lack interpretability. Proposed <strong>post-hoc concept bottleneck alignment for visual RAG</strong> (Post-hoc Concept
        Bottleneck): automatically discover interpretable evaluation dimensions, extract robust concept scores from frozen
        VLMs through an Observer-Debater-Judge multi-agent chain, and calibrate them to human ratings using locally weighted
        ridge regression on a hybrid visual-semantic manifold. An end-to-end dimension-optimization loop <strong>jointly ensures
        accuracy and interpretability</strong>. Achieved <strong>72.2%</strong> accuracy (κ=0.45) in urban scene perception,
        exceeding the supervised baseline by <strong>15.1 pp</strong> and the uncalibrated VLM by <strong>16.3 pp</strong>.'
      papers:
      - 'Paper: <strong>Zhang Y</strong>*, Zhao R, …, Shi C*. UrbanAlign: Post-hoc Semantic Calibration for VLM-Human Preference
        Alignment. <a href="https://doi.org/10.1007/978-3-032-37132-4_18">ECCV 2026</a>.'
    - id: urban-data
      title: '[2] AI4Science | Multimodal urban data mining'
      date: 2021.09 – 2025.10
      role: First author and other authorship roles | <a href="https://doi.org/10.1038/s41597-025-04730-5">Scientific Data</a>,
        <a href="https://arxiv.org/abs/2505.07057">CVPR</a>, <a href="https://arxiv.org/abs/2511.17558">AAAI</a>, <a href="https://doi.org/10.1016/j.habitatint.2025.103350">Habitat
        International</a>, <a href="https://doi.org/10.1016/j.jag.2022.102942">JAG</a>
      paragraphs:
      - Urban research lacks standardized, large-scale urban datasets because of diverse scales, spatial heterogeneity, and
        complex change. Proposed <strong>multi-temporal visual interpretation and spatial matching for continuous spatiotemporal
        evolution</strong>. Built <a href="https://doi.org/10.1016/j.isci.2024.110125">GloPPRUA</a>, <a href="https://doi.org/10.1016/j.habitatint.2025.103350">GloGCI</a>,
        and <a href="https://doi.org/10.1038/s41597-025-04730-5">CMAB</a>. To address resolution degradation, jagged contours,
        and systematic displacement between historical and modern remote-sensing images, designed <strong>HRNet-W48+U-Net
        enhanced with resolution-distribution matching</strong> (improving Dice under strong blur from <strong>0.684 to 0.756</strong>).
        Used a <strong>four-channel RGB–Mask GAN</strong> combining adversarial, L1, IoU, and edge losses to regularize contours
        (improving the building-contour right-angle ratio from <strong>0.398 to 0.624</strong>), then generated traceable
        Polygons through 1 m DP vectorization, conditional morphological routing, and safe fallback. Combined supplementary
        evidence from multiple dates within the same period, global-local offset calibration, and two rounds of seven-feature
        contextual matching to build cross-period relationship graphs, yielding approximately <strong>14.78 million two-period
        building observations</strong> across 1,000 cities. Both CMAB and GloGCI were selected as <strong>ESI Highly Cited
        Papers</strong> (Top 1%); <a href="https://figshare.com/authors/Yecheng_Zhang/20402873"><strong>the data and code
        received 79,500 cumulative downloads</strong></a>.
      papers:
      - 'Paper: <strong>Zhang Y</strong><sup>†</sup>, Zhao H<sup>†</sup>, Long Y*. CMAB: A Multi-Attribute Building Dataset
        of China. <a href="https://doi.org/10.1038/s41597-025-04730-5">Scientific Data</a>, 2025.'
      - 'Paper: <strong>Zhang Y</strong>, Tu T, Long Y*. Inferring Ghost Cities on the Globe in Newly Developed Urban Areas
        Based on Urban Vitality with Multi-source Data. <a href="https://doi.org/10.1016/j.habitatint.2025.103350">Habitat
        International</a>, 2025.'
      - 'Paper: <strong>Zhang Y</strong>, Zhang Q, …, Zheng H*. Urban Spatial Risk Prediction and Optimization Analysis of
        POI Based on Deep Learning. <a href="https://doi.org/10.1016/j.jag.2022.102942">International Journal of Applied Earth
        Observation and Geoinformation</a>, 2022.'
      - 'Paper: <strong>Zhang Y</strong>, Long Y*. Towards building-scale urban analytics and simulation. Building Simulation,
        2026.'
    - id: ai4us
      title: '[3] AI4Science | LLM-based scientific data synthesis and controlled experiments'
      date: 2024.09 – Present
      role: First / corresponding author | <a href="https://arxiv.org/abs/2505.13803">arXiv</a>
      paragraphs:
      - 'Generative large models are being used for scientific data synthesis, but reproducing significant relationships does
        not amount to recovering empirical parameters or data heterogeneity, or supporting reproducible experiments. Proposed
        the <strong>AI4US multimodal evaluation framework</strong>, which follows two paths—Data Synthesis and Conditional
        Intervention—to jointly evaluate <strong>relationship reproduction, consistency with empirical parameters/distributions,
        and responses to controlled conditions</strong> across four task types: urban scaling, distance decay, neighborhood
        vitality, and streetscape perception. Results show that GenAI can recover identifiable urban regularities and produce
        stable directional responses across all four task types, but systematically compresses <strong>numerical coverage,
        local variation, and visual diversity</strong>. Further developed <strong>Profile–Probe–Intervene mechanistic analysis</strong>
        on Qwen2.5-VL-72B, verifying that some regularities can be decoded from intermediate representations and affect local
        outputs.'
      papers:
      - 'Paper: <strong>Zhang Y</strong>, Zhao R, Huang Z, Long Y*. GenAI Models Capture Urban Science but Oversimplify Complexity.
        <a href="https://arxiv.org/abs/2505.13803">arXiv</a>, 2025.'
      - 'Paper: Zhao R, Liu W, …, <strong>Zhang Y</strong>*. Large Language Models Perceive Cities through a Culturally Uneven
        Baseline. <a href="https://arxiv.org/abs/2604.20048">arXiv</a>, 2026.'
