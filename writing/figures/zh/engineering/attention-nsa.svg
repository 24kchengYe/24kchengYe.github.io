[data-diagram-style="engineering"] .canvas :is(.label,.edge-label,.note) { background-color:#fff; }
[data-diagram-style="engineering"] .canvas .vector-canvas,
[data-diagram-style="engineering"] .vector-canvas { background:#fff; }
[data-diagram-style="engineering"] [data-diagram-node] { filter:none; }
