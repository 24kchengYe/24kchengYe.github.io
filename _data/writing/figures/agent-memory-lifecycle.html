<!doctype html><html lang="zh"><meta charset="utf-8"><title>记忆能否跨过任务边界</title><style>
body{margin:0;background:#fff;color:#303b36;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}
.canvas{position:relative;width:1400px;height:760px;background:#fff;box-sizing:border-box}
.node{position:absolute;box-sizing:border-box;padding:18px 24px;border:1.5px solid #bfcac1;border-radius:8px;background:#fff;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center;z-index:2}
.node strong{font-size:27px;line-height:1.23;font-weight:500;overflow-wrap:anywhere}
.node span{font-size:23px;line-height:1.35;color:#626e66;white-space:pre-line;overflow-wrap:anywhere}
.node.soft{background:#f3f6f1}.node.issue{background:#faf4ef;border-color:#d7c6b8}.node.result{background:#eff5ed;border-color:#9eaf96}
.edge{position:absolute;height:0;border-top:1.5px solid #9caa98;transform-origin:0 0;z-index:1}.edge.feedback{border-top-style:dashed}
.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #9caa98;border-top:4px solid transparent;border-bottom:4px solid transparent}
.label{position:absolute;font-size:21px;line-height:1.3;color:#687366;background:#fff;z-index:3;white-space:pre-line;box-sizing:border-box;padding:3px 6px}
.label.title{font-size:31px;font-weight:500;color:#303b36}.label.lane{font-size:24px;color:#405142}.label.center{text-align:center}
</style><div class="canvas" data-fixed-type="true" data-research-diagram="agent-memory-lifecycle"><div class="edge arrow" data-from="attempt" data-to="archive" style="left:380px;top:175px;width:150px;transform:rotate(0deg)"></div><div class="edge arrow" data-from="session" data-to="shared" style="left:380px;top:595px;width:150px;transform:rotate(0deg)"></div><div class="edge arrow" data-from="shared" data-to="later" style="left:870px;top:595px;width:150px;transform:rotate(0deg)"></div><div class="node " id="attempt" style="left:40px;top:100px;width:340px;height:150px"><strong>本次 attempt</strong><span>空的临时记忆库</span></div><div class="node " id="archive" style="left:530px;top:100px;width:340px;height:150px"><strong>结束后归档</strong><span>保留记录</span></div><div class="node issue" id="next" style="left:1020px;top:100px;width:340px;height:150px"><strong>下一次 attempt</strong><span>另建空库</span><span data-node-detail="true" hidden>标准任务包装层覆盖记忆目录。即使用户 ID 相同，每个 attempt 也从新建空库开始。</span></div><div class="node " id="session" style="left:40px;top:520px;width:340px;height:150px"><strong>长驻会话入口</strong><span>使用配置目录</span></div><div class="node soft" id="shared" style="left:530px;top:520px;width:340px;height:150px"><strong>同一用户存储</strong><span>可继续读写</span><span data-node-detail="true" hidden>长驻或直接配置入口可以复用宿主机上的用户目录；经验文件仍需对应 VM 或显式迁移。</span></div><div class="node result" id="later" style="left:1020px;top:520px;width:340px;height:150px"><strong>后续访问</strong><span>复用同一目录</span></div><div class="label lane" style="left:40px;top:25px;width:700px">A · 标准任务入口：每次隔离</div><div class="label lane" style="left:40px;top:440px;width:900px">B · 长驻会话／直接配置入口：可复用存储</div><div class="label " style="left:780px;top:320px;width:550px">归档不会自动读回下一次 attempt</div></div></html>
