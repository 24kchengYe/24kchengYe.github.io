<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="1200" height="950" lang="zh"><foreignObject width="1200" height="950"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>*{box-sizing:border-box}.diagram-root{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1200px;background:#fff;overflow:hidden}.heading{position:absolute;left:50px;top:22px;font-size:30px;line-height:1.3}.node{position:absolute;display:flex;align-items:center;justify-content:center;padding:14px 18px;text-align:center;border:1px solid #a6b1a1;border-radius:5px;background:#fff;font-size:28px;line-height:1.28;z-index:2}.node.soft{background:#f1f5ec}.node.plan{border-style:dashed}.sub{display:block;margin-top:8px;font-size:24px;line-height:1.3;color:#687568}.label{position:absolute;font-size:22px;line-height:1.35;color:#687568;background:#fff;padding:3px 8px;text-align:center;z-index:3}.region{position:absolute;border:1px solid #d1d8cc;border-radius:8px}.region-title{position:absolute;top:-21px;left:22px;padding:0 12px;background:#fff;font-size:28px;line-height:1.4}.edge{position:absolute;height:0;border-top:1.4px solid #8b9b83;transform-origin:0 0;z-index:1}.edge.dashed{border-top-style:dashed}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #8b9b83;border-top:4px solid transparent;border-bottom:4px solid transparent}.note{position:absolute;font-size:22px;line-height:1.45;color:#687568}.field{font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif;font-size:24px;line-height:1.65}.panel{position:absolute;border:1px solid #c6d0bf;border-radius:6px;padding:22px 26px;background:#fff}.panel h2{font-size:28px;font-weight:400;line-height:1.35;margin:0 0 18px}.panel .rule{border-top:1px solid #d9dfd3;margin:18px 0}.muted{color:#687568}</style><main class="canvas" data-fixed-type="" style="height:950px"><div class="heading">Harness：一次 Rollout 的执行循环</div>
<div id="input" class="node " style="left:60px;top:92px;width:1080px;height:86px"><span style="min-width: 0; overflow-wrap: anywhere;">Query · 系统指令 · Reminder · 工具定义</span></div>
<div class="region" style="left:40px;top:235px;width:1120px;height:620px"><div class="region-title">上下文、调度与记录</div></div>
<div id="context" class="node " style="left:460px;top:265px;width:280px;height:100px"><span style="min-width: 0; overflow-wrap: anywhere;">当前消息上下文</span></div>
<div id="model" class="node soft" style="left:460px;top:440px;width:280px;height:150px"><span style="min-width: 0; overflow-wrap: anywhere;">模型响应<br /><span class="sub">思考 · 正文 · 调用</span></span></div>
<div id="tools" class="node " style="left:80px;top:650px;width:290px;height:180px"><span style="min-width: 0; overflow-wrap: anywhere;">真实工具执行<br /><span class="sub">Read / Write / Edit<br />Bash / present_files</span></span></div>
<div id="observation" class="node " style="left:80px;top:440px;width:290px;height:150px"><span style="min-width: 0; overflow-wrap: anywhere;">追加真实观察<br /><span class="sub">按 tool_call_id 配对</span></span></div>
<div id="terminal" class="node " style="left:850px;top:440px;width:290px;height:150px"><span style="min-width: 0; overflow-wrap: anywhere;">结束检查<br /><span class="sub">完成 / 失败 / 预算终止</span></span></div>
<div id="archive" class="node " style="left:850px;top:650px;width:290px;height:180px"><span style="min-width: 0; overflow-wrap: anywhere;">原始执行包<br /><span class="sub">消息 · 回执 · 版本</span></span></div>
<div class="connection" data-from="input" data-to="context"><div class="edge arrow" style="left:600px;top:178px;width:87px;transform:rotate(90deg)"></div></div>
<div class="connection" data-from="context" data-to="model"><div class="edge arrow" style="left:600px;top:365px;width:75px;transform:rotate(90deg)"></div></div>
<div class="connection" data-from="model" data-to="tools"><div class="edge" style="left:600px;top:590px;width:135px;transform:rotate(90deg)"></div><div class="edge arrow" style="left:600px;top:725px;width:230px;transform:rotate(180deg)"></div></div>
<div class="connection" data-from="tools" data-to="observation"><div class="edge arrow" style="left:225px;top:650px;width:60px;transform:rotate(-90deg)"></div></div>
<div class="connection" data-from="observation" data-to="context"><div class="edge dashed" style="left:225px;top:440px;width:125px;transform:rotate(-90deg)"></div><div class="edge dashed arrow" style="left:225px;top:315px;width:235px;transform:rotate(0deg)"></div></div>
<div class="connection" data-from="model" data-to="terminal"><div class="edge arrow" style="left:740px;top:515px;width:110px;transform:rotate(0deg)"></div></div>
<div class="connection" data-from="context" data-to="terminal"><div class="edge dashed" style="left:740px;top:315px;width:255px;transform:rotate(0deg)"></div><div class="edge dashed arrow" style="left:995px;top:315px;width:125px;transform:rotate(90deg)"></div></div>
<div class="connection" data-from="terminal" data-to="archive"><div class="edge arrow" style="left:995px;top:590px;width:60px;transform:rotate(90deg)"></div></div>
<div class="label" style="left:115px;top:368px;width:250px">进入下一轮</div>
<div class="label" style="left:440px;top:615px;width:190px">工具调用</div>
<div class="label" style="left:747px;top:466px;width:100px">最终文本</div>
<div class="label" style="left:790px;top:350px;width:340px">预算耗尽 / 不可继续</div>
<div class="note" style="left:65px;top:875px;width:1070px">工具环境保留 Skills、工作区文件与云端 Base 状态；Skills 按需 Read。</div>
</main></div></foreignObject></svg>
