ransform:rotate(180deg)"></div><div class="edge feedback" data-from="format" data-to="regular" style="left:410px;top:768px;width:346px;transform:rotate(-90deg)"></div><div class="edge arrow feedback" data-from="format" data-to="regular" style="left:410px;top:422px;width:140px;transform:rotate(0deg)"></div><div class="node " id="input" style="left:60px;top:88px;width:330px;height:165px"><strong>入力検査</strong><span>Query + Spec を整合</span><span data-node-detail="true" hidden="">入力と事前検査
