<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>Spec → TodoList</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#303a31;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:960px;height:680px;background:#fff}.node{position:absolute;display:flex;justify-content:center;align-items:center;text-align:center;border:1.2px solid #a4ae9d;border-radius:8px;background:#fff;font-size:26px;line-height:1.25;padding:10px 14px}.sub{font-size:20px;color:#647259}.source{border-radius:24px;background:#fafbf7}.plan{background:#f5f8ee;border-color:#8da668}.output{background:#edf3e3;border-color:#8da668}.edge-label{position:absolute;transform:translate(-50%,-50%);font-size:19px;line-height:1.3;text-align:center;background:#fff;color:#647259;padding:4px 8px}.note{position:absolute;left:40px;top:635px;width:880px;font-size:20px;text-align:center;color:#647259}
</style></head><body>
<main class="canvas" data-fixed-type>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" style="position:absolute;inset:0" aria-hidden="true">
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#8b9b7d"/></marker></defs>
<g fill="none" stroke="#8b9b7d" stroke-width="1.5" marker-end="url(#arrow)">
<path data-from="query" data-to="spec" d="M260 95H360"/>
<path data-from="spec" data-to="plan" d="M480 135V230"/>
<path data-from="plan" data-to="execute" d="M480 340V375H170V435"/>
<path data-from="execute" data-to="judge" d="M300 490H360"/>
<path data-from="judge" data-to="training" d="M480 545V590H800V545"/>
</g>
<g fill="none" stroke="#8b9b7d" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)">
<path data-from="execute" data-to="plan" d="M40 490H20V285H340"/>
<path data-from="judge" data-to="plan" d="M480 435V400H660V285H620"/>
</g>
</svg>
<div id="query" class="node source" style="left:40px;top:55px;width:220px;height:80px">原始 Query</div>
<div id="spec" class="node" style="left:360px;top:55px;width:240px;height:80px">Spec</div>
<div id="plan" class="node plan" style="left:340px;top:230px;width:280px;height:110px">TodoList<br><span class="sub">任务 · 依赖 · 状态</span></div>
<div id="execute" class="node" style="left:40px;top:435px;width:260px;height:110px">CLI 执行<br><span class="sub">执行或重生成片段</span></div>
<div id="judge" class="node" style="left:360px;top:435px;width:240px;height:110px">Judge–Fix<br><span class="sub">计划与动作一致性</span></div>
<div id="training" class="node output" style="left:680px;top:435px;width:240px;height:110px">训练轨迹<br><span class="sub">计划 · 调用 · 回执</span></div>
<div class="edge-label" style="left:590px;top:182px">拆分为任务</div>
<div class="edge-label" style="left:160px;top:255px;width:260px">真实返回 · 状态更新</div>
<div class="edge-label" style="left:325px;top:375px">按更新后的计划执行</div>
<div class="edge-label" style="left:790px;top:330px;width:250px">问题归因 · 修订计划</div>
<div class="edge-label" style="left:640px;top:590px">核验通过</div>
<div class="note">验收依据：原始 Query</div>
</main></body></html>
