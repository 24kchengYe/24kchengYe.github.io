        entries:
          - id: bytedance
            title: ByteDance · PDI–Seed · Lark Base AI
            date: 2026.05 – Present
            role: LLM Algorithm Intern · ByteIntern
            text: Post-training Seed 2 for Lark Base AI within Doubao Office's MoA system, spanning synthetic data, Judge/Fix infrastructure models, Verifier Agent and AutoResearch, and coding agents with the Spec–Verifier–SDK and Lark Base CLI.
            projects:
              - title: Spec-Refine data generation
                points:
                  - Built a Category–Rubric–Mode hierarchy across Table, Workflow, Dashboard, Permission, and View, with a Judge–Fix–Router pipeline for candidate generation, root-cause routing, local review, and repair memory. Used voting and format gates, early stopping, and transactional rollback to control quality and cost.
                  - Built a Verifier Agent that combines token log-probabilities, multimodal evidence, and rollouts into dense RL signals. Data accuracy increased from <strong>29% to 70% (+41 pp)</strong> in end-to-end automated and human evaluation.
              - title: Judge/Fix model training
                points:
                  - Built an Assumption-Based Truth Maintenance System with DFS-based set propagation to identify minimal and contradictory assumption sets. Used <strong>10,000+</strong> synthetic trajectories from the DSH harness for Seed 2 Judge post-training, combining Strict-SFT, hierarchical F1 rewards, curriculum RL, and on-policy context distillation.
                  - Used a GRPO-trained Judge as the teacher for Seed 2. Accuracy matched GPT-6.1; vote agreement and rubric coverage improved by <strong>35 pp</strong> and <strong>45 pp</strong>. Trained a Fix model with multi-teacher trajectories and SFT + RFT + PPO, achieving accuracy <strong>20 pp above GPT-6.1</strong>.
              - title: Agentic RL for Lark Base CLI
                points:
                  - Used refined Specs as the reasoning chain for coding agents, with CodeAct, long-horizon end-to-end rewards, and dynamically loaded skills. Converted requirement coverage, configuration correctness, dependencies, and usability into dense feedback; used learning-frontier sampling and compiler errors, failure logs, and successful rollouts as privileged context.
                  - Built an evolving prompt-optimization harness with cross-batch adversarial analysis and evidence, stability, and net-benefit gates. Token utilization efficiency improved by <strong>38 pp</strong>; <strong>P50 latency fell from 3.1 minutes to 23 seconds</strong>.
      - id: research
        title: Research
        intro: Six first-authored papers, including ECCV/CVPR and four SCI Q1 journal papers; two first-authored ESI Highly Cited Papers and one ESI Hot Paper.
        entries:
          - id: urbanalign
            title: UrbanAlign · VLM–human preference alignment
            date: 2025.10 – 2026.02
            role: First and corresponding author · ECCV 2026
            points:
              - Developed post-hoc concept bottleneck alignment for visual RAG. An Observer–Debater–Judge chain extracts interpretable concept scores from frozen VLMs; locally weighted ridge regression calibrates scores to human ratings on a visual–semantic manifold.
              - Achieved <strong>72.2% accuracy (κ = 0.45)</strong> for urban scene perception, <strong>15.1 pp</strong> above the supervised baseline and <strong>16.3 pp</strong> above the uncalibrated VLM.
            link:
              label: UrbanAlign
              url: https://doi.org/10.1007/978-3-032-37132-4_18
          - id: urban-data
            title: Multimodal urban data mining
            date: 2021.09 – 2025.10
            role: GloPPRUA · GloGCI · CMAB
            points:
              - Developed multi-temporal visual interpretation and spatial matching. Resolution-matched HRNet-W48 + U-Net improved strong-blur Dice from <strong>0.684 to 0.756</strong>; an RGB–mask GAN improved building-outline right-angle ratio from <strong>0.398 to 0.624</strong>. Combined 1 m DP vectorization, morphology routing, offset calibration, and contextual matching.
              - Built approximately <strong>14.78 million two-period building observations across 1,000 cities</strong>. CMAB and GloGCI became ESI Highly Cited Papers; data and code received <strong>79,500 downloads</strong>.
            text: '<a href="https://doi.org/10.1038/s41597-025-04730-5">CMAB · Scientific Data, 2025</a><br><a href="https://doi.org/10.1016/j.habitatint.2025.103350">GloGCI / Ghost Cities · Habitat International, 2025</a><br><a href="https://doi.org/10.1016/j.jag.2022.102942">Urban spatial risk prediction · JAG, 2022</a><br><a href="https://doi.org/10.1007/s12273-026-1461-9">Building-scale urban analytics and simulation · Building Simulation, 2026</a>'
          - id: ai4us
            title: Scientific data synthesis and controlled experiments
            date: 2024.09 – Present
            role: First / corresponding author · arXiv
            points:
              - Developed AI4US to evaluate data synthesis and conditional intervention across urban scaling, distance decay, neighborhood vitality, and streetscape perception, comparing reproduced relationships, empirical parameters and distributions, and responses to controlled conditions.
              - Found that GenAI reproduces recognizable urban patterns and directional responses, while compressing numerical range, local variation, and visual diversity. Profile–Probe–Intervene analysis on <strong>Qwen2.5-VL-72B</strong> showed that some patterns can be decoded from intermediate representations and influence local outputs.
            text: '<a href="https://arxiv.org/abs/2505.13803">GenAI Models Capture Urban Science but Oversimplify Complexity</a> · arXiv, 2025.<br>Large Language Models Perceive Cities through a Culturally Uneven Baseline · arXiv, 2026 (corresponding author).'
