op:1.6px solid #98a58c;transform-origin:0 0;z-index:1}.edge.feedback,.edge.context{border-top-style:dashed}.edge.failure{border-color:#bcc4b5}.edge.handoff{border-color:#879f70}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #98a58c;border-top:4px solid transparent;border-bottom:4px solid transparent}.edge.failure.arrow:after{border-left-color:#bcc4b5}.edge.handoff.arrow:after{border-left-color:#879f70}.edge-label{position:absolute;transform:translate(-50%,-50%);max-width:220px;padding:3px 5px;background:#fff;color:#687568;font-size:20px;line-height:1.2;text-align:center;z-index:3}.port{position:absolute;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid #a6b897;border-radius:50%;background:#fafcf7;color:#65755c;font-size:23px;z-index:3}.note{position:absolute;color:#687568;font-size:22px;line-height:1.45}</style><main class="canvas" data-fixed-type="" style="width:2288px;height:1007px"><div class="title" style="left:52px;top:23.099999999999998px">a · 长程轨迹合成</div><div class="region" style="left:435.5px;top:123.75px;width:1202.5px;height:833.25px"></div><div class="region-label" style="left:461.5px;top:95.69999999999999px">Harness</div><div class="note" style="left:52px;top:519.75px">表 · 视图 · 仪表盘</div><div class="note" style="left:52px;top:585.75px">工作流 · 权限</div><div class="connection" data-from="AQ" data-to="AM" data-logical-edge="AQ&gt;AM"><div class="edge normal arrow" style="left:325px;top:437.25px;width:208px;transform:rotate(0deg)"></div></div><div class="connection" data-from="AC" data-to="AM" data-logical-edge="AC&gt;AM"><div class="edge context arrow" style="left:676px;top:264px;width:107.25px;transform:rotate(90deg)"></div></div><div class="connection" data-from="AD" data-to="AM" data-logical-edge="AD&gt;AM"><div class="edge context" style="left:994.5px;top:214.5px;width:58.5px;transform:rotate(180deg)"></div><div class="edge context" style="left:936px;top:214.5px;width:99