<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1220" width="1200" height="1220" lang="zh"><foreignObject width="1200" height="1220"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>*{box-sizing:border-box}.diagram-root{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1200px;background:#fff;overflow:hidden}.heading{position:absolute;left:50px;top:22px;font-size:30px;line-height:1.3}.node{position:absolute;display:flex;align-items:center;justify-content:center;padding:14px 18px;text-align:center;border:1px solid #a6b1a1;border-radius:5px;background:#fff;font-size:28px;line-height:1.28;z-index:2}.node.soft{background:#f1f5ec}.node.plan{border-style:dashed}.sub{display:block;margin-top:8px;font-size:24px;line-height:1.3;color:#687568}.label{position:absolute;font-size:22px;line-height:1.35;color:#687568;background:#fff;padding:3px 8px;text-align:center;z-index:3}.region{position:absolute;border:1px solid #d1d8cc;border-radius:8px}.region-title{position:absolute;top:-21px;left:22px;padding:0 12px;background:#fff;font-size:28px;line-height:1.4}.edge{position:absolute;height:0;border-top:1.4px solid #8b9b83;transform-origin:0 0;z-index:1}.edge.dashed{border-top-style:dashed}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #8b9b83;border-top:4px solid transparent;border-bottom:4px solid transparent}.note{position:absolute;font-size:22px;line-height:1.45;color:#687568}.field{font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif;font-size:24px;line-height:1.65}.panel{position:absolute;border:1px solid #c6d0bf;border-radius:6px;padding:22px 26px;background:#fff}.panel h2{font-size:28px;font-weight:400;line-height:1.35;margin:0 0 18px}.panel .rule{border-top:1px solid #d9dfd3;margin:18px 0}.muted{color:#687568}</style><main class="canvas" data-fixed-type="" style="height:1220px"><div class="heading">真实 Case 的文件结构与消息配对</div>
<div id="bundle" class="panel" style="left:60px;top:110px;width:610px;height:460px"><h2>原始执行包</h2><div class="field">trajectory.json<br /><span class="muted">schemaVersion: 6 · model · tools<br />messages[] · modelTurns[]<br />rounds · commands · completed</span></div><div class="rule"></div><div class="field">llm_round_*.json · commands.jsonl<br />artifacts.json · rollout.result.json</div><div class="note" style="position:static;margin-top:12px">逐轮记录、执行账本、产物引用与终态</div></div>
<div id="case" class="panel" style="left:800px;top:110px;width:340px;height:460px;background:#f5f8f0"><h2>标准化评审 Case</h2><div class="field">query<br />execution_contract<br />trace_completeness<br />events[]<br />artifacts<br />rule_snapshots<br />case_id · attempt_id</div></div>
<div class="connection" data-from="bundle" data-to="case"><div class="edge arrow" style="left:670px;top:340px;width:130px;transform:rotate(0deg)"></div></div>
<div class="label" style="left:674px;top:280px;width:122px">规范化</div>
<div class="heading" style="top:625px">messages[]：一次响应可以包含多个调用</div>
<div id="assistant" class="node " style="left:60px;top:710px;width:340px;height:290px"><span style="min-width: 0; overflow-wrap: anywhere;">assistant · 第 t 轮<br /><span class="sub">reasoning_content<br />content<br />tool_calls[].id<br />call_1 · call_2</span></span></div>
<div id="tool1" class="node " style="left:500px;top:710px;width:300px;height:130px"><span style="min-width: 0; overflow-wrap: anywhere;">tool<br /><span class="sub">tool_call_id: call_1<br />content: 真实返回</span></span></div>
<div id="tool2" class="node " style="left:500px;top:870px;width:300px;height:130px"><span style="min-width: 0; overflow-wrap: anywhere;">tool<br /><span class="sub">tool_call_id: call_2<br />content: 真实返回</span></span></div>
<div id="next" class="node soft" style="left:900px;top:710px;width:240px;height:290px"><span style="min-width: 0; overflow-wrap: anywhere;">assistant · 下一轮<br /><span class="sub">已看到两条真实返回</span></span></div>
<div class="connection" data-from="assistant" data-to="tool1"><div class="edge arrow" style="left:400px;top:775px;width:100px;transform:rotate(0deg)"></div></div>
<div class="connection" data-from="assistant" data-to="tool2"><div class="edge arrow" style="left:400px;top:935px;width:100px;transform:rotate(0deg)"></div></div>
<div class="connection" data-from="tool1" data-to="next"><div class="edge arrow" style="left:800px;top:775px;width:100px;transform:rotate(0deg)"></div></div>
<div class="connection" data-from="tool2" data-to="next"><div class="edge arrow" style="left:800px;top:935px;width:100px;transform:rotate(0deg)"></div></div>
<div class="field" style="position:absolute;left:60px;top:1050px;width:1080px;text-align:center">modelTurns[] → assistantMessageIndex + toolCallIds</div>
<div class="note" style="left:60px;top:1110px;width:1080px">字段来自实际归档；call_1 / call_2 为示意 ID，业务内容不在图中展示。</div>
</main></div></foreignObject></svg>
