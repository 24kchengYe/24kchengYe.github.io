        China. <a href="https://doi.org/10.1038/s41597-025-04730-5">Scientific Data</a>, 2025.'
      - 论文：<strong>Zhang Y</strong>, Tu T, Long Y*. Inferring Ghost Cities on the Globe in Newly Developed Urban Areas Based
        on Urban Vitality with Multi-source Data. <a href="https://doi.org/10.1016/j.habitatint.2025.103350">Habitat International</a>,
        2025.
      - 论文：<strong>Zhang Y</strong>, Zhang Q, …, Zheng H*. Urban Spatial Risk Prediction and Optimization Analysis of POI
        Based on Deep Learning. <a href="https://doi.org/10.1016/j.jag.2022.102942">International Journal of Applied Earth
        Observation and Geoinformation</a>, 2022.
      - 论文：<strong>Zhang Y</strong>, Long Y*. Towards building-scale urban analytics and simulation. Building Simulation,
        2026.
    - id: ai4us
      title: '[3] AI4Science | 大模型科学数据合成与受控实验'
      date: 2024.09 – 至今
      role: 第一/通讯作者 | <a href="https://arxiv.org/abs/2505.13803">arXiv</a>
      paragraphs:
      - 生成式大模型正被用于科学数据合成，但复现显著关系并不等于恢复实证参数、数据异质性或支持可重复实验。提出<strong>AI4US多模态评测框架</strong>，围绕 Data Synthesis 与 Conditional Intervention
        两条路径，在城市标度、距离衰减、街区活力与街景感知四类任务中统一评估<strong>关系复现、实证参数/分布一致性与受控条件响应</strong>。结果表明，GenAI 可恢复可识别的城市规律并在四类任务中产生稳定的方向响应，但会系统性压缩<strong>数值覆盖、局部波动与视觉多样性</strong>；进一步在
        Qwen2.5-VL-72B 上构建<strong>Profile–Probe–Intervene机制分析</strong>，验证部分规律可由中间表征解码并影响局部输出。
      papers:
      - 论文：<strong>Zhang Y</strong>, Zhao R, Huang Z, Long Y*. GenAI Models Capture Urban Science but Oversimplify Complexity.
        <a href="https://arxiv.org/abs/2505.13803">arXiv</a>, 2025.
      - 论文：Zhao R, Liu W, …, <strong>Zhang Y</strong>*. Large Language Models Perceive Cities through a Culturally Uneven
        Baseline. <a href="https://arxiv.org/abs/2604.20048">arXiv</a>, 2026.
