        paragraphs:
        - ローカルAIメモリシステム<strong><a href="https://github.com/24kchengYe/MemoMind">MemoMind</a></strong>を開発。<strong>PostgreSQL+pgvector</strong>に基づく知識グラフサービスを構築し、意味ベクトル、BM25、グラフ探索、時間制約による<strong>4経路のハイブリッド検索</strong>を設計した。RRFによる統合とCross-Encoderの再ランキングで検索品質を向上。3階層のモデル分担によりベクトル化、エンティティ抽出、推論に基づく重複排除を行い、MCPプロトコルでエージェントに接続する。複数Bankのアーキテクチャにより、本番環境の<strong>4.3万超</strong>のノードと<strong>249万超</strong>の知識リンクを統合管理。
