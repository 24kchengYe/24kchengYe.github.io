<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960" lang="zh"><foreignObject width="1200" height="960"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>*{box-sizing:border-box}.diagram-root{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;background:#fff;overflow:hidden}.heading{position:absolute;left:40px;top:24px;font-size:30px;line-height:1.3}.node{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px 18px;text-align:center;border:1px solid #a6b1a1;border-radius:5px;background:#fff;font-size:28px;line-height:1.25;z-index:2}.node.soft{background:#f1f5ec}.node.plan{border-style:dashed}.node.failed{background:#faf3e9;border-color:#d8bf9f}.sub{font-size:24px;line-height:1.35;color:#687568}.label{position:absolute;font-size:22px;line-height:1.35;color:#687568;background:#fff;padding:3px 6px;text-align:center;z-index:3}.region{position:absolute;border:1px solid #d4ddcd;border-radius:6px}.region-title{position:absolute;top:-19px;left:20px;padding:0 10px;background:#fff;font-size:26px}.edge{position:absolute;height:0;border-top:1.6px solid #98a58c;transform-origin:0 0;z-index:1}.edge.feedback,.edge.support{border-top-style:dashed}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #98a58c;border-top:4px solid transparent;border-bottom:4px solid transparent}.note{position:absolute;left:40px;font-size:22px;line-height:1.5;color:#687568}.math{font-family:Georgia,serif;font-style:italic;font-size:30px}</style><main class="canvas" data-fixed-type="" style="width:1200px;height:960px"><div class="heading">Harness：上下文与真实执行循环</div>
<div id="input" class="node " style="left:60px;top:95px;width:1080px;height:82px"><span style="min-width: 0; overflow-wrap: anywhere;"><div>Query · 系统指令 · Reminder · 工具定义</div></span></div>
<div class="region" style="left:40px;top:230px;width:1120px;height:620px"><div class="region-title">上下文、工具调度与执行记录</div></div>
<div id="context" class="node " style="left:450px;top:270px;width:300px;height:95px"><span style="min-width: 0; overflow-wrap: anywhere;"><div>当前消息上下文</div></span></div>
<div id="model" class="node soft" style="left:450px;top:440px;width:300px;height:150px"><span style="min-width: 0; overflow-wrap: anywhere;"><div>模型响应</div><div class="sub">思考 · 正文 · 工具调用</div></span></div>
<div id="tools" class="node " style="left:70px;top:650px;width:310px;height:170px"><span style="min-width: 0; overflow-wrap: anywhere;"><div>真实工具执行</div><div class="sub">Read / Write / Edit / Bash / present_files</div></span></div>
<div id="observation" class="node " style="left:70px;top:440px;width:310px;height:150px"><span style="min-width: 0; overflow-wrap: anywhere;"><div>追加真实观察</div><div class="sub">tool_call_id 配对</div></span></div>
<div id="terminal" class="node " style="left:850px;top:440px;width:290px;height:150px"><span style="min-width: 0; overflow-wrap: anywhere;"><div>结束检查</div><div class="sub">完成 / 失败 / 预算终止</div></span></div>
<div id="archive" class="node " style="left:850px;top:650px;width:290px;height:170px"><span style="min-width: 0; overflow-wrap: anywhere;"><div>原始执行包</div><div class="sub">消息 · 回执 · 版本</div></span></div>
<div class="connection" data-from="input" data-to="context" data-relation="flow"><div class="edge  arrow" style="left:600px;top:177px;width:93px;transform:rotate(90deg)"></div></div>
<div class="connection" data-from="context" data-to="model" data-relation="flow"><div class="edge  arrow" style="left:600px;top:365px;width:75px;transform:rotate(90deg)"></div></div>
<div class="connection" data-from="model" data-to="tools" data-relation="flow"><div class="edge " style="left:600px;top:590px;width:140px;transform:rotate(90deg)"></div><div class="edge  arrow" style="left:600px;top:730px;width:220px;transform:rotate(180deg)"></div></div>
<div class="connection" data-from="tools" data-to="observation" data-relation="flow"><div class="edge  arrow" style="left:225px;top:650px;width:60px;transform:rotate(-90deg)"></div></div>
<div class="connection" data-from="observation" data-to="context" data-relation="feedback"><div class="edge feedback" style="left:225px;top:440px;width:120px;transform:rotate(-90deg)"></div><div class="edge feedback arrow" style="left:225px;top:320px;width:225px;transform:rotate(0deg)"></div></div>
<div class="connection" data-from="model" data-to="terminal" data-relation="flow"><div class="edge  arrow" style="left:750px;top:515px;width:100px;transform:rotate(0deg)"></div></div>
<div class="connection" data-from="context" data-to="terminal" data-relation="feedback"><div class="edge feedback" style="left:750px;top:320px;width:245px;transform:rotate(0deg)"></div><div class="edge feedback arrow" style="left:995px;top:320px;width:120px;transform:rotate(90deg)"></div></div>
<div class="connection" data-from="terminal" data-to="archive" data-relation="flow"><div class="edge  arrow" style="left:995px;top:590px;width:60px;transform:rotate(90deg)"></div></div>
<div class="label" style="left:90px;top:375px;width:280px">进入下一轮</div>
<div class="label" style="left:410px;top:635px;width:230px">工具调用</div>
<div class="label" style="left:755px;top:455px;width:90px">最终文本</div>
<div class="label" style="left:810px;top:370px;width:290px">不可继续</div>
<div class="note" style="top:875px;width:1120px">Read 读取 Skills；Write/Edit 修改本地文件；Bash 运行 lark-cli，经 API 操作云端 Base。</div>
</main></div></foreignObject></svg>
