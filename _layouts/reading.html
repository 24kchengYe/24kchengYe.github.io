<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} — {{ site.author.name | escape }}</title>
  <meta name="description" content="{{ page.description | escape }}">
  <meta property="og:title" content="{{ page.title | escape }} — {{ site.author.name | escape }}">
  <meta property="og:description" content="{{ page.description | escape }}">
  <meta property="og:type" content="website">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/minimal.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/reading.css' | relative_url }}">
  {% if page.library %}<link rel="stylesheet" href="{{ '/assets/css/reading-library.css' | relative_url }}">{% endif %}
  <script src="{{ '/assets/js/minimal.js' | relative_url }}" defer></script>
  {% if page.library %}
  <script src="{{ '/assets/js/reading-library-data.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/reading-pdf.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/reading-library.js' | relative_url }}" defer></script>
  {% else %}<script src="{{ '/assets/js/reading.js' | relative_url }}" defer></script>{% endif %}
</head>
<body id="top">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    <header class="site-nav reading-nav">
      <a href="{{ '/' | relative_url }}">← {{ site.author.name | escape }}</a>
      <div class="languages" role="group" aria-label="Language">
        <button type="button" data-language="en" aria-pressed="true" aria-label="English">EN</button>
        <button type="button" data-language="zh" aria-pressed="false" aria-label="中文">中</button>
        <button type="button" data-language="ja" aria-pressed="false" aria-label="日本語">日</button>
      </div>
    </header>
    <main id="main">{{ content }}</main>
    <footer class="site-footer">
      <a href="{{ '/' | relative_url }}">{{ site.author.name | escape }}</a>
      <a href="#top"><span lang="en">Back to top ↑</span><span lang="zh">回到顶部 ↑</span><span lang="ja">トップへ ↑</span></a>
    </footer>
  </div>
</body>
</html>
