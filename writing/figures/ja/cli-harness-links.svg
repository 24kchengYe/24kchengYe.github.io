<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1030" width="1200" height="1030" lang="ja"><foreignObject width="1200" height="1030"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>*{box-sizing:border-box}.diagram-root{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1200px;background:#fff;overflow:hidden}.heading{position:absolute;left:50px;top:22px;font-size:30px;line-height:1.3}.node{position:absolute;display:flex;align-items:center;justify-content:center;padding:14px 18px;text-align:center;border:1px solid #a6b1a1;border-radius:5px;background:#fff;font-size:28px;line-height:1.28;z-index:2}.soft{background:#f1f5ec}.node.foundation{background:#eaf0e4;border-color:#839675}.node.plan{border-style:dashed}.sub{display:block;margin-top:8px;font-size:24px;line-height:1.4;color:#687568}.label{position:absolute;font-size:22px;line-height:1.35;color:#687568;background:#fff;padding:3px 4px;text-align:center;z-index:3}.region{position:absolute;border:1px solid #c6d0bf;border-radius:8px}.region-title{position:absolute;top:-21px;left:22px;padding:0 12px;background:#fff;font-size:28px;line-height:1.4}.edge{position:absolute;height:0;border-top:1.5px solid #8b9b83;transform-origin:0 0;z-index:1}.edge.support{border-top-style:dashed;stroke-dasharray:4 4}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #8b9b83;border-top:4px solid transparent;border-bottom:4px solid transparent}.note{position:absolute;font-size:22px;line-height:1.45;color:#687568}</style><main class="canvas" data-fixed-type="" style="height:1030px"><div class="heading">Online の共通実行基盤と Offline への引き渡し</div>
<div id="online" class="region" style="left:40px;top:125px;width:760px;height:670px"><div class="region-title">Online · 生成と修復</div></div>
<div id="offline" class="region" style="left:855px;top:125px;width:305px;height:670px"><div class="region-title">Offline</div></div>
<div id="plan" class="node plan" style="left:80px;top:175px;width:670px;height:120px"><span style="min-width: 0; overflow-wrap: anywhere;">Spec → TodoList<br /><span class="sub">更新可能な実行計画</span></span></div>
<div id="execute" class="node " style="left:80px;top:340px;width:280px;height:190px"><span style="min-width: 0; overflow-wrap: anywhere;">生成・修復の実行<br /><span class="sub">初回生成・再開・再生成</span></span></div>
<div id="judge" class="node " style="left:470px;top:340px;width:280px;height:190px"><span style="min-width: 0; overflow-wrap: anywhere;">Judge と振り分け<br /><span class="sub">問題の特定・対処の選択</span></span></div>
<div id="edit" class="node " style="left:880px;top:340px;width:260px;height:190px"><span style="min-width: 0; overflow-wrap: anywhere;">編集と検証<br /><span class="sub">完全な軌跡・範囲を絞った編集</span></span></div>
<div id="harness" class="node foundation" style="left:80px;top:640px;width:670px;height:120px"><span style="min-width: 0; overflow-wrap: anywhere;">Harness · 共通実行基盤<br /><span class="sub">文脈・ツール環境・実際の返却値・チェックポイント</span></span></div>
<div id="pending" class="node " style="left:480px;top:875px;width:240px;height:80px"><span style="min-width: 0; overflow-wrap: anywhere;">Pending</span></div>
<div id="release" class="node soft" style="left:880px;top:640px;width:260px;height:120px"><span style="min-width: 0; overflow-wrap: anywhere;">学習データへ<br /><span class="sub">品質・真正性・形式</span></span></div>
<div class="connection" data-from="plan" data-to="execute" data-relation="flow"><div class="edge flow arrow" style="left:220px;top:295px;width:45px;transform:rotate(90deg)"></div></div>
<div class="connection" data-from="judge" data-to="plan" data-relation="flow"><div class="edge flow arrow" style="left:660px;top:340px;width:45px;transform:rotate(-90deg)"></div></div>
<div class="connection" data-from="execute" data-to="judge" data-relation="flow"><div class="edge flow arrow" style="left:360px;top:435px;width:110px;transform:rotate(0deg)"></div></div>
<div class="connection" data-from="judge" data-to="execute" data-relation="flow"><div class="edge flow" style="left:600px;top:530px;width:55px;transform:rotate(90deg)"></div><div class="edge flow" style="left:600px;top:585px;width:350px;transform:rotate(180deg)"></div><div class="edge flow arrow" style="left:250px;top:585px;width:55px;transform:rotate(-90deg)"></div></div>
<div class="connection" data-from="execute" data-to="harness" data-relation="support"><div class="edge support" style="left:135px;top:530px;width:110px;transform:rotate(90deg)"></div></div>
<div class="connection" data-from="judge" data-to="edit" data-relation="flow"><div class="edge flow arrow" style="left:750px;top:435px;width:130px;transform:rotate(0deg)"></div></div>
<div class="connection" data-from="judge" data-to="pending" data-relation="flow"><div class="edge flow" style="left:700px;top:530px;width:80px;transform:rotate(90deg)"></div><div class="edge flow" style="left:700px;top:610px;width:80px;transform:rotate(0deg)"></div><div class="edge flow" style="left:780px;top:610px;width:305px;transform:rotate(90deg)"></div><div class="edge flow arrow" style="left:780px;top:915px;width:60px;transform:rotate(180deg)"></div></div>
<div class="connection" data-from="edit" data-to="pending" data-relation="flow"><div class="edge flow" style="left:950px;top:530px;width:30px;transform:rotate(90deg)"></div><div class="edge flow" style="left:950px;top:560px;width:120px;transform:rotate(180deg)"></div><div class="edge flow" style="left:830px;top:560px;width:280px;transform:rotate(90deg)"></div><div class="edge flow" style="left:830px;top:840px;width:50px;transform:rotate(180deg)"></div><div class="edge flow" style="left:780px;top:840px;width:75px;transform:rotate(90deg)"></div><div class="edge flow arrow" style="left:780px;top:915px;width:60px;transform:rotate(180deg)"></div></div>
<div class="connection" data-from="edit" data-to="release" data-relation="flow"><div class="edge flow arrow" style="left:1080px;top:530px;width:110px;transform:rotate(90deg)"></div></div>
<div class="label" style="left:260px;top:302px;width:140px">計画</div>
<div class="label" style="left:665px;top:300px;width:160px">問題の反映</div>
<div class="label" style="left:360px;top:380px;width:110px">軌跡</div>
<div class="label" style="left:310px;top:545px;width:240px">上限付き修復</div>
<div class="label" style="left:170px;top:600px;width:400px">生成と修復は同じ実行基盤を使用</div>
<div class="label" style="left:753px;top:365px;width:124px">再生成不要</div>
<div class="label" style="left:870px;top:810px;width:250px">実行不能・検証未通過</div>
<div class="label" style="left:975px;top:595px;width:160px">検証済み</div>
<div class="note" style="left:880px;top:180px;width:260px">追加の再生成が不要な完全な軌跡を受け取る。</div>
<div class="note" style="left:60px;top:985px;width:1080px">実線矢印は制御・引き渡し。矢印のない破線は共通基盤の利用。</div>
</main></div></foreignObject></svg>
