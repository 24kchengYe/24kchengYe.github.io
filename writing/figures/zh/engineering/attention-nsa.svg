[data-diagram-style="engineering"] :is(.tm-breadcrumb,.am-breadcrumb,.tm-replay) { background:#fff; border-color:#dedede; }
[data-diagram-style="engineering"] .canvas { background-image:none; }
[data-diagram-style="engineering"] .canvas :is(.node,.event,.checkpoint,.restore,.bundle),
