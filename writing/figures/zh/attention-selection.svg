<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 944" width="1440" height="944" lang="zh"><foreignObject width="1440" height="944"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>*{box-sizing:border-box}.diagram-root{margin:0;color:#303c38;background:white;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1440px;background:white;overflow:hidden}.node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;background:white;border:1.5px solid #8c9a90;border-radius:3px;padding:10px 16px;font-size:25px;line-height:1.4}.soft{background:#edf3e9;border-color:#8a9c7d}.quiet{background:#f7f8f6;border-color:#d6dcd5}.label{position:absolute;font-size:23px;line-height:1.45;color:#65736a}.title{font-size:29px;color:#303c38;font-weight:500}.center{text-align:center}.small{font-size:21px}.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.line{position:absolute;height:0;border-top:1.5px solid #8c9a90}.arrow:after{content:"";position:absolute;right:-1px;top:-4.5px;border-left:7px solid #8c9a90;border-top:4px solid transparent;border-bottom:4px solid transparent}.vertical{width:0;border-top:0;border-left:1.5px solid #8c9a90}.down:after{content:"";position:absolute;bottom:-1px;left:-4.5px;border-top:7px solid #8c9a90;border-left:4px solid transparent;border-right:4px solid transparent}.dashed{border-style:dashed}.rule{border-color:#e0e5dd;border-width:1px}.cells{position:absolute;display:grid}.cells i{display:block;background:#f4f6f2;border:1px solid #e0e5dd;border-radius:1px}.cells i.on{background:#ceddc4;border-color:#afc39f}.canvas{height:944px}</style><main class="canvas">
<div class="label title" style="left:40px;top:24px;width:1360px">NSA</div><div class="label small" style="left:40px;top:69px;width:1360px">同一查询，三路注意力</div><div class="node quiet" style="left:40px;top:139px;width:344px;height:76px"><span style="min-width: 0; overflow-wrap: anywhere;">压缩注意力</span></div><div class="node soft" style="left:548px;top:139px;width:344px;height:76px"><span style="min-width: 0; overflow-wrap: anywhere;">选中原始块的注意力</span></div><div class="node quiet" style="left:1056px;top:139px;width:344px;height:76px"><span style="min-width: 0; overflow-wrap: anywhere;">窗口注意力</span></div><div class="line arrow dashed" style="left:384px;top:177px;width:164px"></div><div class="label small center" style="left:389px;top:118px;width:154px">分数 P → 选块</div><div class="line vertical" style="left:212px;top:215px;height:52px"></div><div class="line " style="left:212px;top:267px;width:1016px"></div><div class="line vertical" style="left:1228px;top:215px;height:52px"></div><div class="line vertical down" style="left:720px;top:215px;height:111px"></div><div class="node soft" style="left:548px;top:326px;width:344px;height:66px"><span style="min-width: 0; overflow-wrap: anywhere;">门控融合三路输出</span></div><div class="line rule" style="left:40px;top:430px;width:1360px"></div><div class="label title" style="left:40px;top:465px;width:200px">DSA</div><div class="node quiet" style="left:40px;top:544px;width:290px;height:76px"><span style="min-width: 0; overflow-wrap: anywhere;">索引查询 Qᴵ + 索引 K</span></div><div class="line arrow" style="left:330px;top:582px;width:66px"></div><div class="node soft" style="left:396px;top:544px;width:260px;height:76px"><span style="min-width: 0; overflow-wrap: anywhere;">Top-k tokens</span></div><div class="line arrow" style="left:656px;top:582px;width:66px"></div><div class="node quiet" style="left:722px;top:544px;width:268px;height:76px"><span style="min-width: 0; overflow-wrap: anywhere;">选中的 KV</span></div><div class="line arrow" style="left:990px;top:582px;width:66px"></div><div class="node " style="left:1056px;top:544px;width:344px;height:76px"><span style="min-width: 0; overflow-wrap: anywhere;">主 MLA · 查询 Q</span></div><div class="line rule" style="left:40px;top:658px;width:1360px"></div><div class="label title" style="left:40px;top:688px;width:200px">MoBA</div><div class="node quiet" style="left:40px;top:778px;width:290px;height:76px"><span style="min-width: 0; overflow-wrap: anywhere;">Q + 历史块平均 K</span></div><div class="line arrow" style="left:330px;top:816px;width:66px"></div><div class="node soft" style="left:396px;top:778px;width:260px;height:76px"><span style="min-width: 0; overflow-wrap: anywhere;">最多 k−1 个历史块</span></div><div class="line arrow" style="left:656px;top:816px;width:66px"></div><div class="node soft" style="left:722px;top:778px;width:268px;height:76px"><span style="min-width: 0; overflow-wrap: anywhere;">加上当前因果块</span></div><div class="line arrow" style="left:990px;top:816px;width:66px"></div><div class="node " style="left:1056px;top:778px;width:344px;height:76px"><span style="min-width: 0; overflow-wrap: anywhere;">逐 token 注意力</span></div><div class="label small center" style="left:1056px;top:876px;width:344px">统一 Softmax 归一化</div>
</main></div></foreignObject></svg>
