每个类别包含 category、status、issues；每条问题包含 rubric_id、mode、severity、reason。
总体裁决按领域规则判定；存在问题记录不一定代表不通过。</span></div><div class="label lane" style="left:40px;top:50px;width:340px">输入</div><div class="label lane" style="left:1060px;top:50px;width:340px">结构化输出</div></div><style>[data-diagram-style="openai-blog"] {
