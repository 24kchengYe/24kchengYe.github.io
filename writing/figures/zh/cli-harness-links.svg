<div id="execute" class="node " style="left: 50px; top: 330px; width: 320px; height: 220px;"><div>生成 / 续跑 / 重生成</div><div class="sub">教师纠偏覆盖每次执行</div></div>
<div id="judge" class="node " style="left: 440px; top: 330px; width: 290px; height: 220px;"><div>Judge 与问题归因</div><div class="sub">三轮评审 · 路由</div></div>
<div id="offline" class="node " style="left: 885px; top: 330px; width: 260px; height: 220px;"><div>局部编辑与核验</div><div class="sub">依赖 · 清洗 · 三评</div></div>
