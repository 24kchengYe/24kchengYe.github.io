<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 470" width="1440" height="470" lang="en"><foreignObject width="1440" height="470"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>
*{box-sizing:border-box}
.diagram-root{margin:0;background:#fff;color:#202321;font-family:ui-monospace,SFMono-Regular,Menlo,"PingFang SC",sans-serif;font-weight:400}
.canvas{position:relative;width:1440px;background:white;overflow:hidden}
.node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;font-size:26px;line-height:1.5;background:#fff;z-index:2;padding:8px 14px}
.node.box{border:1.25px solid #363b36;border-radius:23px;background-image:radial-gradient(#4b504b20 .65px,transparent .7px);background-size:5px 5px}
.node.accent{color:#4d6e2b;border-color:#85a65c;background-color:#fff;background-image:radial-gradient(#83a95738 .65px,transparent .7px);background-size:5px 5px}
.node.small{font-size:22px}
.label{position:absolute;font-size:20px;color:#737972;background:#fff;z-index:3;padding:2px 8px;line-height:1.6}
.wire{position:absolute;z-index:1}
.tip{position:absolute;width:8px;height:8px;border-top:1.25px solid #424942;border-right:1.25px solid #424942;z-index:1}
.rule{position:absolute;height:1px;background:#e0e5e1}
.group{position:absolute;border:1px solid #d4dbd0;border-radius:5px;background-image:radial-gradient(#82917c19 .6px,transparent .65px);background-size:6px 6px}
.group.draft{border-style:dashed;background-image:none}
.group-title{position:absolute;left:22px;top:-16px;background:white;padding:0 10px;font-size:22px;line-height:30px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
.lifeline{position:absolute;border-left:1px solid #cbd3c5}
.chart{padding:38px 70px 48px}.chart h2{font-size:23px;font-weight:400;margin:0 0 30px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:70px}
.chart-row{display:grid;grid-template-columns:185px 1fr 100px;gap:18px;align-items:center;min-height:66px;font-size:22px}
.track{position:relative;height:9px;background:#f0f2f0}.bar{height:9px;background:#aeb5aa}.bar.green{background:#83a957}.val{text-align:right;font-size:21px}
.axis{display:flex;justify-content:space-between;margin-left:203px;margin-right:118px;color:#8b918d;font-size:17px}.small-note{font-size:20px;color:#79827b}
.matrix{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:0;padding:35px 80px}.matrix&gt;div{padding:28px 18px;border-bottom:1px solid #dce3dd;font-size:24px}.matrix .muted{font-size:21px;color:#7c847d}.number{font-size:42px}.green{color:#5d7e3b}
.spark{display:flex;gap:20px;align-items:end;height:160px}.spark&gt;div{width:70px;background:#d9e5dd;position:relative;min-height:1px}.spark span{position:absolute;top:-35px;left:0;right:0;text-align:center;font-size:23px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:40px;padding:65px 80px 20px}.stat-grid .number{margin:12px 0}.stat-grid p{font-size:23px;line-height:1.7;margin:7px 0}.small{font-size:20px}
.plot{padding:45px 70px}.plot-row{display:grid;grid-template-columns:260px 1fr 230px;gap:25px;align-items:center;font-size:24px;margin:42px 0}.plot-track{height:20px;display:flex;position:relative;background:#f0f3f1}.plot-track&gt;div{height:20px;background:#ccd8bd}.plot-track&gt;div:last-child{background:#83a957}
.legend{font-size:20px;color:#79827b;display:flex;gap:40px;margin:30px 0}.legend i{display:inline-block;width:18px;height:10px;background:#ccd8bd;margin-right:10px}.legend i.dark{background:#83a957}
.chips{display:flex;gap:12px;padding:20px 0}.chip{width:16px;height:16px;border:1px solid #bec8c1;border-radius:50%}.chip.green{background:#83a957;border-color:#83a957}.chip.gray{background:#aab8af}.caption{font-size:21px;color:#7b827d;margin-top:26px}

.diagram-root{font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.label,.legend,.note,.annotation,.small-note,.caption,.axis{font-size:22px}.title,.label.title{font-size:30px}.group-title,.chart h2{font-size:26px}.chart-row,.plot-row,.matrix&gt;div,.stat-grid p,.val{font-size:26px}.matrix .muted,.math,.legend,.small{font-size:24px}</style><main class="canvas" style="height:470px"><div class="node small" style="left: 65px; top: 60px; width: 280px; height: 75px; font-size: 24px; line-height: 1.25;" data-type-role="secondary"><span style="min-width: 0; overflow-wrap: anywhere;">This month's total<br />Threshold alert</span></div><div class="node box" style="left: 570px; top: 60px; width: 310px; height: 75px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">Register metrics &amp; actions</span></div><div class="node small" style="left: 1080px; top: 60px; width: 260px; height: 75px; font-size: 24px; line-height: 1.25;" data-type-role="secondary"><span style="min-width: 0; overflow-wrap: anywhere;">Record consumer needs</span></div><div class="wire" style="left:345px;top:97px;width:225px;border-top:1.25px solid #424942"></div><div class="tip" style="left:555px;top:92px;border-color:#424942;transform:rotate(45deg)"></div><div class="wire" style="left:880px;top:97px;width:200px;border-top:1.25px solid #424942"></div><div class="tip" style="left:1065px;top:92px;border-color:#424942;transform:rotate(45deg)"></div><div class="node box accent" style="left: 65px; top: 300px; width: 280px; height: 95px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">Define tables &amp; fields first</span></div><div class="node box" style="left: 570px; top: 300px; width: 310px; height: 95px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">Aggregate / condition fields</span></div><div class="node box" style="left: 1080px; top: 300px; width: 260px; height: 95px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">Dashboard / Workflow</span></div><div class="wire" style="left:345px;top:347px;width:225px;border-top:1.25px solid #424942"></div><div class="tip" style="left:555px;top:342px;border-color:#424942;transform:rotate(45deg)"></div><div class="wire" style="left:880px;top:347px;width:200px;border-top:1.25px solid #424942"></div><div class="tip" style="left:1065px;top:342px;border-color:#424942;transform:rotate(45deg)"></div><div class="wire" style="left:1210px;top:135px;height:80px;border-left:1.25px solid #424942"></div><div class="tip" style="left:1205px;top:200px;border-color:#424942;transform:rotate(135deg)"></div><div class="wire" style="left:205px;top:215px;width:1005px;border-top:1.25px dashed #424942"></div><div class="tip" style="left:210px;top:210px;border-color:#424942;transform:rotate(225deg)"></div><div class="wire" style="left:205px;top:215px;height:85px;border-left:1.25px dashed #424942"></div><div class="tip" style="left:200px;top:285px;border-color:#424942;transform:rotate(135deg)"></div><div class="label" style="left:470px;top:192px">Plan dependencies first; render only registered fields</div></main></div></foreignObject></svg>
