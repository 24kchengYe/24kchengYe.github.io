<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" lang="ja"><foreignObject width="1200" height="760"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>*{box-sizing:border-box}.diagram-root{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;background:#fff;overflow:hidden}.heading{position:absolute;left:40px;top:24px;font-size:30px;line-height:1.3}.node{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px 18px;text-align:center;border:1px solid #a6b1a1;border-radius:5px;background:#fff;font-size:28px;line-height:1.25;z-index:2}.node.soft{background:#f1f5ec}.node.plan{border-style:dashed}.node.failed{background:#faf3e9;border-color:#d8bf9f}.sub{font-size:24px;line-height:1.35;color:#687568}.label{position:absolute;font-size:22px;line-height:1.35;color:#687568;background:#fff;padding:3px 6px;text-align:center;z-index:3}.region{position:absolute;border:1px solid #d4ddcd;border-radius:6px}.region-title{position:absolute;top:-19px;left:20px;padding:0 10px;background:#fff;font-size:26px}.edge{position:absolute;height:0;border-top:1.6px solid #98a58c;transform-origin:0 0;z-index:1}.edge.feedback,.edge.support{border-top-style:dashed}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #98a58c;border-top:4px solid transparent;border-bottom:4px solid transparent}.note{position:absolute;left:40px;font-size:22px;line-height:1.5;color:#687568}.math{font-family:Georgia,serif;font-style:italic;font-size:30px}</style><main class="canvas" data-fixed-type="" style="width:1200px;height:760px"><div class="heading">1ターンの軌跡：動作・返却値・状態</div>
<div id="history" class="node " style="left:40px;top:140px;width:230px;height:140px"><span style="min-width: 0; overflow-wrap: anywhere;"><div><span class="math">Hᵢ, Eᵢ</span></div><div class="sub">メッセージ履歴 · 現在の環境</div></span></div>
<div id="action" class="node " style="left:340px;top:140px;width:230px;height:140px"><span style="min-width: 0; overflow-wrap: anywhere;"><div><span class="math">Aᵢ / A′ᵢ</span></div><div class="sub">最初の選択 / 再選択</div></span></div>
<div id="observation" class="node " style="left:650px;top:140px;width:220px;height:140px"><span style="min-width: 0; overflow-wrap: anywhere;"><div><span class="math">Oᵢ</span></div><div class="sub">実際のツール返却値</div></span></div>
<div id="next" class="node " style="left:940px;top:140px;width:220px;height:140px"><span style="min-width: 0; overflow-wrap: anywhere;"><div><span class="math">Hᵢ₊₁, Eᵢ₊₁</span></div><div class="sub">観測を追加 · 状態を更新</div></span></div>
<div id="restore" class="node " style="left:40px;top:415px;width:240px;height:130px"><span style="min-width: 0; overflow-wrap: anywhere;"><div>チェックポイントを復元</div><div class="sub">文脈の接頭辞 · 環境の根拠</div></span></div>
<div id="teacher" class="node " style="left:340px;top:415px;width:230px;height:130px"><span style="min-width: 0; overflow-wrap: anywhere;"><div>教師の指示</div><div class="sub">エラーを特定 · 再判断</div></span></div>
<div id="failure" class="node failed" style="left:650px;top:415px;width:220px;height:130px"><span style="min-width: 0; overflow-wrap: anywhere;"><div>失敗試行</div><div class="sub">返却値を保存 · コストを保持</div></span></div>
<div class="connection" data-from="history" data-to="action" data-relation="flow"><div class="edge  arrow" style="left:270px;top:210px;width:70px;transform:rotate(0deg)"></div></div>
<div class="connection" data-from="action" data-to="observation" data-relation="flow"><div class="edge  arrow" style="left:570px;top:210px;width:80px;transform:rotate(0deg)"></div></div>
<div class="connection" data-from="observation" data-to="next" data-relation="flow"><div class="edge  arrow" style="left:870px;top:210px;width:70px;transform:rotate(0deg)"></div></div>
<div class="connection" data-from="observation" data-to="failure" data-relation="flow"><div class="edge  arrow" style="left:760px;top:280px;width:135px;transform:rotate(90deg)"></div></div>
<div class="connection" data-from="failure" data-to="teacher" data-relation="flow"><div class="edge  arrow" style="left:650px;top:480px;width:80px;transform:rotate(180deg)"></div></div>
<div class="connection" data-from="teacher" data-to="restore" data-relation="flow"><div class="edge  arrow" style="left:340px;top:480px;width:60px;transform:rotate(180deg)"></div></div>
<div class="connection" data-from="restore" data-to="history" data-relation="feedback"><div class="edge feedback arrow" style="left:155px;top:415px;width:135px;transform:rotate(-90deg)"></div></div>
<div class="label" style="left:875px;top:165px;width:65px">保持</div>
<div class="label" style="left:775px;top:330px;width:90px">失敗</div>
<div class="label" style="left:60px;top:330px;width:85px">復元</div>
<div class="note" style="top:610px;width:1120px">呼び出しと返却値はcall IDで対応付ける。1ターンには0個以上の呼び出しを含められ、最終テキストだけのターンもある。</div>
<div class="note" style="top:685px;width:1120px">チェックポイントを復元の根拠とし、必要に応じて環境を復元・再構築してからモデルが新しい動作を選ぶ。</div>
</main></div></foreignObject></svg>
