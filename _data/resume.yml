    - id: bytedance
      title: ByteDance · PDI-Seed-Lark Base AI
      date: 2026.05 – Present
      role: LLM Algorithm Intern (ByteIntern)
      paragraphs:
      - Responsible for Seed 2 post-training for Lark Base AI within Doubao Office's MoA system, covering data synthesis,
        Judge/Fix Infra Models training, Verifier Agent + AutoResearch, and the development of the Spec-Verifier-SDK Coding
        Agent and Lark Base CLI, to build agentic capabilities for enterprise-native B2B scenarios.
      projects:
      - id: spec-refine
        title: '[1] Building data synthesis for Spec-Refine'
        paragraphs:
        - '<strong>To push the capability ceiling of Spec generation for multidimensional tables in Base scenarios</strong>
          and provide <strong>dense training signals</strong> for <strong>reinforcement learning of a Refine agent based on
          Judge and Fix models</strong>, built a three-level <strong>Category–Rubric–Mode</strong> rubric system and a <strong>Judge–Fix–Router</strong>
          pipeline covering five domains: Table/Workflow/Dashboard/Permission/View. Combined multi-candidate generation, domain-specific
          review/root-cause routing, and local rechecking/long-term repair memory with voting-based release gates, terminal
          bypass, format gates, tolerance-based rechecking/exemptions, and Hard fallback for difficult pipeline paths. Controlled
          costs through early stopping/mixed precision and protected results through exception isolation/transactional rollback.
          To address <strong>the sparse judgments produced by conventional LLM-as-Judge approaches</strong>, built a Verifier
          Agent that samples multiple levels of token logprobs for the Judge''s local rubric judgments before and after Fix,
          integrating multimodal information and rollouts to extract precise dense signals. End-to-end automated/human evaluation
          showed <strong>data accuracy increasing from 29% to 70% (+41 pp)</strong>. Incorporated data from Doubao Office
          scenarios to form an <strong>Infra Model training data flywheel</strong>.'
      - id: judge-fix
        title: '[2] Training Judge/Fix Infra Models'
        paragraphs:
        - <strong>To address Seed 2's low accuracy/recall on Base Spec samples containing multiple issues</strong>, designed
          a post-training strategy combining <strong>causal-inference data synthesis, curriculum reinforcement learning, and
          on-policy context distillation</strong>, building a Spec Rubric Model based on <strong>Seed model self-distillation</strong>.
          Built a Spec-based causal-inference system, the Assumption-Based Truth Maintenance System, to <strong>strengthen
          Spec-Refine data synthesis</strong>. Based on Base capability boundaries, Query requirements, and derived reasoning,
          proposed DFS-based set propagation to compute minimal and contradictory assumption combinations. Used 10,000+ synthetic
          data trajectories generated by the DSH harness to <strong>post-train a Seed 2.0-based Judge model</strong>. Used
          Strict-SFT for cold start, introduced <strong>Category–Rubric–Mode hierarchical F1 Reward</strong>, and constructed
          confidence-structured chains of thought through <strong>stage-wise progression of dynamic weights</strong>. Used
          the GRPO-trained Judge model as a teacher, combining rubric and CoT prompts to strengthen the student model Seed
          2. Accuracy matched GPT-6.1, while <strong>Vote agreement and Rubric coverage improved by 35 pp and 45 pp, respectively</strong>.
          To improve Fix efficiency, extracted the synthesis pipeline's Fix capability from heterogeneous multi-teacher trajectories
          and trained a <strong>Fix Model</strong> through SFT+RFT+PPO, achieving <strong>accuracy 20 pp above GPT-6.1</strong>.
      - id: agentic-rl
        title: '[3] Lark Base CLI based on Agentic RL'
        paragraphs:
        - <strong>To overcome resource limits per online model unit and address sparse Code Agent signals, insufficient hard-case
          coverage, and long-tail issues</strong>, trained a Coding Agent using Spec, CodeAct, long trajectories with E2E
          Reward, and a PI harness. Dynamically loaded skills through Doubao's Super Mode harness and used <strong>optimized
          Specs as the Code Agent/CLI's chain of thought</strong> for Agentic RL, implementing Agentic RL for Lark Base CLI
          as a SubAgent in Doubao Office's MoA system. Trained an E2E Judge Model to turn feedback on <strong>requirement
          coverage, configuration correctness, cross-module dependencies, and overall usability</strong> into dense Code Agent
          signals. Designed an Auto Thinking mode that jointly considers compilation success, artifact correctness, and code
          efficiency, with <strong>Learning-frontier dynamic sampling based on GRPO checkpoint</strong> assessments of real-time
          data difficulty. Used compiler errors, failure logs, and successful rollouts as privileged context. For Base Spec
          generation, <strong>built a self-evolving dynamic harness for PE optimization</strong>, using cross-batch adversarial
          synthesis to remove sampling noise and identify shared root causes. Synthesized high-leverage, low-regression Prompt
          patches through evidence/stability/adversarial-robustness/net-benefit gates; <strong>token utilization efficiency
          improved by 38 pp</strong>. P50 latency fell from <strong>3.1 minutes to 23 seconds</strong>, supporting deployment
          at scale.
      papers: []
