Generator / Judge / dataset versions</span></div><div class="node soft" id="generate" style="left:570px;top:104px;width:800px;height:145px"><strong>Generate SpecDoc · one call</strong><span>Query → plan → audit → render</span><span data-node-detail="true" hidden="">UserQuery → one model call → SpecDoc
