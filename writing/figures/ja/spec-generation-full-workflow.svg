<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 857" width="1440" height="857" lang="ja"><foreignObject width="1440" height="857"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>
.diagram-root{margin:0;background:#fff;color:#303b36;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}
.canvas{position:relative;width:1440px;height:857px;background:#fff;box-sizing:border-box}
.node{position:absolute;box-sizing:border-box;padding:18px 24px;border:1.5px solid #bfcac1;border-radius:8px;background:#fff;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center;z-index:2}
.node strong{font-size:27px;line-height:1.23;font-weight:500;overflow-wrap:anywhere}
.node span{font-size:23px;line-height:1.35;color:#626e66;white-space:pre-line;overflow-wrap:anywhere}
.node.soft{background:#f3f6f1}.node.issue{background:#faf4ef;border-color:#d7c6b8}.node.result{background:#eff5ed;border-color:#9eaf96}
.edge{position:absolute;height:0;border-top:1.5px solid #9caa98;transform-origin:0 0;z-index:1}.edge.feedback{border-top-style:dashed}
.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #9caa98;border-top:4px solid transparent;border-bottom:4px solid transparent}
.label{position:absolute;font-size:21px;line-height:1.3;color:#687366;background:#fff;z-index:3;white-space:pre-line;box-sizing:border-box;padding:3px 6px}
.label.title{font-size:31px;font-weight:500;color:#303b36}.label.lane{font-size:24px;color:#405142}
</style><div class="canvas" data-fixed-type="true" data-research-diagram="spec-generation-full-workflow"><div class="edge arrow" data-from="pe" data-to="generate" style="left:470px;top:177px;width:100px;transform:rotate(0deg)"></div><div class="edge arrow" data-from="generate" data-to="judge" style="left:1155px;top:249px;width:87px;transform:rotate(90deg)"></div><div class="edge arrow" data-from="judge" data-to="attribute" style="left:940px;top:410px;width:100px;transform:rotate(180deg)"></div><div class="edge arrow" data-from="attribute" data-to="patch" style="left:500px;top:390px;width:100px;transform:rotate(180deg)"></div><div class="edge arrow" data-from="patch" data-to="paired" style="left:230px;top:501px;width:91px;transform:rotate(90deg)"></div><div class="edge arrow" data-from="paired" data-to="confirm" style="left:400px;top:643px;width:120px;transform:rotate(0deg)"></div><div class="edge arrow" data-from="confirm" data-to="decision" style="left:900px;top:652px;width:130px;transform:rotate(0deg)"></div><div class="edge feedback" data-from="decision" data-to="pe" style="left:1200px;top:757px;width:59px;transform:rotate(90deg)"></div><div class="edge feedback" data-from="decision" data-to="pe" style="left:1200px;top:816px;width:1175px;transform:rotate(180deg)"></div><div class="edge feedback" data-from="decision" data-to="pe" style="left:25px;top:816px;width:648px;transform:rotate(-90deg)"></div><div class="edge arrow feedback" data-from="decision" data-to="pe" style="left:25px;top:168px;width:35px;transform:rotate(0deg)"></div><div class="node " id="pe" style="left:60px;top:104px;width:410px;height:165px"><strong>PE + Skills</strong><span>Core + Shared + 4領域</span><span data-node-detail="true" hidden="">PE と設定を固定
Core + Shared + 4領域 Skills
生成モデル・Judge・データセットの版</span></div><div class="node soft" id="generate" style="left:570px;top:104px;width:800px;height:145px"><strong>SpecDoc を1回で生成</strong><span>Query → 計画 → 監査 → 出力</span><span data-node-detail="true" hidden="">UserQuery → 1回のモデル呼び出し → SpecDoc
理解 → 要素登録 → 領域計画 → 整合性監査 → 出力
すべて同じ呼び出し内で実施。候補間で設定を揃えて各問を生成</span></div><div class="node " id="judge" style="left:940px;top:336px;width:430px;height:165px"><strong>Spec を評価</strong><span>判定と失敗証拠を保存</span><span data-node-detail="true" hidden="">生成 Spec を Judge で評価
領域判定・失敗理由・成果物を保存
評価基準を固定</span></div><div class="node " id="attribute" style="left:500px;top:336px;width:340px;height:165px"><strong>失敗を分析</strong><span>実験ごとに1つの探索方式</span><span data-node-detail="true" hidden="">失敗を分析
探索方式を1つ選ぶ
ルール・パッチ・自由分析・記憶</span></div><div class="node " id="patch" style="left:60px;top:336px;width:340px;height:165px"><strong>PE / Skills を変更</strong><span>範囲限定・汎用性を審査</span><span data-node-detail="true" hidden="">PE / Skills の変更を提案
許可範囲だけを変更
汎用性と製品制約を確認</span></div><div class="node " id="paired" style="left:60px;top:592px;width:340px;height:165px"><strong>対応する条件で評価</strong><span>同じ問題・モデル設定</span><span data-node-detail="true" hidden="">対になる生成・評価
候補と基準は同じ問題・設定
局所選別後に回帰評価</span></div><div class="node " id="confirm" style="left:520px;top:592px;width:380px;height:165px"><strong>全件の回帰評価</strong><span>改善と退行を確認</span><span data-node-detail="true" hidden="">全件回帰と KEEP 判定
実験で定めた採用基準を使う
改善と退行を併せて確認</span></div><div class="node result" id="decision" style="left:1030px;top:592px;width:340px;height:165px"><strong>KEEP / DISCARD</strong><span>基準を更新・復元</span><span data-node-detail="true" hidden="">候補を採用・破棄
KEEP：基準を更新
DISCARD：基準を復元し原因を記録</span></div><div class="label title" style="left:54px;top:24px;width:1320px">Spec 生成 · 全体フロー</div></div></div></foreignObject></svg>
