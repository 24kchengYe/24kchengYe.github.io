<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 590" width="1440" height="590" lang="en"><foreignObject width="1440" height="590"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>*{box-sizing:border-box}.diagram-root{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1440px;overflow:hidden;background:#fff}.node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;border:1.5px solid #a4afa5;background:#fff;border-radius:4px;padding:10px 16px;font-size:24px;line-height:1.4;z-index:2}.node.soft{background:#eff4ec;border-color:#9eaf94}.math{font-size:.86em;color:#56645b}.title{position:absolute;left:40px;top:28px;font-size:29px;font-weight:500}.legend{position:absolute;top:36px;font-size:18px;color:#6a766d}.legend:before{content:"";display:inline-block;width:30px;border-top:1.5px solid #91a08f;vertical-align:middle;margin-right:12px}.legend.control:before{border-top-style:dashed}.edge{position:absolute;height:0;border-top:1.5px solid #91a08f;transform-origin:0 0;z-index:1}.edge.control{border-top-style:dashed}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #91a08f;border-top:4px solid transparent;border-bottom:4px solid transparent}.note{position:absolute;left:40px;width:1360px;font-size:20px;line-height:1.5;color:#68766c;border-top:1px solid #e0e6dc;padding-top:20px}.annotation{position:absolute;font-size:22px;color:#68766c}</style><main class="canvas" style="height:590px">
<div class="title">HCA</div><div class="legend" style="left:760px">Solid: tensor flow</div><div class="legend control" style="left:1070px">Dashed: selection / gates</div>
<div class="edge" data-from="history" data-to="compressed" style="left:260px;top:260px;width:60px;transform:rotate(0deg)"></div>
<div class="edge" data-from="history" data-to="compressed" style="left:320px;top:260px;width:75px;transform:rotate(-90deg)"></div>
<div class="edge arrow" data-from="history" data-to="compressed" style="left:320px;top:185px;width:60px;transform:rotate(0deg)"></div>
<div class="edge" data-from="history" data-to="local" style="left:150px;top:330px;width:70px;transform:rotate(90deg)"></div>
<div class="edge arrow" data-from="history" data-to="local" style="left:150px;top:400px;width:230px;transform:rotate(0deg)"></div>
<div class="edge" data-from="compressed" data-to="attention" style="left:680px;top:185px;width:60px;transform:rotate(0deg)"></div>
<div class="edge" data-from="compressed" data-to="attention" style="left:740px;top:185px;width:80px;transform:rotate(90deg)"></div>
<div class="edge arrow" data-from="compressed" data-to="attention" style="left:740px;top:265px;width:360px;transform:rotate(0deg)"></div>
<div class="edge arrow" data-from="local" data-to="attention" style="left:680px;top:400px;width:420px;transform:rotate(0deg)"></div>
<div class="edge" data-from="query" data-to="attention" style="left:1060px;top:125px;width:190px;transform:rotate(0deg)"></div>
<div class="edge arrow" data-from="query" data-to="attention" style="left:1250px;top:125px;width:95px;transform:rotate(90deg)"></div>
<div class="node " id="history" style="left: 40px; top: 230px; width: 220px; height: 100px; font-size: 19px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">Historical hidden states<br /><span class="math">X</span></span></div>
<div class="node soft" id="compressed" style="left: 380px; top: 130px; width: 300px; height: 110px; font-size: 21px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">Stronger sequence compression<br /><span class="math">N × c → ≈ (N/m′) × c</span></span></div>
<div class="node soft" id="local" style="left: 380px; top: 350px; width: 300px; height: 100px; font-size: 20px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">Local uncompressed KV<br /><span class="math">X → Kʷⁱⁿ, Vʷⁱⁿ</span></span></div>
<div class="node " id="query" style="left: 780px; top: 80px; width: 280px; height: 90px; font-size: 16px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">Current-state projections<br /><span class="math">xₜ → Q</span></span></div>
<div class="node soft" id="attention" style="left: 1100px; top: 220px; width: 300px; height: 200px; font-size: 24px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">Attention read<br /><span class="math">All completed compressed blocks + local KV<br />→ Softmax → oₜ</span></span></div>

<div class="note" style="top:495px">m′ ≫ m; no Top-k. The compressed branch reads completed blocks preceding the query.</div>
</main></div></foreignObject></svg>
