    entries:
    - id: urbanalign
      title: '[1] LLMの事後学習 | 人間の視覚的選好との意味的アライメント'
      date: 2025.10 – 2026.02
      role: 筆頭著者＋責任著者 | <a href="https://doi.org/10.1007/978-3-032-37132-4_18">ECCV 2026</a>
      paragraphs:
      - 大規模視覚言語モデル（VLM）は豊富な視覚要素を認識できるが、出力には人間の選好との系統的なずれがある。既存のアライメント手法は大量のアノテーションデータと計算資源に依存し、解釈可能性にも乏しい。<strong>視覚RAG向けの事後的概念ボトルネックによるアライメント手法</strong>（Post-hoc
        Concept Bottleneck）を提案。解釈可能な評価次元を自動発見し、Observer-Debater-Judgeのマルチエージェント連鎖で凍結VLMから頑健な概念スコアを抽出し、視覚・意味の混合多様体上で局所重み付きリッジ回帰により人間の評点へ較正する。さらに、エンドツーエンドの次元最適化ループにより<strong>精度と解釈可能性を同時に確保</strong>。都市景観の知覚評価で<strong>72.2%</strong>の正解率（κ=0.45）を達成し、教師ありベースラインを<strong>15.1パーセントポイント</strong>、未較正VLMを<strong>16.3パーセントポイント</strong>上回った。
      papers:
      - '論文：<strong>Zhang Y</strong>*, Zhao R, …, Shi C*. UrbanAlign: Post-hoc Semantic Calibration for VLM-Human Preference
        Alignment. <a href="https://doi.org/10.1007/978-3-032-37132-4_18">ECCV 2026</a>.'
    - id: urban-data
      title: '[2] AI4Science | マルチモーダル都市データマイニング'
      date: 2021.09 – 2025.10
      role: 筆頭著者ほか | <a href="https://doi.org/10.1038/s41597-025-04730-5">Scientific Data</a>, <a href="https://arxiv.org/abs/2505.07057">CVPR</a>,
        <a href="https://arxiv.org/abs/2511.17558">AAAI</a>, <a href="https://doi.org/10.1016/j.habitatint.2025.103350">Habitat
        International</a>, <a href="https://doi.org/10.1016/j.jag.2022.102942">JAG</a>
      paragraphs:
      - 都市研究では、尺度の多様性、空間的異質性、変化の複雑さにより、標準化された大規模都市データセットが不足している。<strong>連続的な時空間変化を対象とした複数時点の画像解釈と空間マッチング</strong>を提案し、<a href="https://doi.org/10.1016/j.isci.2024.110125">GloPPRUA</a>、<a
        href="https://doi.org/10.1016/j.habitatint.2025.103350">GloGCI</a>、<a href="https://doi.org/10.1038/s41597-025-04730-5">CMAB</a>を構築。過去と現在のリモートセンシング画像における解像度の劣化、輪郭のぎざつき、系統的な位置ずれに対し、<strong>解像度分布のマッチングで強化したHRNet-W48+U-Net</strong>を設計（強いぼけ条件のDiceが<strong>0.684から0.756へ向上</strong>）。<strong>RGB–Maskの4チャネルGAN</strong>で敵対的損失、L1、IoU、エッジ損失を組み合わせて輪郭を整え（建物輪郭の直角率が<strong>0.398から0.624へ向上</strong>）、1
        mのDPベクトル化、条件付き形態ルーティング、安全なフォールバックによって追跡可能なPolygonを生成した。同年代の複数日付による補足証拠、全体・局所の位置ずれ較正、7特徴を用いる2ラウンドの文脈マッチングを組み合わせ、時点間の関係グラフを構築。1,000都市で約<strong>1,478万件の2時点建物観測インスタンス</strong>を形成した。CMABとGloGCIはいずれも<strong>ESI高被引用論文</strong>（Top
        1%）に選出され、<a href="https://figshare.com/authors/Yecheng_Zhang/20402873"><strong>データとコードは累計79,500回ダウンロード</strong></a>された。
      papers:
      - '論文：<strong>Zhang Y</strong><sup>†</sup>, Zhao H<sup>†</sup>, Long Y*. CMAB: A Multi-Attribute Building Dataset of
        China. <a href="https://doi.org/10.1038/s41597-025-04730-5">Scientific Data</a>, 2025.'
      - 論文：<strong>Zhang Y</strong>, Tu T, Long Y*. Inferring Ghost Cities on the Globe in Newly Developed Urban Areas Based
        on Urban Vitality with Multi-source Data. <a href="https://doi.org/10.1016/j.habitatint.2025.103350">Habitat International</a>,
        2025.
      - 論文：<strong>Zhang Y</strong>, Zhang Q, …, Zheng H*. Urban Spatial Risk Prediction and Optimization Analysis of POI
        Based on Deep Learning. <a href="https://doi.org/10.1016/j.jag.2022.102942">International Journal of Applied Earth
        Observation and Geoinformation</a>, 2022.
      - 論文：<strong>Zhang Y</strong>, Long Y*. Towards building-scale urban analytics and simulation. Building Simulation,
        2026.
    - id: ai4us
      title: '[3] AI4Science | 大規模モデルによる科学データ合成と制御実験'
      date: 2024.09 – 現在
      role: 筆頭著者／責任著者 | <a href="https://arxiv.org/abs/2505.13803">arXiv</a>
      paragraphs:
      - 生成型大規模モデルは科学データの合成に利用され始めているが、有意な関係を再現することは、実証パラメータやデータの異質性を回復すること、あるいは再現可能な実験を支えることと同義ではない。<strong>AI4USマルチモーダル評価フレームワーク</strong>を提案し、Data
        SynthesisとConditional Interventionの2経路から、都市スケーリング、距離減衰、街区の活力、街路景観の知覚という4種類のタスクで、<strong>関係の再現、実証パラメータ／分布との整合性、制御条件への応答</strong>を統一的に評価した。結果から、GenAIは識別可能な都市の規則性を回復し、4種類すべてのタスクで安定した方向性のある応答を生成できる一方、<strong>数値のカバレッジ、局所的な変動、視覚的な多様性</strong>を系統的に圧縮することが明らかになった。さらにQwen2.5-VL-72Bで<strong>Profile–Probe–Interveneによる機構分析</strong>を構築し、一部の規則性は中間表現からデコードでき、局所的な出力に影響することを検証した。
      papers:
      - 論文：<strong>Zhang Y</strong>, Zhao R, Huang Z, Long Y*. GenAI Models Capture Urban Science but Oversimplify Complexity.
        <a href="https://arxiv.org/abs/2505.13803">arXiv</a>, 2025.
      - 論文：Zhao R, Liu W, …, <strong>Zhang Y</strong>*. Large Language Models Perceive Cities through a Culturally Uneven
        Baseline. <a href="https://arxiv.org/abs/2604.20048">arXiv</a>, 2026.
    footer: 複数の学術誌・会議で査読を担当：Nature Communications, Nature Cities, Scientific Data, npj Urban Sustainability, Cities, CEUS,
      Verixiv
