<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1340" width="1200" height="1340" lang="zh"><foreignObject width="1200" height="1340"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root" data-diagram-style="openai-blog" data-diagram-kind="flow"><style>*{box-sizing:border-box}.diagram-root{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;background:#fff;overflow:hidden}.heading{position:absolute;left:40px;top:24px;font-size:30px;line-height:1.3}.node{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px 18px;text-align:center;border:1px solid #a6b1a1;border-radius:5px;background:#fff;font-size:28px;line-height:1.25;z-index:2}.node.soft{background:#f1f5ec}.node.plan{border-style:dashed}.node.failed{background:#faf3e9;border-color:#d8bf9f}.sub{font-size:24px;line-height:1.35;color:#687568}.label{position:absolute;font-size:22px;line-height:1.35;color:#687568;background:#fff;padding:3px 6px;text-align:center;z-index:3}.region{position:absolute;border:1px solid #d4ddcd;border-radius:6px}.region-title{position:absolute;top:-19px;left:20px;padding:0 10px;background:#fff;font-size:26px}.edge{position:absolute;height:0;border-top:1.6px solid #98a58c;transform-origin:0 0;z-index:1}.edge.feedback,.edge.support{border-top-style:dashed}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #98a58c;border-top:4px solid transparent;border-bottom:4px solid transparent}.note{position:absolute;left:40px;font-size:22px;line-height:1.5;color:#687568}.math{font-family:Georgia,serif;font-style:italic;font-size:30px}.canvas { color:#303c38; }
.node,.bundle,.checkpoint,.restore { border-width:1.6px; border-color:#87938a; border-radius:8px; box-shadow:none; }
.region,.workspace { border-color:#d5ddd5; border-radius:8px; }
.workspace { background:#fafbf9; }
.node { font-size:28px; }
.title,.heading { font-size:30px; }
.sub,.bundle .small,.dependency-row { font-size:24px; color:#667269; }
.edge-label,.note { font-size:22px; color:#667269; }
.edge { border-top-width:1.6px; border-top-color:#748176; }
.edge.arrow:after { border-left-color:#748176; }
.edge.handoff { border-color:#7e9668; }
.edge.handoff.arrow:after { border-left-color:#7e9668; }
.edge.failure { border-color:#98a196; }
.edge.failure.arrow:after { border-left-color:#98a196; }
.node.plan { border-style:dashed; }
.node.output,.node.soft { background:#f3f6ef; }
.node.pending { background:#f7f8f6; }
.node.failed { background:#fcf7ef; border-color:#b99970; }
</style><main class="canvas" data-fixed-type="" style="width: 1200px; height: 1340px;"><div class="heading">规划、共享 Harness 与修复回流</div>
