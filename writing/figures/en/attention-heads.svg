<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 450" width="1440" height="450" lang="en"><foreignObject width="1440" height="450"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root" data-diagram-style="openai-blog" data-diagram-kind="flow"><style>*{box-sizing:border-box}.diagram-root{margin:0;color:#303c38;background:white;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1440px;background:white;overflow:hidden}.head{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;background:white;border:1.5px solid #8c9a90;border-radius:3px;padding:10px 4px;font-size:22px;line-height:1.4}.soft{background:#edf3e9;border-color:#8a9c7d}.quiet{background:#f7f8f6;border-color:#d6dcd5}.label{position:absolute;font-size:23px;line-height:1.45;color:#65736a}.title{font-size:29px;color:#303c38;font-weight:500}.center{text-align:center}.small{font-size:21px}.mono{font-family:ui-monospace,Menlo,monospace;font-size:22px}.line{position:absolute;height:0;border-top:1.5px solid #8c9a90}.arrow:after{content:"";position:absolute;right:-1px;top:-4.5px;border-left:7px solid #8c9a90;border-top:4px solid transparent;border-bottom:4px solid transparent}.vertical{width:0;border-top:0;border-left:1.5px solid #8c9a90}.down:after{content:"";position:absolute;bottom:-1px;left:-4.5px;border-top:7px solid #8c9a90;border-left:4px solid transparent;border-right:4px solid transparent}.dashed{border-style:dashed}.rule{border-color:#e0e5dd;border-width:1px}.cells{position:absolute;display:grid}.cells i{display:block;background:#f4f6f2;border:1px solid #e0e5dd;border-radius:1px}.cells i.on{background:#ceddc4;border-color:#afc39f}.canvas{height:450px}
.diagram-root{font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.label,.legend,.note,.annotation,.small-note,.caption,.axis{font-size:22px}.title,.label.title{font-size:30px}.group-title,.chart h2{font-size:26px}.chart-row,.plot-row,.matrix&gt;div,.stat-grid p,.val{font-size:26px}.matrix .muted,.math,.legend,.small{font-size:24px}</style><main class="canvas">
