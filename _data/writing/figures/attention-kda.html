<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>KDA</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1440px;overflow:hidden;background:#fff}.node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;border:1.5px solid #a4afa5;background:#fff;border-radius:4px;padding:10px 16px;font-size:24px;line-height:1.4;z-index:2}.node.soft{background:#eff4ec;border-color:#9eaf94}.math{font-size:.86em;color:#56645b}.title{position:absolute;left:40px;top:28px;font-size:29px;font-weight:500}.legend{position:absolute;top:36px;font-size:18px;color:#6a766d}.legend:before{content:"";display:inline-block;width:30px;border-top:1.5px solid #91a08f;vertical-align:middle;margin-right:12px}.legend.control:before{border-top-style:dashed}.edge{position:absolute;height:0;border-top:1.5px solid #91a08f;transform-origin:0 0;z-index:1}.edge.control{border-top-style:dashed}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #91a08f;border-top:4px solid transparent;border-bottom:4px solid transparent}.note{position:absolute;left:40px;width:1360px;font-size:20px;line-height:1.5;color:#68766c;border-top:1px solid #e0e6dc;padding-top:20px}.annotation{position:absolute;font-size:22px;color:#68766c}</style></head><body><main class="canvas" style="height:790px">
<div class="title">KDA</div><div class="legend" style="left:760px">实线：张量流</div><div class="legend control" style="left:1070px">虚线：选择 / 门控</div>
<div class="edge arrow" data-from="previous" data-to="decay" style="left:270px;top:220px;width:90px;transform:rotate(0deg)"></div>
<div class="edge arrow" data-from="decay" data-to="residual" style="left:660px;top:220px;width:100px;transform:rotate(0deg)"></div>
<div class="edge arrow" data-from="residual" data-to="write" style="left:1060px;top:220px;width:40px;transform:rotate(0deg)"></div>
<div class="edge" data-from="decay" data-to="write" style="left:510px;top:160px;width:60px;transform:rotate(-90deg)"></div>
<div class="edge" data-from="decay" data-to="write" style="left:510px;top:100px;width:740px;transform:rotate(0deg)"></div>
<div class="edge arrow" data-from="decay" data-to="write" style="left:1250px;top:100px;width:60px;transform:rotate(90deg)"></div>
<div class="edge control arrow" data-from="alpha" data-to="decay" style="left:510px;top:470px;width:190px;transform:rotate(-90deg)"></div>
<div class="edge arrow" data-from="kv" data-to="residual" style="left:910px;top:470px;width:190px;transform:rotate(-90deg)"></div>
<div class="edge" data-from="kv" data-to="write" style="left:1060px;top:525px;width:20px;transform:rotate(0deg)"></div>
<div class="edge" data-from="kv" data-to="write" style="left:1080px;top:525px;width:255px;transform:rotate(-90deg)"></div>
<div class="edge arrow" data-from="kv" data-to="write" style="left:1080px;top:270px;width:20px;transform:rotate(0deg)"></div>
<div class="edge arrow" data-from="write" data-to="read" style="left:1250px;top:310px;width:160px;transform:rotate(90deg)"></div>
<div class="node soft" id="previous" style="left:40px;top:170px;width:230px;height:100px;font-size:24px">上一时刻状态<br><span class="math">Sₜ₋₁</span></div>
<div class="node soft" id="decay" style="left:360px;top:160px;width:300px;height:120px;font-size:24px">衰减旧状态<br><span class="math">S̄ₜ = Sₜ₋₁ Diag(αₜ)</span></div>
<div class="node " id="residual" style="left:760px;top:160px;width:300px;height:120px;font-size:24px">值预测残差<br><span class="math">rₜ = vₜ − S̄ₜ kₜ</span></div>
<div class="node soft" id="write" style="left:1100px;top:160px;width:300px;height:150px;font-size:24px">Delta 写入<br><span class="math">Sₜ = S̄ₜ + βₜ rₜ kₜᵀ</span></div>
<div class="node " id="alpha" style="left:360px;top:470px;width:300px;height:130px;font-size:24px">通道级遗忘门<br><span class="math">xₜ → αₜ</span></div>
<div class="node " id="kv" style="left:760px;top:470px;width:300px;height:130px;font-size:24px">当前隐状态投影<br><span class="math">xₜ → kₜ, vₜ, βₜ</span></div>
<div class="node " id="read" style="left:1100px;top:470px;width:300px;height:130px;font-size:22px">读取 → 归一化 / 输出门<br><span class="math">xₜ → qₜ<br>oₜ = Sₜ qₜ</span></div>

<div class="annotation" style="left:1050px;top:355px;background:white;padding:4px">kₜ, βₜ</div>
<div class="note" style="top:695px">S 的列是 key 通道：向量 α 从右侧缩放各列；β 控制残差写入。</div>
</main></body></html>
