<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 740" width="1440" height="740" lang="ja"><foreignObject width="1440" height="740"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>*{box-sizing:border-box}.diagram-root{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1440px;overflow:hidden;background:#fff}.node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;border:1.5px solid #a4afa5;background:#fff;border-radius:4px;padding:10px 16px;font-size:24px;line-height:1.4;z-index:2}.node.soft{background:#eff4ec;border-color:#9eaf94}.math{font-size:.86em;color:#56645b}.title{position:absolute;left:40px;top:28px;font-size:29px;font-weight:500}.legend{position:absolute;top:36px;font-size:18px;color:#6a766d}.legend:before{content:"";display:inline-block;width:30px;border-top:1.5px solid #91a08f;vertical-align:middle;margin-right:12px}.legend.control:before{border-top-style:dashed}.edge{position:absolute;height:0;border-top:1.5px solid #91a08f;transform-origin:0 0;z-index:1}.edge.control{border-top-style:dashed}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #91a08f;border-top:4px solid transparent;border-bottom:4px solid transparent}.note{position:absolute;left:40px;width:1360px;font-size:20px;line-height:1.5;color:#68766c;border-top:1px solid #e0e6dc;padding-top:20px}.annotation{position:absolute;font-size:22px;color:#68766c}</style><main class="canvas" style="height:740px">
<div class="title">MoBA</div><div class="legend" style="left:760px">実線：テンソル</div><div class="legend control" style="left:1070px">破線：選択・ゲート</div>
<div class="edge" data-from="history" data-to="past" style="left:155px;top:260px;width:90px;transform:rotate(-90deg)"></div>
<div class="edge arrow" data-from="history" data-to="past" style="left:155px;top:170px;width:205px;transform:rotate(0deg)"></div>
<div class="edge" data-from="history" data-to="current" style="left:155px;top:360px;width:215px;transform:rotate(90deg)"></div>
<div class="edge arrow" data-from="history" data-to="current" style="left:155px;top:575px;width:205px;transform:rotate(0deg)"></div>
<div class="edge" data-from="history" data-to="gather" style="left:270px;top:310px;width:420px;transform:rotate(0deg)"></div>
<div class="edge" data-from="history" data-to="gather" style="left:690px;top:310px;width:60px;transform:rotate(90deg)"></div>
<div class="edge arrow" data-from="history" data-to="gather" style="left:690px;top:370px;width:50px;transform:rotate(0deg)"></div>
<div class="edge arrow" data-from="past" data-to="router" style="left:650px;top:170px;width:90px;transform:rotate(0deg)"></div>
<div class="edge control arrow" data-from="router" data-to="gather" style="left:885px;top:220px;width:100px;transform:rotate(90deg)"></div>
<div class="edge arrow" data-from="query" data-to="router" style="left:1100px;top:145px;width:70px;transform:rotate(180deg)"></div>
<div class="edge arrow" data-from="query" data-to="attention" style="left:1250px;top:220px;width:100px;transform:rotate(90deg)"></div>
<div class="edge arrow" data-from="gather" data-to="attention" style="left:1030px;top:370px;width:70px;transform:rotate(0deg)"></div>
<div class="edge" data-from="current" data-to="attention" style="left:650px;top:575px;width:600px;transform:rotate(0deg)"></div>
<div class="edge arrow" data-from="current" data-to="attention" style="left:1250px;top:575px;width:45px;transform:rotate(-90deg)"></div>
<div class="node soft" id="history" style="left: 40px; top: 260px; width: 230px; height: 100px; font-size: 24px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">KV blocks<br /><span class="math">K, V</span></span></div>
<div class="node " id="past" style="left: 360px; top: 120px; width: 290px; height: 100px; font-size: 24px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">過去ブロックの平均 K<br /><span class="math">mean(Kᵇ)</span></span></div>
<div class="node soft" id="current" style="left: 360px; top: 520px; width: 290px; height: 110px; font-size: 23px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">現在ブロックは必須<br /><span class="math">ブロック内は因果マスク</span></span></div>
<div class="node " id="router" style="left: 740px; top: 120px; width: 290px; height: 100px; font-size: 19px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">過去ブロックのみ選択<br /><span class="math">Q · mean(Kᵇ) → Top-(k−1)</span></span></div>
<div class="node soft" id="gather" style="left: 740px; top: 320px; width: 290px; height: 100px; font-size: 19px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">選択した過去ブロックの KV を取得<br /><span class="math">KV[past selected]</span></span></div>
<div class="node " id="query" style="left: 1100px; top: 100px; width: 300px; height: 120px; font-size: 24px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">現在状態の投影<br /><span class="math">xₜ → Q</span></span></div>
<div class="node soft" id="attention" style="left: 1100px; top: 320px; width: 300px; height: 210px; font-size: 24px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">選択した全 token で softmax<br /><span class="math">選択した過去 + 現在の因果ブロック<br />→ Attention → oₜ</span></span></div>

<div class="note" style="top:645px">k は現在のブロックを含む。k = 3 なら過去は最大 2 ブロック。</div>
</main></div></foreignObject></svg>
