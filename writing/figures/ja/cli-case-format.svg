<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 2220" width="1440" height="2220" lang="ja"><foreignObject width="1440" height="2220"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>*{box-sizing:border-box}.diagram-root{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1440px;height:2220px;background:#fff;overflow:hidden}.title{position:absolute;left:50px;top:28px;font-size:30px;line-height:1.3}.intro{position:absolute;left:50px;top:82px;font-size:24px;line-height:1.4}.legend{position:absolute;left:50px;top:128px;font-size:22px;line-height:1.4;color:#687568}.columns,.step{position:absolute;left:50px;width:1340px;display:grid;grid-template-columns:180px 400px 330px 430px}.columns{top:174px;height:44px;color:#687568;font-size:22px;line-height:1.3;border-bottom:1px solid #bbc6b5}.columns&gt;div{padding:0 16px}.step{height:112px;border-bottom:1px solid #e2e7de}.cell{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;min-width:0;padding:10px 16px;font-size:24px;line-height:1.38}.cell span{max-width:100%;overflow-wrap:break-word}.tool,.index&gt;span:first-child{font-size:28px;line-height:1.25}.sub{display:block;margin-top:5px;font-size:24px;line-height:1.38;color:#687568}.index{color:#687568}.index .sub{font-size:22px}.failed{background:#faf1e6;border-left:3px solid #bf9662}.repaired{background:#eff4e9;border-left:3px solid #97aa87}.control{position:absolute;left:50px;width:1340px;height:96px;display:flex;align-items:center;gap:16px;padding:10px 22px 10px 196px;font-size:22px;line-height:1.45;color:#65755c;border-bottom:1px solid #c7d1bf}.return{font-size:30px}.footer{position:absolute;left:50px;width:1340px;font-size:22px;line-height:1.5;color:#687568}</style><main class="canvas" data-fixed-type=""><div class="title">実際の在庫 Case · 試行15回、保持13ターン</div><div class="intro">スキル読解から納品まで。各行は実際のモデル応答1回。</div><div class="legend">薄橙：破棄した失敗試行　薄緑：修正後の実行　白：保持したターン</div><div class="columns"><div>試行 / ターン</div><div>ツールと動作</div><div>実際の返却値</div><div>実行後の状態</div></div>
<div class="step " data-attempt="1" data-turn="1" data-disposition="retained" style="top:218px"><div class="cell index"><span>P01</span><span class="sub">T1</span></div><div class="cell"><span class="tool">Read</span><span class="sub">Base スキルを読む</span></div><div class="cell"><span>SKILL.md の本文</span></div><div class="cell"><span>規則が文脈に加わる。Base は未作成</span></div></div>
<div class="step " data-attempt="2" data-turn="2" data-disposition="retained" style="top:330px"><div class="cell index"><span>P02</span><span class="sub">T2</span></div><div class="cell"><span class="tool">Read</span><span class="sub">システム構築ガイドを読む</span></div><div class="cell"><span>構築規則を取得</span></div><div class="cell"><span>設計規則を追加。環境は変化なし</span></div></div>
<div class="step failed" data-attempt="3" data-turn="3" data-disposition="discarded" style="top:442px"><div class="cell index"><span>P03</span><span class="sub">T3 ×</span></div><div class="cell"><span class="tool">Bash</span><span class="sub">Base 作成 · 数値の型コード</span></div><div class="cell"><span>引数検証エラー · 12件</span></div><div class="cell"><span>有効な作成結果なし。この試行を破棄</span></div></div><div class="control" data-before-turn="3" style="top:554px"><span class="return">↶</span><span>T3の直前へ復元。T1–2を保持し、フィールドSchemaに従って動作を再選択。</span></div>
<div class="step repaired" data-attempt="4" data-turn="3" data-disposition="retained" style="top:650px"><div class="cell index"><span>P04</span><span class="sub">T3</span></div><div class="cell"><span class="tool">Bash</span><span class="sub">フィールド修正 · 文字列の型名</span></div><div class="cell"><span>ok: true · created: true</span></div><div class="cell"><span>Base A と商品テーブルを作成</span></div></div>
<div class="step " data-attempt="5" data-turn="4" data-disposition="retained" style="top:762px"><div class="cell index"><span>P05</span><span class="sub">T4</span></div><div class="cell"><span class="tool">Bash</span><span class="sub">入出庫記録テーブルを作成</span></div><div class="cell"><span>ok: true</span></div><div class="cell"><span>2つのテーブル。レコードは未登録</span></div></div>
<div class="step failed" data-attempt="6" data-turn="5" data-disposition="discarded" style="top:874px"><div class="cell index"><span>P06</span><span class="sub">T5 ×</span></div><div class="cell"><span class="tool">Bash</span><span class="sub">商品を一括登録 · --records</span></div><div class="cell"><span>unknown flag --records</span></div><div class="cell"><span>書き込み未実行。商品は0件のまま</span></div></div><div class="control" data-before-turn="5" style="top:986px"><span class="return">↶</span><span>T5の直前へ復元。T1–4を保持し、Base AをBに複製。リソースIDを対応付けて再選択。</span></div>
<div class="step repaired" data-attempt="7" data-turn="5" data-disposition="retained" style="top:1082px"><div class="cell index"><span>P07</span><span class="sub">T5</span></div><div class="cell"><span class="tool">Bash</span><span class="sub">一括登録のヘルプ · --help</span></div><div class="cell"><span>--json · create_records</span></div><div class="cell"><span>入力形式を確認。データは未登録</span></div></div>
<div class="step repaired" data-attempt="8" data-turn="6" data-disposition="retained" style="top:1194px"><div class="cell index"><span>P08</span><span class="sub">T6</span></div><div class="cell"><span class="tool">Bash</span><span class="sub">ヘルプに従い --json で登録</span></div><div class="cell"><span>ok: true · レコードID 6件</span></div><div class="cell"><span>商品0 → 6件。修正を検証</span></div></div>
<div class="step " data-attempt="9" data-turn="7" data-disposition="retained" style="top:1306px"><div class="cell index"><span>P09</span><span class="sub">T7</span></div><div class="cell"><span class="tool">Bash</span><span class="sub">入出庫のサンプル6件を登録</span></div><div class="cell"><span>ok: true · レコードID 6件</span></div><div class="cell"><span>入出庫記録0 → 6件</span></div></div>
<div class="step " data-attempt="10" data-turn="8" data-disposition="retained" style="top:1418px"><div class="cell index"><span>P10</span><span class="sub">T8</span></div><div class="cell"><span class="tool">Bash</span><span class="sub">入出庫フォームを作成</span></div><div class="cell"><span>ok: true · type: form</span></div><div class="cell"><span>入力画面を追加。件数は変化なし</span></div></div>
<div class="step " data-attempt="11" data-turn="9" data-disposition="retained" style="top:1530px"><div class="cell index"><span>P11</span><span class="sub">T9</span></div><div class="cell"><span class="tool">Bash</span><span class="sub">在庫ダッシュボードを作成</span></div><div class="cell"><span>ok: true · created: true</span></div><div class="cell"><span>ダッシュボードの枠を追加</span></div></div>
<div class="step " data-attempt="12" data-turn="10" data-disposition="retained" style="top:1642px"><div class="cell index"><span>P12</span><span class="sub">T10</span></div><div class="cell"><span class="tool">Bash</span><span class="sub">商品を再取得 · record-list</span></div><div class="cell"><span>count=6 · has_more=false</span></div><div class="cell"><span>商品6件を確認。読み取りのみ</span></div></div>
<div class="step " data-attempt="13" data-turn="11" data-disposition="retained" style="top:1754px"><div class="cell index"><span>P13</span><span class="sub">T11</span></div><div class="cell"><span class="tool">Bash</span><span class="sub">入出庫記録を再取得 · record-list</span></div><div class="cell"><span>count=6 · has_more=false</span></div><div class="cell"><span>入出庫6件を確認。読み取りのみ</span></div></div>
<div class="step " data-attempt="14" data-turn="12" data-disposition="retained" style="top:1866px"><div class="cell index"><span>P14</span><span class="sub">T12</span></div><div class="cell"><span class="tool">present_files</span><span class="sub">Base リンクを納品</span></div><div class="cell"><span>Delivered 1 items</span></div><div class="cell"><span>リンクを納品。Base は変化なし</span></div></div>
<div class="step " data-attempt="15" data-turn="13" data-disposition="retained" style="top:1978px"><div class="cell index"><span>P15</span><span class="sub">T13</span></div><div class="cell"><span class="tool">最終応答</span><span class="sub">構築結果をまとめる</span></div><div class="cell"><span>ツール呼び出し・返却値なし</span></div><div class="cell"><span>生成終了。業務品質は別途評価</span></div></div>
<div class="footer" style="top:2120px">Pは実際の試行、Tは最終軌跡のターン番号。復元制御は追加ターンではなく、2回の失敗は監査とコスト記録に残る。</div></main></div></foreignObject></svg>
