eft:1080px;top:312px;width:55px;border-top:1.25px solid #424942"></div><div class="tip" style="left:1120px;top:307px;border-color:#424942;transform:rotate(45deg)"></div><div class="rule" style="left:70px;right:70px;top:395px"></div><div class="node small" style="left: 40px; top: 402.5px; width: 230px; height: 150px; font-size: 24px; line-height: 1.25;" data-type-role="secondary"><span style="min-width: 0; overflow-wrap: anywhere;">Guarded-Patch</span></div><div class="node box small" style="left: 295px; top: 402.5px; width: 225px; height: 150px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">多个候选</span></div><div class="node box small accent" style="left: 575px; top: 402.5px; width: 225px; height: 150px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">锚点插入<br />diff guard</span></div><div class="node box small" style="left: 855px; top: 402.5px; width: 225px; height: 150px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">重复配对评测</span></div><div class="node box small" style="left: 1135px; top: 402.5px; width: 225px; height: 150px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">候选排序</span></div><div class="wire" style="left:520px;top:477px;width:55px;border-top:1.25px solid #424942"></div><div class="tip" style="left:560px;top:472px;border-color:#424942;transform:rotate(45deg)"></div><div class="wire" style="left:800px;top:477px;width:55px;border-top:1.25px solid #424942"></div><div class="tip" style="left:840px;top:472px;border-color:#424942;transform:rotate(45deg)"></div><div class="wire" style="left:1080px;top:477px;width:55px;border-top:1.25px solid #424942"></div><div class="tip" style="left:1120px;top:472px;border-color:#424942;transform:rotate(45deg)"></div><div class="rule" style="left:70px;right:70px;top:560px"></div><div class="node small" style="left: 40px; top: 567.5px; width: 230px; height: 150px; font-size: 24px; line-height: 1.25;" data-type-role="secondary"><span style="min-width: 0; overflow-wrap: anywhere;">自由归因 Free</span></div><div class="node box small" style="left: 295px; top: 567.5px; width: 225px; height: 150px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">失败归因</span></div><div class="node box small" style="left: 575px; top: 567.5px; width: 225px; height: 150px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">执行协议</span></div><div class="node box small" style="left: 855px; top: 567.5px; width: 225px; height: 150px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">目标检查<br />100题评测</span></div><div class="node box small" style="left: 1135px; top: 567.5px; width: 225px; height: 150px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">保存实验教训</span></div><div class="wire" style="left:520px;top:642px;width:55px;border-top:1.25px solid #424942"></div><div class="tip" style="left:560px;top:637px;border-color:#424942;transform:rotate(45deg)"></div><div class="wire" style="left:800px;top:642px;width:55px;border-top:1.25px solid #424942"></div><div class="tip" style="left:840px;top:637px;border-color:#424942;transform:rotate(45deg)"></div><div class="wire" style="left:1080px;top:642px;width:55px;border-top:1.25px solid #424942"></div><div class="tip" style="left:1120px;top:637px;border-color:#424942;transform:rotate(45deg)"></div><div class="rule" style="left:70px;right:70px;top:725px"></div><div class="node small" style="left: 40px; top: 732.5px; width: 230px; height: 150px; font-size: 24px; line-height: 1.25;" data-type-role="secondary"><span style="min-width: 0; overflow-wrap: anywhere;">策略记忆 Data</span></div><div class="node box small" style="left: 295px; top: 732.5px; width: 225px; height: 150px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">动态 SP</span></div><div class="node box small" style="left: 575px; top: 732.5px; width: 225px; height: 150px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">查重 / 查冲突<br />执行协议</span></div><div class="node box small" style="left: 855px; top: 732.5px; width: 225px; height: 150px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">目标检查<br />100题评测</span></div><div class="node box small accent" style="left: 1135px; top: 732.5px; width: 225px; height: 150px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">更新策略状态</span></div><div class="wire" style="left:520px;top:807px;width:55px;border-top:1.25px solid #424942"></div><div class="tip" style="left:560px;top:802px;border-color:#424942;transform:rotate(45deg)"></div><div class="wire" style="left:800px;top:807px;width:55px;border-top:1.25px solid #424942"></div><div class="tip" style="left:840px;top:802px;border-color:#424942;transform:rotate(45deg)"></div><div class="wire" style="left:1080px;top:807px;width:55px;border-top:1.25px solid #424942"></div><div class="tip" style="left:1120px;top:802px;border-color:#424942;transform:rotate(45deg)"></div></main><style>[data-diagram-style="openai-blog"] {
  --diagram-ink:#202422;
  --diagram-muted:#59635b;
  --diagram-line:#545c55;
  --diagram-border:#656e66;
  --diagram-accent:#688e42;
  --diagram-failure:#997140;
  --diagram-paper:#fff;
  --diagram-soft:#f6f8f3;
  --diagram-warm:#fcf6ed;
  --diagram-grid:none;
  --diagram-vector-stroke:1.1px;
  --diagram-edge-width:1.8px;
  --diagram-box-width:1.5px;
}
[data-diagram-style="engineering"] {
  --diagram-ink:#1d2723;
  --diagram-muted:#4d6055;
  --diagram-line:#303432;
  --diagram-border:#424843;
  --diagram-accent:#537e36;
  --diagram-failure:#936321;
  --diagram-paper:#fff;
  --diagram-soft:#edf3e8;
  --diagram-warm:#fcf1df;
  --diagram-grid:radial-gradient(#dce3d8 .65px,transparent .65px);
  --diagram-vector-stroke:1.35px;
  --diagram-edge-width:2px;
  --diagram-box-width:1.7px;
}
[data-diagram-style] .tm-viewport,[data-diagram-style] .am-viewport {
  background-color:var(--diagram-paper);
  background-image:var(--diagram-grid);
  background-size:20px 20px;
}
[data-diagram-style] .canvas { color:var(--diagram-ink); background-color:var(--diagram-paper); }
[data-diagram-style] .canvas :is(.node,.event,.checkpoint,.restore,.bundle) {
  border-color:var(--diagram-border)!important;
  color:var(--diagram-ink);
}
[data-diagram-kind="flow"] :is(.node,.event,.checkpoint,.restore,.bundle) { border-width:var(--diagram-box-width); }
[data-diagram-style] .canvas :is(.sub,.note,.edge-label,.label:not(.title),.key,.index,.legend) { color:var(--diagram-muted); }
[data-diagram-style] .canvas :is(.node.soft,.node.accent,.node.output,.node.result,.event.repaired) { background-color:var(--diagram-soft)!important; border-color:var(--diagram-accent)!important; }
[data-diagram-style] .canvas :is(.node.failed,.node.issue,.event.failed) { background-color:var(--diagram-warm)!important; border-color:var(--diagram-failure)!important; }
[data-diagram-style] .canvas .edge { border-top-color:var(--diagram-line)!important; border-top-width:var(--diagram-edge-width); }
[data-diagram-style] .canvas .edge.arrow::after { border-left-color:var(--diagram-line)!important; }
[data-diagram-style] .canvas .edge:is(.feedback,.rewind,.retry,.handoff) { border-top-color:var(--diagram-accent)!important; }
[data-diagram-style] .canvas .edge:is(.feedback,.rewind,.retry,.handoff).arrow::after { border-left-color:var(--diagram-accent)!important; }
[data-diagram-style] .canvas .edge:is(.failure,.attempt) { border-top-color:var(--diagram-failure)!important; }
[data-diagram-style] .canvas .edge:is(.failure,.attempt).arrow::after { border-left-color:var(--diagram-failure)!important; }
[data-diagram-style] .canvas .wire { border-color:var(--diagram-line)!important; }
[data-diagram-style] .canvas .tip { border-top-color:var(--diagram-line)!important; border-right-color:var(--diagram-line)!important; }
[data-diagram-style] [data-diagram-stroke="neutral"] { stroke:var(--diagram-line)!important; stroke-width:var(--diagram-vector-stroke)!important; }
[data-diagram-style] [data-diagram-stroke="accent"] { stroke:var(--diagram-accent)!important; stroke-width:var(--diagram-vector-stroke)!important; }
[data-diagram-style] [data-diagram-fill="paper"] { fill:var(--diagram-paper)!important; }
[data-diagram-style="engineering"] [data-diagram-fill="node"] { fill:var(--diagram-paper)!important; }
[data-diagram-style="engineering"] .canvas :is(.node.soft,.node.accent) { background-color:var(--diagram-paper)!important; border-color:var(--diagram-border)!important; }
[data-diagram-style] [data-diagram-text="primary"] { fill:var(--diagram-ink)!important; }
[data-diagram-style] [data-diagram-text="secondary"] { fill:var(--diagram-muted)!important; }
[data-diagram-style] [data-diagram-text="accent"] { fill:var(--diagram-accent)!important; }
[data-diagram-style] .canvas .connection.is-active .edge { border-top-color:var(--diagram-accent)!important; border-top-width:2.6px; }
[data-diagram-style] .canvas .connection.is-active .edge.arrow::after { border-left-color:var(--diagram-accent)!important; }
[data-diagram-style] .canvas.tm-replaying .connection.is-active .edge { border-top-width:0; }
[data-diagram-style] .canvas .connection.is-active [data-diagram-stroke] { stroke:var(--diagram-accent)!important; stroke-width:2px!important; }
[data-diagram-style] .diagram-style-control { max-width:150px; font-weight:400; }
.diagram-style-dialog &gt; .diagram-style-control { position:fixed; top:22px; left:22px; z-index:1; padding:8px 12px; color:#202422; background:#fff; border:1px solid #656e66; border-radius:6px; font:14px Arial,sans-serif; }
[data-diagram-style] .automation-map,.automation-map[data-diagram-style] { --map-border:var(--diagram-border); --map-accent:var(--diagram-accent); --map-soft:var(--diagram-soft); }
[data-diagram-style] .am-edge { stroke:var(--diagram-line); stroke-width:var(--diagram-edge-width); }
[data-diagram-style] marker path { stroke:var(--diagram-line); }
[data-diagram-style] .am-node { border-color:var(--diagram-border); border-width:var(--diagram-box-width); border-radius:8px; box-shadow:none; color:var(--diagram-ink); }
[data-diagram-style] .am-node-note,[data-diagram-style] .am-label { color:var(--diagram-muted); }
[data-diagram-style] .am-label { background:var(--diagram-paper); }
[data-diagram-style="engineering"] .am-node { background:var(--diagram-soft); }
[data-diagram-style] .am-edge.is-active { stroke:var(--diagram-accent); stroke-width:2.6px; }
@media print { [data-diagram-style] .diagram-style-control { display:none; } }
</style></div></foreignObject></svg>
