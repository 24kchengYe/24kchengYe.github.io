<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1130" width="1440" height="1130" lang="ja"><foreignObject width="1440" height="1130"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>
*{box-sizing:border-box}
.diagram-root{margin:0;background:#fff;color:#202321;font-family:ui-monospace,SFMono-Regular,Menlo,"PingFang SC",sans-serif;font-weight:400}
.canvas{position:relative;width:1440px;background:white;overflow:hidden}
.node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;font-size:26px;line-height:1.5;background:#fff;z-index:2;padding:8px 14px}
.node.box{border:1.25px solid #363b36;border-radius:23px;background-image:radial-gradient(#4b504b20 .65px,transparent .7px);background-size:5px 5px}
.node.accent{color:#4d6e2b;border-color:#85a65c;background-color:#fff;background-image:radial-gradient(#83a95738 .65px,transparent .7px);background-size:5px 5px}
.node.small{font-size:22px}
.label{position:absolute;font-size:20px;color:#737972;background:#fff;z-index:3;padding:2px 8px;line-height:1.6}
.wire{position:absolute;z-index:1}
.tip{position:absolute;width:8px;height:8px;border-top:1.25px solid #424942;border-right:1.25px solid #424942;z-index:1}
.rule{position:absolute;height:1px;background:#e0e5e1}
.group{position:absolute;border:1px solid #d4dbd0;border-radius:5px;background-image:radial-gradient(#82917c19 .6px,transparent .65px);background-size:6px 6px}
.group.draft{border-style:dashed;background-image:none}
.group-title{position:absolute;left:22px;top:-16px;background:white;padding:0 10px;font-size:22px;line-height:30px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
.lifeline{position:absolute;border-left:1px solid #cbd3c5}
.chart{padding:38px 70px 48px}.chart h2{font-size:23px;font-weight:400;margin:0 0 30px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:70px}
.chart-row{display:grid;grid-template-columns:185px 1fr 100px;gap:18px;align-items:center;min-height:66px;font-size:22px}
.track{position:relative;height:9px;background:#f0f2f0}.bar{height:9px;background:#aeb5aa}.bar.green{background:#83a957}.val{text-align:right;font-size:21px}
.axis{display:flex;justify-content:space-between;margin-left:203px;margin-right:118px;color:#8b918d;font-size:17px}.small-note{font-size:20px;color:#79827b}
.matrix{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:0;padding:35px 80px}.matrix&gt;div{padding:28px 18px;border-bottom:1px solid #dce3dd;font-size:24px}.matrix .muted{font-size:21px;color:#7c847d}.number{font-size:42px}.green{color:#5d7e3b}
.spark{display:flex;gap:20px;align-items:end;height:160px}.spark&gt;div{width:70px;background:#d9e5dd;position:relative;min-height:1px}.spark span{position:absolute;top:-35px;left:0;right:0;text-align:center;font-size:23px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:40px;padding:65px 80px 20px}.stat-grid .number{margin:12px 0}.stat-grid p{font-size:23px;line-height:1.7;margin:7px 0}.small{font-size:20px}
.plot{padding:45px 70px}.plot-row{display:grid;grid-template-columns:260px 1fr 230px;gap:25px;align-items:center;font-size:24px;margin:42px 0}.plot-track{height:20px;display:flex;position:relative;background:#f0f3f1}.plot-track&gt;div{height:20px;background:#ccd8bd}.plot-track&gt;div:last-child{background:#83a957}
.legend{font-size:20px;color:#79827b;display:flex;gap:40px;margin:30px 0}.legend i{display:inline-block;width:18px;height:10px;background:#ccd8bd;margin-right:10px}.legend i.dark{background:#83a957}
.chips{display:flex;gap:12px;padding:20px 0}.chip{width:16px;height:16px;border:1px solid #bec8c1;border-radius:50%}.chip.green{background:#83a957;border-color:#83a957}.chip.gray{background:#aab8af}.caption{font-size:21px;color:#7b827d;margin-top:26px}
</style><main class="canvas" style="height:1130px"><div class="group " style="left:50px;top:65px;width:1335px;height:400px"><span class="group-title">主系統 · PE自動最適化</span></div><div class="node box small" style="left: 80px; top: 120px; width: 235px; height: 80px; font-size: 22px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">MASP</span></div><div class="node box small" style="left: 340px; top: 120px; width: 235px; height: 80px; font-size: 22px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">MASPCombine</span></div><div class="node box small" style="left: 600px; top: 120px; width: 235px; height: 80px; font-size: 22px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">Guarded-Patch</span></div><div class="node box small" style="left: 860px; top: 120px; width: 235px; height: 80px; font-size: 22px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">Free · 自由分析</span></div><div class="node box small" style="left: 1120px; top: 120px; width: 235px; height: 80px; font-size: 22px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">Data · 戦略記憶</span></div><div class="node box accent" style="left: 80px; top: 285px; width: 235px; height: 75px; font-size: 26px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">PEを編集</span></div><div class="node box" style="left: 425px; top: 285px; width: 260px; height: 75px; font-size: 26px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">生成条件を固定</span></div><div class="node box" style="left: 795px; top: 285px; width: 235px; height: 75px; font-size: 26px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">SpecDoc</span></div><div class="node box" style="left: 1140px; top: 285px; width: 215px; height: 75px; font-size: 19px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">Judgeのフィードバック</span></div><div class="wire" style="left:315px;top:322px;width:110px;border-top:1.25px solid #424942"></div><div class="tip" style="left:410px;top:317px;border-color:#424942;transform:rotate(45deg)"></div><div class="wire" style="left:685px;top:322px;width:110px;border-top:1.25px solid #424942"></div><div class="tip" style="left:780px;top:317px;border-color:#424942;transform:rotate(45deg)"></div><div class="wire" style="left:1030px;top:322px;width:110px;border-top:1.25px solid #424942"></div><div class="tip" style="left:1125px;top:317px;border-color:#424942;transform:rotate(45deg)"></div><div class="wire" style="left:1247px;top:360px;height:60px;border-left:1.25px solid #424942"></div><div class="tip" style="left:1242px;top:405px;border-color:#424942;transform:rotate(135deg)"></div><div class="wire" style="left:197px;top:420px;width:1050px;border-top:1.25px dashed #424942"></div><div class="tip" style="left:202px;top:415px;border-color:#424942;transform:rotate(225deg)"></div><div class="wire" style="left:197px;top:360px;height:60px;border-left:1.25px dashed #424942"></div><div class="tip" style="left:192px;top:365px;border-color:#424942;transform:rotate(315deg)"></div><div class="label" style="left:525px;top:399px">有効な変更を保持し次へ</div><div class="node small accent" style="left: 60px; top: 595px; width: 310px; height: 140px; font-size: 22px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">最終Lite納品<br />一回生成<br />SpecDocを直接出力</span></div><div class="wire" style="left:555px;top:465px;height:115px;border-left:1.25px dashed #424942"></div><div class="tip" style="left:550px;top:565px;border-color:#424942;transform:rotate(135deg)"></div><div class="label" style="left:630px;top:510px">生成方式は別比較</div><div class="group draft" style="left:415px;top:580px;width:970px;height:250px"><span class="group-title">比較系統 · 生成と診断</span></div><div class="node box small" style="left: 440px; top: 625px; width: 215px; height: 75px; font-size: 22px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">Arch</span></div><div class="node box small" style="left: 675px; top: 625px; width: 215px; height: 75px; font-size: 22px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">SelfRefine</span></div><div class="node box small" style="left: 910px; top: 625px; width: 215px; height: 75px; font-size: 22px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">Virtual Gate</span></div><div class="node box small" style="left: 1145px; top: 625px; width: 215px; height: 75px; font-size: 22px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">Selector</span></div><div class="node small" style="left: 440px; top: 725px; width: 215px; height: 65px; font-size: 22px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">領域別生成を追加</span></div><div class="node small" style="left: 675px; top: 725px; width: 215px; height: 65px; font-size: 22px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">同モデル自己修正</span></div><div class="node small" style="left: 910px; top: 725px; width: 215px; height: 65px; font-size: 22px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">固定成果物を検査</span></div><div class="node small" style="left: 1145px; top: 725px; width: 215px; height: 65px; font-size: 22px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">複数候補から選択</span></div><div class="group draft" style="left:50px;top:920px;width:1335px;height:160px"><span class="group-title">方法調査と設計参考</span></div><div class="node small" style="left: 75px; top: 950px; width: 250px; height: 50px; font-size: 21px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">DSPy / MIPRO</span></div><div class="node small" style="left: 330px; top: 950px; width: 250px; height: 50px; font-size: 21px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">GEPA</span></div><div class="node small" style="left: 585px; top: 950px; width: 250px; height: 50px; font-size: 21px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">ProTeGi / APO</span></div><div class="node small" style="left: 840px; top: 950px; width: 250px; height: 50px; font-size: 21px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">EvoPrompt</span></div><div class="node small" style="left: 1095px; top: 950px; width: 250px; height: 50px; font-size: 21px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">TextGrad</span></div><div class="node small" style="left: 75px; top: 1010px; width: 250px; height: 50px; font-size: 21px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">OPRO</span></div><div class="node small" style="left: 330px; top: 1010px; width: 250px; height: 50px; font-size: 21px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">APE</span></div><div class="node small" style="left: 585px; top: 1010px; width: 250px; height: 50px; font-size: 21px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">Promptbreeder</span></div><div class="node small" style="left: 840px; top: 1010px; width: 250px; height: 50px; font-size: 21px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">PromptWizard</span></div><div class="node small" style="left: 1095px; top: 1010px; width: 250px; height: 50px; font-size: 21px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">AutoPrompt</span></div></main></div></foreignObject></svg>
