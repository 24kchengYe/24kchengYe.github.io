            points:
              - 提出用于视觉 RAG 的后置概念瓶颈对齐方法，通过 Observer–Debater–Judge 多智能体链，从冻结 VLM 提取可解释概念分数，再在视觉—语义混合流形上以局部加权岭回归校准至人类评分。
              - 城市场景感知准确率达到 <strong>72.2%（κ = 0.45）</strong>，较有监督基线提升 <strong>15.1 pp</strong>，较未校准 VLM 提升 <strong>16.3 pp</strong>。
            link:
              label: UrbanAlign
              url: https://doi.org/10.1007/978-3-032-37132-4_18
          - id: urban-data
            title: 多模态城市数据挖掘
            date: 2021.09 – 2025.10
            role: GloPPRUA · GloGCI · CMAB
            points:
              - 提出多时相视觉解译与空间匹配方法。分辨率分布匹配增强的 HRNet-W48 + U-Net 将强模糊 Dice 从 <strong>0.684 提升至 0.756</strong>；RGB–Mask GAN 将建筑轮廓直角率从 <strong>0.398 提升至 0.624</strong>，并结合 1 m DP 矢量化、形态路由、偏移校准和上下文匹配。
              - 在 <strong>1,000 个城市</strong>构建约 <strong>1,478 万个双期建筑观测实例</strong>。CMAB 与 GloGCI 均入选 ESI 高被引论文，数据与代码累计 <strong>79,500 次下载</strong>。
            text: '<a href="https://doi.org/10.1038/s41597-025-04730-5">CMAB · Scientific Data, 2025</a><br><a href="https://doi.org/10.1016/j.habitatint.2025.103350">GloGCI / 全球鬼城识别 · Habitat International, 2025</a><br><a href="https://doi.org/10.1016/j.jag.2022.102942">城市空间风险预测 · JAG, 2022</a><br><a href="https://doi.org/10.1007/s12273-026-1461-9">建筑尺度城市分析与模拟 · Building Simulation, 2026</a>'
          - id: ai4us
            title: 大模型科学数据合成与受控实验
            date: 2024.09 – 至今
            role: 第一／通讯作者 · arXiv
            points:
              - 提出 AI4US 多模态评测框架，围绕数据合成与条件干预，在城市标度、距离衰减、街区活力和街景感知四类任务中，评估关系复现、实证参数与分布一致性，以及受控条件响应。
              - 发现 GenAI 可以复现可识别的城市规律和方向响应，但会压缩数值覆盖、局部波动与视觉多样性；在 <strong>Qwen2.5-VL-72B</strong> 上进行 Profile–Probe–Intervene 分析，验证部分规律可从中间表征解码并影响局部输出。
            text: '<a href="https://arxiv.org/abs/2505.13803">GenAI Models Capture Urban Science but Oversimplify Complexity</a> · arXiv, 2025。<br>Large Language Models Perceive Cities through a Culturally Uneven Baseline · arXiv, 2026（通讯作者）。'
