<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1077" width="1440" height="1077" lang="ja"><foreignObject width="1440" height="1077"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>
.diagram-root{margin:0;background:#fff;color:#303b36;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}
.canvas{position:relative;width:1440px;height:1077px;background:#fff;box-sizing:border-box}
.node{position:absolute;box-sizing:border-box;padding:18px 24px;border:1.5px solid #bfcac1;border-radius:8px;background:#fff;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center;z-index:2}
.node strong{font-size:27px;line-height:1.23;font-weight:500;overflow-wrap:anywhere}
.node span{font-size:23px;line-height:1.35;color:#626e66;white-space:pre-line;overflow-wrap:anywhere}
.node.soft{background:#f3f6f1}.node.issue{background:#faf4ef;border-color:#d7c6b8}.node.result{background:#eff5ed;border-color:#9eaf96}
.edge{position:absolute;height:0;border-top:1.5px solid #9caa98;transform-origin:0 0;z-index:1}.edge.feedback{border-top-style:dashed}
.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #9caa98;border-top:4px solid transparent;border-bottom:4px solid transparent}
.label{position:absolute;font-size:21px;line-height:1.3;color:#687366;background:#fff;z-index:3;white-space:pre-line;box-sizing:border-box;padding:3px 6px}
.label.title{font-size:31px;font-weight:500;color:#303b36}.label.lane{font-size:24px;color:#405142}
</style><div class="canvas" data-fixed-type="true" data-research-diagram="rubric-model-full-workflow"><div class="edge arrow" data-from="input" data-to="labels" style="left:420px;top:160px;width:120px;transform:rotate(0deg)"></div><div class="edge arrow" data-from="labels" data-to="split" style="left:900px;top:150px;width:120px;transform:rotate(0deg)"></div><div class="edge" data-from="split" data-to="sft" style="left:1200px;top:261px;width:59px;transform:rotate(90deg)"></div><div class="edge" data-from="split" data-to="sft" style="left:1200px;top:320px;width:960px;transform:rotate(180deg)"></div><div class="edge arrow" data-from="split" data-to="sft" style="left:240px;top:320px;width:48px;transform:rotate(90deg)"></div><div class="edge" data-from="split" data-to="opd" style="left:1200px;top:261px;width:59px;transform:rotate(90deg)"></div><div class="edge" data-from="split" data-to="opd" style="left:1200px;top:320px;width:480px;transform:rotate(180deg)"></div><div class="edge arrow" data-from="split" data-to="opd" style="left:720px;top:320px;width:48px;transform:rotate(90deg)"></div><div class="edge arrow" data-from="split" data-to="cot" style="left:1200px;top:261px;width:107px;transform:rotate(90deg)"></div><div class="edge arrow" data-from="sft" data-to="rl" style="left:240px;top:533px;width:75px;transform:rotate(90deg)"></div><div class="edge" data-from="sft" data-to="eval" style="left:420px;top:472px;width:50px;transform:rotate(0deg)"></div><div class="edge" data-from="sft" data-to="eval" style="left:470px;top:472px;width:408px;transform:rotate(90deg)"></div><div class="edge arrow" data-from="sft" data-to="eval" style="left:470px;top:880px;width:70px;transform:rotate(0deg)"></div><div class="edge" data-from="rl" data-to="eval" style="left:240px;top:773px;width:164px;transform:rotate(90deg)"></div><div class="edge arrow" data-from="rl" data-to="eval" style="left:240px;top:937px;width:300px;transform:rotate(0deg)"></div><div class="edge arrow" data-from="opd" data-to="eval" style="left:720px;top:533px;width:299px;transform:rotate(90deg)"></div><div class="edge arrow" data-from="cot" data-to="eval" style="left:1200px;top:533px;width:299px;transform:rotate(90deg)"></div><div class="edge feedback" data-from="split" data-to="eval" style="left:1380px;top:150px;width:30px;transform:rotate(0deg)"></div><div class="edge feedback" data-from="split" data-to="eval" style="left:1410px;top:150px;width:755px;transform:rotate(90deg)"></div><div class="edge arrow feedback" data-from="split" data-to="eval" style="left:1410px;top:905px;width:30px;transform:rotate(180deg)"></div><div class="node " id="input" style="left:60px;top:96px;width:360px;height:165px"><strong>評価単位</strong><span>Query + Spec の版 + Domain</span><span data-node-detail="true" hidden="">評価単位を揃える
元 Query + 正確な Spec バージョン
Domain + Rubric の版</span></div><div class="node " id="labels" style="left:540px;top:96px;width:360px;height:165px"><strong>参照ラベル</strong><span>生成 → 確認 → 固定</span><span data-node-detail="true" hidden="">ラベルの生成・再確認
モデル注釈 → 確認・固定
問題・ルール・判定を保存</span></div><div class="node " id="split" style="left:1020px;top:96px;width:360px;height:165px"><strong>Query で分割</strong><span>Train / Dev / Test をグループで分離</span><span data-node-detail="true" hidden="">Query 単位でグループ分割
同じ要求の版・領域は同一集合へ
訓練・検証・テスト一覧を固定</span></div><div class="node soft" id="sft" style="left:60px;top:368px;width:360px;height:165px"><strong>SFT</strong><span>ルール + Query + Spec → 判定</span><span data-node-detail="true" hidden="">SFT：判定を学習
入力：ルール + Query + Spec
目標：構造化評価 JSON</span></div><div class="node soft" id="opd" style="left:540px;top:368px;width:360px;height:165px"><strong>OPD</strong><span>学生が生成・教師が確率分布を提供</span><span data-node-detail="true" hidden="">OPD：教師の確率分布
学生がサンプル生成、教師が分布を提供
条件ごとに特権コンテキストを分離</span></div><div class="node soft" id="cot" style="left:1020px;top:368px;width:360px;height:165px"><strong>理由監督 A / B / C</strong><span>本文 / 推論フィールド / 判定のみ</span><span data-node-detail="true" hidden="">理由監督：3種類の対照
A：本文の理由、B：推論フィールド
C：同じラベルで判定のみ</span></div><div class="node soft" id="rl" style="left:60px;top:608px;width:360px;height:165px"><strong>RL</strong><span>SFT 初期化・グループ内生成と報酬</span><span data-node-detail="true" hidden="">RL：SFT から継続学習
グループ内生成 → ラベルで報酬計算
ラベルは採点側だけで使用</span></div><div class="node result" id="eval" style="left:540px;top:832px;width:840px;height:145px"><strong>固定テストで評価</strong><span>妥当率・完全一致・F1・コスト</span><span data-node-detail="true" hidden="">テスト入力を固定し、参照ラベル別に報告
出力妥当率・完全一致・Category–Rubric–Mode F1・コスト
Sol と DeepSeek を別表にし、Test792 と他の集合も分ける</span></div><div class="label title" style="left:54px;top:24px;width:1320px">ルール評価モデル · 全体フロー</div><div class="label " style="left:54px;top:282px;width:900px">学習分岐には Train のみ</div></div></div></foreignObject></svg>
