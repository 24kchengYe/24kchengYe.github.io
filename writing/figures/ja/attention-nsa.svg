<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 880" width="1440" height="880" lang="ja"><foreignObject width="1440" height="880"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>*{box-sizing:border-box}.diagram-root{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1440px;overflow:hidden;background:#fff}.node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;border:1.5px solid #a4afa5;background:#fff;border-radius:4px;padding:10px 16px;font-size:24px;line-height:1.4;z-index:2}.node.soft{background:#eff4ec;border-color:#9eaf94}.math{font-size:.86em;color:#56645b}.title{position:absolute;left:40px;top:28px;font-size:29px;font-weight:500}.legend{position:absolute;top:36px;font-size:18px;color:#6a766d}.legend:before{content:"";display:inline-block;width:30px;border-top:1.5px solid #91a08f;vertical-align:middle;margin-right:12px}.legend.control:before{border-top-style:dashed}.edge{position:absolute;height:0;border-top:1.5px solid #91a08f;transform-origin:0 0;z-index:1}.edge.control{border-top-style:dashed}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #91a08f;border-top:4px solid transparent;border-bottom:4px solid transparent}.note{position:absolute;left:40px;width:1360px;font-size:20px;line-height:1.5;color:#68766c;border-top:1px solid #e0e6dc;padding-top:20px}.annotation{position:absolute;font-size:22px;color:#68766c}
.diagram-root{font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.label,.legend,.note,.annotation,.small-note,.caption,.axis{font-size:22px}.title,.label.title{font-size:30px}.group-title,.chart h2{font-size:26px}.chart-row,.plot-row,.matrix&gt;div,.stat-grid p,.val{font-size:26px}.matrix .muted,.math,.legend,.small{font-size:24px}</style><main class="canvas" style="height:880px">
<div class="title">NSA</div><div class="legend" style="left:760px">実線：テンソル</div><div class="legend control" style="left:1070px">破線：選択・ゲート</div>
<div class="edge arrow" data-from="compressed" data-to="cmp-att" style="left:300px;top:185px;width:100px;transform:rotate(0deg)"></div>
<div class="edge control arrow" data-from="cmp-att" data-to="route" style="left: 545px; top: 260px; width: 20px; transform: rotate(90deg);"></div>
<div class="edge control arrow" data-from="route" data-to="gather" style="left: 545px; top: 400px; width: 40px; transform: rotate(90deg);"></div>
<div class="edge arrow" data-from="raw" data-to="gather" style="left:300px;top:500px;width:100px;transform:rotate(0deg)"></div>
<div class="edge arrow" data-from="gather" data-to="sel-att" style="left:690px;top:500px;width:80px;transform:rotate(0deg)"></div>
<div class="edge arrow" data-from="window" data-to="win-att" style="left:300px;top:700px;width:470px;transform:rotate(0deg)"></div>
<div class="edge" data-from="cmp-att" data-to="sum" style="left:690px;top:170px;width:370px;transform:rotate(0deg)"></div>
<div class="edge" data-from="cmp-att" data-to="sum" style="left:1060px;top:170px;width:305px;transform:rotate(90deg)"></div>
<div class="edge arrow" data-from="cmp-att" data-to="sum" style="left:1060px;top:475px;width:40px;transform:rotate(0deg)"></div>
<div class="edge arrow" data-from="sel-att" data-to="sum" style="left:1030px;top:500px;width:70px;transform:rotate(0deg)"></div>
<div class="edge" data-from="win-att" data-to="sum" style="left:1030px;top:700px;width:220px;transform:rotate(0deg)"></div>
<div class="edge arrow" data-from="win-att" data-to="sum" style="left:1250px;top:700px;width:140px;transform:rotate(-90deg)"></div>
<div class="edge control arrow" data-from="gates" data-to="sum" style="left:1250px;top:220px;width:230px;transform:rotate(90deg)"></div>
<div class="node soft" id="compressed" style="left: 40px; top: 130px; width: 260px; height: 110px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">圧縮分岐の KV 投影<br /><span class="math">X → Kᶜ, Vᶜ</span></span></div>
<div class="node " id="cmp-att" style="left: 400px; top: 110px; width: 290px; height: 150px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">圧縮注意力<br /><span class="math">Attention(Q, Kᶜ, Vᶜ)<br />Pᶜ  /  oᶜ</span></span></div>
<div class="node " id="route" style="left: 400px; top: 280px; width: 420px; height: 120px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">ブロックスコアへ対応付け → グループ内でヘッドを合計<br /><span class="math">Pᶜ → Pᵇˡᵒᶜᵏ → Top-n</span></span></div>
<div class="node soft" id="raw" style="left: 40px; top: 440px; width: 260px; height: 120px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">選択分岐の KV 投影<br /><span class="math">X → Kˢ, Vˢ</span></span></div>
<div class="node soft" id="gather" style="left: 400px; top: 440px; width: 290px; height: 120px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">選択した非圧縮ブロックを取得<br /><span class="math">KVˢ[selected]</span></span></div>
<div class="node " id="sel-att" style="left: 770px; top: 440px; width: 260px; height: 120px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">選択注意力<br /><span class="math">Attention(Q, KVˢ)<br />→ oˢ</span></span></div>
<div class="node soft" id="window" style="left: 40px; top: 640px; width: 260px; height: 120px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">窓分岐の KV 投影<br /><span class="math">X → Kʷ, Vʷ</span></span></div>
<div class="node " id="win-att" style="left: 770px; top: 630px; width: 260px; height: 120px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">窓注意力<br /><span class="math">Attention(Q, KVʷ)<br />→ oʷ</span></span></div>
<div class="node " id="gates" style="left: 1100px; top: 110px; width: 300px; height: 110px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">現在の隠れ状態からゲート<br /><span class="math">xₜ → gᶜ, gˢ, gʷ</span></span></div>
<div class="node soft" id="sum" style="left: 1100px; top: 450px; width: 300px; height: 110px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">3 分岐の出力をゲート付き加算<br /><span class="math">o = gᶜoᶜ + gˢoˢ + gʷoʷ</span></span></div>
<div class="annotation" style="left:40px;top:80px">Q = WQ xₜ</div>
<div class="note" style="top:785px">3 分岐で Q を共有し、KV は独立投影。選択では同一 GQA グループ内の query heads を集約。</div>
</main></div></foreignObject></svg>
