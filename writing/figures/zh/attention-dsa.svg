<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" width="1440" height="640" lang="zh"><foreignObject width="1440" height="640"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>*{box-sizing:border-box}.diagram-root{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1440px;overflow:hidden;background:#fff}.node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;border:1.5px solid #a4afa5;background:#fff;border-radius:4px;padding:10px 16px;font-size:24px;line-height:1.4;z-index:2}.node.soft{background:#eff4ec;border-color:#9eaf94}.math{font-size:.86em;color:#56645b}.title{position:absolute;left:40px;top:28px;font-size:29px;font-weight:500}.legend{position:absolute;top:36px;font-size:18px;color:#6a766d}.legend:before{content:"";display:inline-block;width:30px;border-top:1.5px solid #91a08f;vertical-align:middle;margin-right:12px}.legend.control:before{border-top-style:dashed}.edge{position:absolute;height:0;border-top:1.5px solid #91a08f;transform-origin:0 0;z-index:1}.edge.control{border-top-style:dashed}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #91a08f;border-top:4px solid transparent;border-bottom:4px solid transparent}.note{position:absolute;left:40px;width:1360px;font-size:20px;line-height:1.5;color:#68766c;border-top:1px solid #e0e6dc;padding-top:20px}.annotation{position:absolute;font-size:22px;color:#68766c}</style><main class="canvas" style="height:640px">
<div class="title">DSA</div><div class="legend" style="left:760px">实线：张量流</div><div class="legend control" style="left:1070px">虚线：选择 / 门控</div>
<div class="edge" data-from="history" data-to="cache" style="left:260px;top:240px;width:40px;transform:rotate(0deg)"></div>
<div class="edge" data-from="history" data-to="cache" style="left:300px;top:240px;width:85px;transform:rotate(-90deg)"></div>
<div class="edge arrow" data-from="history" data-to="cache" style="left:300px;top:155px;width:60px;transform:rotate(0deg)"></div>
<div class="edge" data-from="history" data-to="index-key" style="left:150px;top:310px;width:85px;transform:rotate(90deg)"></div>
<div class="edge arrow" data-from="history" data-to="index-key" style="left:150px;top:395px;width:210px;transform:rotate(0deg)"></div>
<div class="edge arrow" data-from="cache" data-to="gather" style="left:650px;top:155px;width:90px;transform:rotate(0deg)"></div>
<div class="edge arrow" data-from="index-key" data-to="indexer" style="left:650px;top:395px;width:90px;transform:rotate(0deg)"></div>
<div class="edge control arrow" data-from="indexer" data-to="gather" style="left:880px;top:340px;width:130px;transform:rotate(-90deg)"></div>
<div class="edge arrow" data-from="query" data-to="indexer" style="left:1100px;top:395px;width:80px;transform:rotate(180deg)"></div>
<div class="edge arrow" data-from="query" data-to="attention" style="left:1250px;top:340px;width:130px;transform:rotate(-90deg)"></div>
<div class="edge arrow" data-from="gather" data-to="attention" style="left:1020px;top:155px;width:80px;transform:rotate(0deg)"></div>
<div class="node " id="history" style="left:40px;top:210px;width:220px;height:100px;font-size:24px"><span style="min-width: 0; overflow-wrap: anywhere;">历史隐状态<br /><span class="math">X</span></span></div>
<div class="node soft" id="cache" style="left:360px;top:100px;width:290px;height:110px;font-size:24px"><span style="min-width: 0; overflow-wrap: anywhere;">MLA 潜向量缓存<br /><span class="math">X → cᴷⱽ, kᴿ</span></span></div>
<div class="node " id="index-key" style="left:360px;top:340px;width:290px;height:110px;font-size:24px"><span style="min-width: 0; overflow-wrap: anywhere;">独立索引键<br /><span class="math">X → Kᴵ</span></span></div>
<div class="node soft" id="gather" style="left:740px;top:100px;width:280px;height:110px;font-size:24px"><span style="min-width: 0; overflow-wrap: anywhere;">读取选中 token 的 KV<br /><span class="math">KV[selected]</span></span></div>
<div class="node " id="indexer" style="left:740px;top:340px;width:280px;height:110px;font-size:24px"><span style="min-width: 0; overflow-wrap: anywhere;">Lightning Indexer<br /><span class="math">score(Qᴵ, Kᴵ) → Top-k</span></span></div>
<div class="node " id="query" style="left:1100px;top:340px;width:300px;height:110px;font-size:24px"><span style="min-width: 0; overflow-wrap: anywhere;">当前隐状态投影<br /><span class="math">xₜ → Q, Qᴵ</span></span></div>
<div class="node soft" id="attention" style="left:1100px;top:100px;width:300px;height:110px;font-size:24px"><span style="min-width: 0; overflow-wrap: anywhere;">Sparse MLA<br /><span class="math">Attention(Q, KV[selected])<br />→ oₜ</span></span></div>

<div class="note" style="top:545px">索引查询 Qᴵ 用于选择；主查询 Q 读取缓存。未选中不等于删除缓存。</div>
</main></div></foreignObject></svg>
