<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>规划、执行与修复如何衔接</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1200px;background:#fff;overflow:hidden}.heading{position:absolute;left:50px;top:22px;font-size:30px;line-height:1.3}.node{position:absolute;display:flex;align-items:center;justify-content:center;padding:14px 18px;text-align:center;border:1px solid #a6b1a1;border-radius:5px;background:#fff;font-size:28px;line-height:1.28;z-index:2}.node.soft{background:#f1f5ec}.node.plan{border-style:dashed}.sub{display:block;margin-top:8px;font-size:24px;line-height:1.3;color:#687568}.label{position:absolute;font-size:22px;line-height:1.35;color:#687568;background:#fff;padding:3px 8px;text-align:center;z-index:3}.region{position:absolute;border:1px solid #d1d8cc;border-radius:8px}.region-title{position:absolute;top:-21px;left:22px;padding:0 12px;background:#fff;font-size:28px;line-height:1.4}.edge{position:absolute;height:0;border-top:1.4px solid #8b9b83;transform-origin:0 0;z-index:1}.edge.dashed{border-top-style:dashed}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #8b9b83;border-top:4px solid transparent;border-bottom:4px solid transparent}.note{position:absolute;font-size:22px;line-height:1.45;color:#687568}.field{font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif;font-size:24px;line-height:1.65}.panel{position:absolute;border:1px solid #c6d0bf;border-radius:6px;padding:22px 26px;background:#fff}.panel h2{font-size:28px;font-weight:400;line-height:1.35;margin:0 0 18px}.panel .rule{border-top:1px solid #d9dfd3;margin:18px 0}.muted{color:#687568}</style></head><body><main class="canvas" data-fixed-type style="height:820px"><div class="heading">规划、执行与修复如何衔接</div>
<div id="plan" class="node plan" style="left:60px;top:100px;width:500px;height:135px">Spec → TodoList<br><span class="sub">业务约束 → 任务、依赖与状态</span></div>
<div class="note" style="left:660px;top:113px;width:480px">计划约束动作，真实回执更新计划。</div>
<div id="harness" class="node " style="left:60px;top:310px;width:240px;height:120px">Harness<br><span class="sub">执行并记录</span></div>
<div id="online" class="node soft" style="left:410px;top:310px;width:310px;height:120px">Online<br><span class="sub">评审 · 有界重生成</span></div>
<div id="offline" class="node " style="left:840px;top:310px;width:300px;height:120px">Offline<br><span class="sub">局部编辑 · 核验</span></div>
<div id="pending" class="node " style="left:500px;top:625px;width:220px;height:85px">Pending</div>
<div id="training" class="node soft" style="left:840px;top:605px;width:300px;height:125px">训练数据<br><span class="sub">真实性与格式检查</span></div>
<div class="connection" data-from="plan" data-to="harness"><div class="edge dashed arrow" style="left:100px;top:235px;width:75px;transform:rotate(90deg)"></div></div>
<div class="connection" data-from="harness" data-to="online"><div class="edge arrow" style="left:300px;top:370px;width:110px;transform:rotate(0deg)"></div></div>
<div class="connection" data-from="online" data-to="offline"><div class="edge arrow" style="left:720px;top:370px;width:120px;transform:rotate(0deg)"></div></div>
<div class="connection" data-from="online" data-to="harness"><div class="edge dashed" style="left:470px;top:430px;width:95px;transform:rotate(90deg)"></div><div class="edge dashed" style="left:470px;top:525px;width:290px;transform:rotate(180deg)"></div><div class="edge dashed arrow" style="left:180px;top:525px;width:95px;transform:rotate(-90deg)"></div></div>
<div class="connection" data-from="online" data-to="pending"><div class="edge arrow" style="left:520px;top:430px;width:195px;transform:rotate(90deg)"></div></div>
<div class="connection" data-from="offline" data-to="pending"><div class="edge" style="left:900px;top:430px;width:130px;transform:rotate(90deg)"></div><div class="edge" style="left:900px;top:560px;width:230px;transform:rotate(180deg)"></div><div class="edge arrow" style="left:670px;top:560px;width:65px;transform:rotate(90deg)"></div></div>
<div class="connection" data-from="offline" data-to="training"><div class="edge arrow" style="left:1080px;top:430px;width:175px;transform:rotate(90deg)"></div></div>
<div class="label" style="left:120px;top:255px;width:185px">计划进入上下文</div>
<div class="label" style="left:302px;top:316px;width:106px">轨迹</div>
<div class="label" style="left:730px;top:243px;width:140px">无需重生成</div>
<div class="label" style="left:65px;top:540px;width:420px">恢复上下文与环境，再生成</div>
<div class="label" style="left:535px;top:465px;width:190px">受阻 / 预算耗尽</div>
<div class="label" style="left:735px;top:484px;width:300px">不可核验 / 仍需重生成</div>
<div class="label" style="left:945px;top:530px;width:185px">核验通过</div>
<div class="note" style="left:60px;top:760px;width:1080px">Online → Offline 单向交接；Pending 保留问题与证据。</div>
<div class="connection" data-from="harness" data-to="plan"><div class="edge dashed" style="left:270px;top:310px;width:40px;transform:rotate(-90deg)"></div><div class="edge dashed" style="left:270px;top:270px;width:250px;transform:rotate(0deg)"></div><div class="edge dashed arrow" style="left:520px;top:270px;width:35px;transform:rotate(-90deg)"></div></div>
<div class="connection" data-from="online" data-to="plan"><div class="edge dashed" style="left:600px;top:310px;width:145px;transform:rotate(-90deg)"></div><div class="edge dashed arrow" style="left:600px;top:165px;width:40px;transform:rotate(180deg)"></div></div>
<div class="label" style="left:305px;top:243px;width:255px">真实返回 · 更新状态</div>
<div class="label" style="left:650px;top:210px;width:360px">问题归因 · 修订计划</div>
</main></body></html>
