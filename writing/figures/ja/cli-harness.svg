<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 500" width="1760" height="500" lang="ja"><foreignObject width="1760" height="500"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>*{box-sizing:border-box}.diagram-root{margin:0;background:white;color:#303a31;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;overflow:hidden;background:white}.region{position:absolute;border:1px solid #dce2d5;border-radius:5px;background:radial-gradient(#d7dfd3 .65px,transparent .8px);background-size:6px 6px}.title{position:absolute;left:40px;top:18px;font-size:25px;font-weight:500}.node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 16px;border:1.2px solid #a4ae9d;border-radius:8px;background:#fff;font-size:20px;line-height:1.35;z-index:2}.node.source{border-radius:24px;background:#fafbf7}.node.gate{border-radius:0;border-color:#89947f}.node.pending{border-radius:24px;background:#f5f6f3;color:#737c6c}.node.output{background:#edf3e3;border-color:#8da668;border-radius:24px}.sub{font-size:.78em;color:#758269}.edge{position:absolute;height:0;border-top:1.3px solid #a0ac93;transform-origin:0 0;z-index:1}.edge.feedback,.edge.context{border-top-style:dashed}.edge.handoff{border-color:#86a45b;border-top-width:1.8px}.edge.failure{border-color:#c0c6b9}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-4px;border-left:6px solid #a0ac93;border-top:3px solid transparent;border-bottom:3px solid transparent}.edge.handoff.arrow:after{border-left-color:#86a45b}.edge.failure.arrow:after{border-left-color:#c0c6b9}.edge-label{position:absolute;transform:translate(-50%,-50%);font-size:15px;color:#758269;line-height:1.2;background:#fff;padding:2px 4px;white-space:nowrap;z-index:3}.bundle{position:absolute;border:1px solid #b7c5a9;background:#fcfdf9;padding:30px;border-radius:6px;font-size:22px}.bundle h3{margin:0 0 28px;font-size:25px;font-weight:500}.turns{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;color:#64765a}.turns b{padding:7px 18px;border:1px solid #c5d1b5;background:#f5f8ee;border-radius:4px;font-weight:400;font-style:italic}.bundle p{margin:22px 0;display:flex;justify-content:space-between;gap:20px}.bundle hr{border:0;border-top:1px solid #e0e6d6}.environment{position:absolute;display:flex;align-items:center;justify-content:space-evenly;border:1px solid #ced8c3;border-radius:10px;background:#fafcf6;font-size:22px}.dependencies{position:absolute;background:white;border:1px solid #b5c1a6;border-radius:10px;padding:20px;text-align:center;font-size:20px;z-index:2}.dependencies header{margin-bottom:20px}.dependency-row{display:grid;grid-template-columns:repeat(4,1fr);font-size:17px}.dependency-row span+span{border-left:1px solid #dae2d1}.query-note{position:absolute;font-size:19px;line-height:1.6;color:#758269}</style><main class="canvas" style="width:1760px;height:500px"><div class="region" style="left:375px;top:80px;width:750px;height:395px"></div><div class="title">a · 長期軌跡の合成</div><div class="connection" data-from="AQ" data-to="AM"><div class="edge normal arrow" style="left:280px;top:255px;width:170px;transform:rotate(0deg)"></div></div><div class="connection" data-from="AC" data-to="AM"><div class="edge context arrow" style="left:545px;top:179px;width:40px;transform:rotate(90deg)"></div></div><div class="connection" data-from="AM" data-to="AT"><div class="edge normal arrow" style="left:640px;top:240px;width:160px;transform:rotate(0deg)"></div></div><div class="edge-label" style="left:718px;top:219px">呼び出し</div><div class="connection" data-from="AT" data-to="AM"><div class="edge feedback arrow" style="left:800px;top:270px;width:160px;transform:rotate(180deg)"></div></div><div class="edge-label" style="left:720px;top:294px">返り値を文脈へ</div><div class="connection" data-from="AT" data-to="AE"><div class="edge normal arrow" style="left:905px;top:291px;width:83px;transform:rotate(90deg)"></div></div><div class="edge-label" style="left:864px;top:335px">実行</div><div class="connection" data-from="AE" data-to="AT"><div class="edge feedback arrow" style="left:945px;top:374px;width:83px;transform:rotate(-90deg)"></div></div><div class="connection" data-from="AT" data-to="AO"><div class="edge handoff arrow" style="left:1050px;top:255px;width:120px;transform:rotate(0deg)"></div></div><div class="edge-label" style="left:1110px;top:234px">記録</div><div class="query-note" style="left:60px;top:330px">テーブル · ビュー · ダッシュボード<br />ワークフロー · 権限</div><div style="position:absolute;left:395px;top:65px;padding:0 12px;background:white;font-size:24px;color:#53624b">Harness</div><div class="node source" id="AQ" style="left: 60px; top: 212px; width: 220px; height: 86px; font-size: 20px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">元のQuery</span></div>
<div class="node process" id="AC" style="left: 420px; top: 121px; width: 650px; height: 58px; font-size: 20px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">システム指示 · Reminder · ツール定義</span></div>
<div class="node process" id="AM" style="left: 450px; top: 219px; width: 190px; height: 72px; font-size: 18px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">Seed<br /><span class="sub">推論 · 判断</span></span></div>
<div class="node process" id="AT" style="left: 800px; top: 219px; width: 250px; height: 72px; font-size: 15px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">ツール実行<br /><span class="sub">ファイル · コマンド · 納品</span></span></div>
<div class="environment" id="AE" style="left:420px;top:374px;width:650px;height:72px"><span>Skills · 作業領域</span><span>lark-cli → Base</span></div>
<div class="bundle" id="AO" style="left:1170px;top:95px;width:540px;height:340px"><h3>軌跡パッケージ</h3><div class="turns"><b>t₁</b><b>t₂</b><span>…</span><b>tᵢ</b><span>…</span><b>t<sub>T</sub></b></div><p><span>推論 / 本文</span><span>呼び出し → 返り値</span></p><hr /><p><span>実行記録</span><span>結果 · 使用量 · 版</span></p><p><span>成果物の参照</span><span>Base · ファイル</span></p></div></main></div></foreignObject></svg>
