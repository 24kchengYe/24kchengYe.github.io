<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1290" width="1440" height="1290" lang="zh"><foreignObject width="1440" height="1290"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>
*{box-sizing:border-box}.diagram-root{margin:0;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif;color:#303c38;background:#fff}.canvas{position:relative;width:1440px;height:1290px;background:white;overflow:hidden}.region{position:absolute;border:1px solid #c7d2c3;border-radius:5px}.region.soft{background:radial-gradient(#92a38526 .7px,transparent .8px);background-size:6px 6px}.region-title{position:absolute;top:-20px;left:22px;padding:0 12px;background:white;font-size:28px;line-height:38px}.node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px 18px;border:1.3px solid #9aaa96;border-radius:4px;background:white;font-size:28px;line-height:1.3;z-index:2}.node.soft{background:#eff4e9}.sub{display:block;margin-top:6px;font-size:23px;color:#677462;line-height:1.3}.label{position:absolute;z-index:3;background:white;padding:3px 8px;font-size:22px;line-height:1.3;color:#68766b;text-align:center}.heading{position:absolute;font-size:30px;left:42px}.small-note{position:absolute;font-size:23px;color:#68766b;line-height:1.5}.edges{position:absolute;inset:0;z-index:1}.edges path{fill:none;stroke:#8a9983;stroke-width:1.5;marker-end:url(#rollout-arrow)}.edges .feedback{stroke:#749452;stroke-dasharray:6 5}.edges .record{stroke:#a4ada0;stroke-dasharray:3 5}
</style><main class="canvas" data-fixed-type="">
<div class="heading" style="top:22px">一次 Rollout：模型、Harness 与工具环境</div>
<div class="node" id="query" style="left:80px;top:95px;width:280px;height:82px"><span style="min-width: 0; overflow-wrap: anywhere;">原始 Query</span></div>
<div class="node" id="instructions" style="left:490px;top:95px;width:400px;height:82px"><span style="min-width: 0; overflow-wrap: anywhere;">系统指令 + Reminder</span></div>
<div class="node" id="schema" style="left:1030px;top:95px;width:340px;height:82px"><span style="min-width: 0; overflow-wrap: anywhere;">工具定义</span></div>
<div class="region soft" style="left:40px;top:245px;width:900px;height:570px"><div class="region-title">Harness · 上下文、调度与记录</div></div>
<div class="region" style="left:990px;top:245px;width:410px;height:570px"><div class="region-title">工具执行环境</div></div>
<div class="node" id="context" style="left:80px;top:295px;width:280px;height:110px"><span style="min-width: 0; overflow-wrap: anywhere;">当前消息上下文<span></span></span></div>
<div class="node soft" id="model" style="left:550px;top:295px;width:340px;height:110px"><span style="min-width: 0; overflow-wrap: anywhere;">Seed 模型响应<br /><span class="sub">思考 · 正文 · 工具调用</span></span></div>
<div class="node" id="dispatch" style="left:550px;top:475px;width:340px;height:100px"><span style="min-width: 0; overflow-wrap: anywhere;">响应分派</span></div>
<div class="node" id="terminal" style="left:80px;top:465px;width:280px;height:150px"><span style="min-width: 0; overflow-wrap: anywhere;">结束检查与终态<br /><span class="sub">完成 / 失败 / 预算终止</span></span></div>
<div class="node soft" id="tools" style="left:1030px;top:455px;width:340px;height:140px"><span style="min-width: 0; overflow-wrap: anywhere;">真实工具执行<br /><span class="sub">Read · Write · Edit<br />Bash · present_files</span></span></div>
<div class="node" id="observation" style="left:550px;top:665px;width:340px;height:120px"><span style="min-width: 0; overflow-wrap: anywhere;">追加真实观察<br /><span class="sub">tool_call_id 对齐调用</span></span></div>
<div class="node" id="resources" style="left:1030px;top:665px;width:340px;height:120px"><span style="min-width: 0; overflow-wrap: anywhere;">Skills 与工作区文件<br /><span class="sub">lark-cli ↔ 云端 Base</span></span></div>
<div class="label" style="left:388px;top:313px;width:132px">模型输入</div>
<div class="label" style="left:364px;top:495px;width:180px">最终文本</div>
<div class="label" style="left:896px;top:459px;width:132px">原生调用</div>
<div class="label" style="left:366px;top:686px;width:176px">进入下一轮</div>
<div class="label" style="left:71px;top:417px;width:300px">预算耗尽 / 运行故障</div>
<div class="small-note" style="left:1040px;top:295px;width:325px">技能正文按需 Read；文件与 Base 状态随执行保留。</div>
<div class="heading" style="top:875px">一个 Case：从原始执行到评审输入</div>
<div class="node" id="archive" style="left:80px;top:965px;width:360px;height:150px"><span style="min-width: 0; overflow-wrap: anywhere;">原始执行包<br /><span class="sub">messages · modelTurns<br />工具账本 · 版本 · 终态</span></span></div>
<div class="node soft" id="normalized" style="left:540px;top:965px;width:360px;height:150px"><span style="min-width: 0; overflow-wrap: anywhere;">标准化 Case<br /><span class="sub">有序 events · artifacts<br />规则快照 · 可见时序</span></span></div>
<div class="node" id="review" style="left:1000px;top:965px;width:360px;height:150px"><span style="min-width: 0; overflow-wrap: anywhere;">Judge / 修复 / 准出<br /><span class="sub">原始需求与完整证据<br />保留结果和版本关联</span></span></div>
<div class="small-note" style="left:80px;top:1160px;width:1280px">模型看到的观察与归档审计证据分别保存；标准化保留消息、调用和返回的对应关系。</div>
<svg class="edges" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1290"><defs><marker id="rollout-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" style="fill:#8a9983;stroke:none;marker-end:none"/></marker></defs>
