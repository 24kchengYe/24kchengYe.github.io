<!DOCTYPE html>
<html data-diagram-kind="flow" data-diagram-style="openai-blog" lang="zh"><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><link href="/assets/css/writing-diagram-themes.css" rel="stylesheet"/><link href="/writing/rl-assets/rl-diagram-theme.css?v=workflow-20261027" rel="stylesheet"/><style>body{margin:0;padding:16px;font:14px/1.5 Arial,sans-serif;background:var(--diagram-paper);color:var(--diagram-ink)}
*{box-sizing:border-box}
.canvas{position:relative;width:1200px;overflow:hidden;background:#fff;color:#202020;font:24px/1.45 Arial,"Microsoft YaHei","PingFang SC",sans-serif;text-align:left}
.canvas .node{position:absolute;z-index:3;border:1.35px solid #464b43;border-radius:8px;padding:14px 16px;background:#fff;display:flex;flex-direction:column;justify-content:center;text-align:center}
.canvas .node .action{font-size:25px;line-height:1.32;font-weight:400;margin:0}
.canvas .node .sub{font-size:20px;line-height:1.45;color:#65695f;margin-top:8px}
.canvas .node.soft{background:#f4f7ef;border-color:#7f9664}
.canvas .node.data{border-style:dashed}
.canvas [data-node-detail]{display:none}
.canvas .edge{position:absolute;height:0;border-top:1.6px solid #41483e;transform-origin:left center;z-index:1}
.canvas .edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #41483e;border-top:4px solid transparent;border-bottom:4px solid transparent}
.canvas .edge.preserve{border-top-style:dashed;border-top-color:#7f8578}
.canvas .edge.preserve.arrow:after{border-left-color:#7f8578}
.canvas .edge.cycle{border-top-color:#7f9664}
.canvas .edge.cycle.arrow:after{border-left-color:#7f9664}
.canvas .edge-label{position:absolute;z-index:2;padding:2px 6px;background:#fff;color:#61665b;font-size:20px;line-height:1.4;text-align:center}
.canvas .phase{position:absolute;font-size:27px;line-height:1.4;color:#30372c;font-weight:400}
.canvas .phase-rule{position:absolute;border-top:1px solid #dce1d6}
.canvas .note{position:absolute;font-size:20px;line-height:1.5;color:#65695f}
.canvas .boundary{position:absolute;border:1px solid #dde2d7;border-radius:9px;z-index:0}

:900px;top:130px;width:250px;height:110px" tabindex="0"><h3 class="action">验收与泄漏检查</h3><div class="sub">逐条检查新轨迹</div></section><section class="node" data-map-label="整理训练样本" data-map-node="" id="S-clean" role="button" style="left:900px;top:390px;width:250px;height:110px" tabindex="0"><h3 class="action">整理训练样本</h3><div class="sub">移除私有计划与审查对话</div></section><section class="node data" data-map-label="公开任务 + 交互" data-map-node="" id="S-data" role="button" style="left:590px;top:390px;width:240px;height:110px" tabindex="0"><h3 class="action">公开任务 + 交互</h3><div class="sub">监督目标：生成动作</div></section><section class="node soft" data-map-label="SFT → 新 Actor" data-map-node="" id="S-sft" role="button" style="left:300px;top:390px;width:220px;height:110px" tabindex="0"><h3 class="action">SFT → 新 Actor</h3><div class="sub">提高示范动作概率</div></section><div class="phase" style="left:40px;top:40px;width:1100px">A · RSR：从一次成功执行，得到可学习的示范</div><div class="edge-label" style="left:940px;top:300px;width:175px">通过</div><div class="note" style="left:300px;top:540px;width:840px">工具返回进入上下文；训练损失落在模型生成的位置。</div></div></html>
