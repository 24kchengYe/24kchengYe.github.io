<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 730" width="1440" height="730" lang="en"><foreignObject width="1440" height="730"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>
*{box-sizing:border-box}
.diagram-root{margin:0;background:#fff;color:#202321;font-family:ui-monospace,SFMono-Regular,Menlo,"PingFang SC",sans-serif;font-weight:400}
.canvas{position:relative;width:1440px;background:white;overflow:hidden}
.node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;font-size:26px;line-height:1.5;background:#fff;z-index:2;padding:8px 14px}
.node.box{border:1.25px solid #363b36;border-radius:23px;background-image:radial-gradient(#4b504b20 .65px,transparent .7px);background-size:5px 5px}
.node.accent{color:#4d6e2b;border-color:#85a65c;background-color:#fff;background-image:radial-gradient(#83a95738 .65px,transparent .7px);background-size:5px 5px}
.node.small{font-size:22px}
.label{position:absolute;font-size:20px;color:#737972;background:#fff;z-index:3;padding:2px 8px;line-height:1.6}
.wire{position:absolute;z-index:1}
.tip{position:absolute;width:8px;height:8px;border-top:1.25px solid #424942;border-right:1.25px solid #424942;z-index:1}
.rule{position:absolute;height:1px;background:#e0e5e1}
.group{position:absolute;border:1px solid #d4dbd0;border-radius:5px;background-image:radial-gradient(#82917c19 .6px,transparent .65px);background-size:6px 6px}
.group.draft{border-style:dashed;background-image:none}
.group-title{position:absolute;left:22px;top:-16px;background:white;padding:0 10px;font-size:22px;line-height:30px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
.lifeline{position:absolute;border-left:1px solid #cbd3c5}
.chart{padding:38px 70px 48px}.chart h2{font-size:23px;font-weight:400;margin:0 0 30px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:70px}
.chart-row{display:grid;grid-template-columns:185px 1fr 100px;gap:18px;align-items:center;min-height:66px;font-size:22px}
.track{position:relative;height:9px;background:#f0f2f0}.bar{height:9px;background:#aeb5aa}.bar.green{background:#83a957}.val{text-align:right;font-size:21px}
.axis{display:flex;justify-content:space-between;margin-left:203px;margin-right:118px;color:#8b918d;font-size:17px}.small-note{font-size:20px;color:#79827b}
.matrix{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:0;padding:35px 80px}.matrix&gt;div{padding:28px 18px;border-bottom:1px solid #dce3dd;font-size:24px}.matrix .muted{font-size:21px;color:#7c847d}.number{font-size:42px}.green{color:#5d7e3b}
.spark{display:flex;gap:20px;align-items:end;height:160px}.spark&gt;div{width:70px;background:#d9e5dd;position:relative;min-height:1px}.spark span{position:absolute;top:-35px;left:0;right:0;text-align:center;font-size:23px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:40px;padding:65px 80px 20px}.stat-grid .number{margin:12px 0}.stat-grid p{font-size:23px;line-height:1.7;margin:7px 0}.small{font-size:20px}
.plot{padding:45px 70px}.plot-row{display:grid;grid-template-columns:260px 1fr 230px;gap:25px;align-items:center;font-size:24px;margin:42px 0}.plot-track{height:20px;display:flex;position:relative;background:#f0f3f1}.plot-track&gt;div{height:20px;background:#ccd8bd}.plot-track&gt;div:last-child{background:#83a957}
.legend{font-size:20px;color:#79827b;display:flex;gap:40px;margin:30px 0}.legend i{display:inline-block;width:18px;height:10px;background:#ccd8bd;margin-right:10px}.legend i.dark{background:#83a957}
.chips{display:flex;gap:12px;padding:20px 0}.chip{width:16px;height:16px;border:1px solid #bec8c1;border-radius:50%}.chip.green{background:#83a957;border-color:#83a957}.chip.gray{background:#aab8af}.caption{font-size:21px;color:#7b827d;margin-top:26px}

.diagram-root{font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.label,.legend,.note,.annotation,.small-note,.caption,.axis{font-size:22px}.title,.label.title{font-size:30px}.group-title,.chart h2{font-size:26px}.chart-row,.plot-row,.matrix&gt;div,.stat-grid p,.val{font-size:26px}.matrix .muted,.math,.legend,.small{font-size:24px}</style><main class="canvas" style="height:730px"><div class="group " style="left:45px;top:65px;width:650px;height:590px"><span class="group-title">Goal · Agent-controlled</span></div><div class="group " style="left:745px;top:65px;width:650px;height:590px"><span class="group-title">Loop · Code-controlled</span></div><div class="lifeline" style="left:200px;top:175px;height:440px"></div><div class="lifeline" style="left:540px;top:175px;height:440px"></div><div class="lifeline" style="left:900px;top:175px;height:440px"></div><div class="lifeline" style="left:1240px;top:175px;height:440px"></div><div class="node box accent small" style="left: 95px; top: 105px; width: 210px; height: 80px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">Long-running agent</span></div><div class="node box small" style="left: 435px; top: 105px; width: 210px; height: 80px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">Evaluation scripts</span></div><div class="node box accent small" style="left: 795px; top: 115px; width: 210px; height: 60px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">Driver</span></div><div class="node box small" style="left: 1135px; top: 105px; width: 210px; height: 80px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">Short-task agent</span></div><div class="wire" style="left:200px;top:265px;width:340px;border-top:1.25px solid #83a957"></div><div class="tip" style="left:525px;top:260px;border-color:#83a957;transform:rotate(45deg)"></div><div class="label" style="left:260px;top:230px">Submit / evaluate</div><div class="wire" style="left:200px;top:380px;width:340px;border-top:1.25px solid #424942"></div><div class="tip" style="left:205px;top:375px;border-color:#424942;transform:rotate(225deg)"></div><div class="label" style="left:270px;top:345px">Return results</div><div class="node box accent small" style="left: 90px; top: 440px; width: 220px; height: 120px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">Decide / revert<br />Schedule next round</span></div><div class="wire" style="left:900px;top:265px;width:340px;border-top:1.25px solid #83a957"></div><div class="tip" style="left:1225px;top:260px;border-color:#83a957;transform:rotate(45deg)"></div><div class="label" style="left:965px;top:230px">Dispatch one step</div><div class="wire" style="left:900px;top:380px;width:340px;border-top:1.25px solid #424942"></div><div class="tip" style="left:905px;top:375px;border-color:#424942;transform:rotate(225deg)"></div><div class="label" style="left:980px;top:345px">Return artifacts</div><div class="node box accent small" style="left: 790px; top: 440px; width: 220px; height: 120px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">Evaluate / decide<br />Record state</span></div><div class="label" style="left:140px;top:575px">Agent decides to continue</div><div class="label" style="left:860px;top:575px">Code advances the loop</div></main></div></foreignObject></svg>
