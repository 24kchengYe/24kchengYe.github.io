            role: 筆頭著者・責任著者 · ECCV 2026
            points:
              - 視覚RAG向けの事後的概念ボトルネックによるアライメントを提案。Observer–Debater–Judgeのエージェント連鎖が凍結VLMから解釈可能な概念スコアを抽出し、視覚・意味の複合多様体上で局所重み付きリッジ回帰により人間の評点へ較正。
              - 都市景観の知覚評価で<strong>正解率72.2%（κ = 0.45）</strong>を達成。教師ありベースラインを<strong>15.1ポイント</strong>、未較正VLMを<strong>16.3ポイント</strong>上回った。
            link:
              label: UrbanAlign
              url: https://doi.org/10.1007/978-3-032-37132-4_18
          - id: urban-data
            title: マルチモーダル都市データマイニング
            date: 2021.09 – 2025.10
            role: GloPPRUA · GloGCI · CMAB
            points:
              - 複数時点の画像解釈と空間マッチングを開発。解像度分布を合わせたHRNet-W48 + U-Netにより、強いぼけ条件のDiceが<strong>0.684から0.756</strong>へ向上。RGB–Mask GANで建物輪郭の直角率が<strong>0.398から0.624</strong>へ向上し、1 mのDPベクトル化、形態別ルーティング、位置ずれ較正、文脈マッチングを統合。
              - <strong>1,000都市で約1,478万件の2時点建物観測</strong>を構築。CMABとGloGCIはESI高被引用論文に選出され、データとコードは累計<strong>79,500回</strong>ダウンロードされた。
            text: '<a href="https://doi.org/10.1038/s41597-025-04730-5">CMAB · Scientific Data, 2025</a><br><a href="https://doi.org/10.1016/j.habitatint.2025.103350">GloGCI / ゴーストシティの推定 · Habitat International, 2025</a><br><a href="https://doi.org/10.1016/j.jag.2022.102942">都市空間リスクの予測 · JAG, 2022</a><br><a href="https://doi.org/10.1007/s12273-026-1461-9">建築スケール都市分析・シミュレーション · Building Simulation, 2026</a>'
          - id: ai4us
            title: 科学データの合成と制御実験
            date: 2024.09 – 現在
            role: 筆頭著者／責任著者 · arXiv
            points:
              - AI4USを提案し、データ合成と条件付き介入の2経路で、都市スケーリング、距離減衰、街区の活力、街路景観の知覚を評価。関係の再現、実証パラメータ・分布との整合、制御条件に対する応答を比較。
              - GenAIは識別可能な都市の規則性と方向性のある応答を再現する一方、数値の範囲、局所的な変動、視覚的な多様性を圧縮することを確認。<strong>Qwen2.5-VL-72B</strong>のProfile–Probe–Intervene分析では、一部の規則性が中間表現から読み出され、局所的な出力に影響することを示した。
            text: '<a href="https://arxiv.org/abs/2505.13803">GenAI Models Capture Urban Science but Oversimplify Complexity</a> · arXiv, 2025。<br>Large Language Models Perceive Cities through a Culturally Uneven Baseline · arXiv, 2026（責任著者）。'
