<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1340" width="1200" height="1340" lang="zh"><foreignObject width="1200" height="1340"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>*{box-sizing:border-box}.diagram-root{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;background:#fff;overflow:hidden}.heading{position:absolute;left:40px;top:24px;font-size:30px;line-height:1.3}.node{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px 18px;text-align:center;border:1px solid #a6b1a1;border-radius:5px;background:#fff;font-size:28px;line-height:1.25;z-index:2}.node.soft{background:#f1f5ec}.node.plan{border-style:dashed}.node.failed{background:#faf3e9;border-color:#d8bf9f}.sub{font-size:24px;line-height:1.35;color:#687568}.label{position:absolute;font-size:22px;line-height:1.35;color:#687568;background:#fff;padding:3px 6px;text-align:center;z-index:3}.region{position:absolute;border:1px solid #d4ddcd;border-radius:6px}.region-title{position:absolute;top:-19px;left:20px;padding:0 10px;background:#fff;font-size:26px}.edge{position:absolute;height:0;border-top:1.6px solid #98a58c;transform-origin:0 0;z-index:1}.edge.feedback,.edge.support{border-top-style:dashed}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #98a58c;border-top:4px solid transparent;border-bottom:4px solid transparent}.note{position:absolute;left:40px;font-size:22px;line-height:1.5;color:#687568}.math{font-family:Georgia,serif;font-style:italic;font-size:30px}</style><main class="canvas" data-fixed-type="" style="width: 1200px; height: 1340px;"><div class="heading">规划、共享 Harness 与修复回流</div>
<div class="region" style="left: 30px; top: 270px; width: 740px; height: 810px;"><div class="region-title">Online · 教师监督执行</div></div>
<div class="region" style="left: 860px; top: 270px; width: 310px; height: 330px;"><div class="region-title">Offline · 编辑与核验</div></div>
<div id="plan" class="node plan" style="left:70px;top:105px;width:660px;height:100px"><div>Spec → TodoList</div><div class="sub">计划指导执行，问题归因修订计划</div></div>
<div id="execute" class="node " style="left: 50px; top: 330px; width: 320px; height: 220px;"><div>生成 / 续跑 / 重生成</div><div class="sub">教师纠偏覆盖每次执行</div></div>
<div id="judge" class="node " style="left: 440px; top: 330px; width: 290px; height: 220px;"><div>Judge 与问题归因</div><div class="sub">三轮评审 · 路由</div></div>
<div id="offline" class="node " style="left: 885px; top: 330px; width: 260px; height: 220px;"><div>局部编辑与核验</div><div class="sub">依赖 · 清洗 · 三评</div></div>
<div id="budget" class="node " style="left: 440px; top: 670px; width: 290px; height: 170px;"><div>累计修复预算</div><div class="sub">同一 Case 的 N 不重置</div></div>
<div id="harness" class="node soft" style="left: 70px; top: 910px; width: 660px; height: 120px;"><div>共享 Harness</div><div class="sub">上下文 · 工具环境 · 真实回执 · 检查点</div></div>
<div id="release" class="node soft" style="left: 885px; top: 910px; width: 260px; height: 140px;"><div>训练准出</div><div class="sub">质量 · 真实性 · 格式</div></div>
<div id="pending" class="node " style="left: 440px; top: 1160px; width: 290px; height: 120px;"><div>Pending</div><div class="sub">保留版本与原因</div></div>
<div class="connection" data-from="plan" data-to="execute" data-relation="flow"><div class="edge  arrow" style="left:210px;top:205px;width:125px;transform:rotate(90deg)"></div></div>
<div class="connection" data-from="judge" data-to="plan" data-relation="feedback"><div class="edge feedback" style="left:585px;top:330px;width:80px;transform:rotate(-90deg)"></div><div class="edge feedback" style="left:585px;top:250px;width:65px;transform:rotate(0deg)"></div><div class="edge feedback arrow" style="left:650px;top:250px;width:45px;transform:rotate(-90deg)"></div></div>
<div class="connection" data-from="execute" data-to="judge" data-relation="flow"><div class="edge arrow" style="left: 370px; top: 440px; width: 70px; transform: rotate(0deg);"></div></div>
<div class="connection" data-from="judge" data-to="offline" data-relation="flow"><div class="edge arrow" style="left: 730px; top: 440px; width: 155px; transform: rotate(0deg);"></div></div>
<div class="connection" data-from="judge" data-to="budget" data-relation="flow"><div class="edge arrow" style="left: 585px; top: 550px; width: 120px; transform: rotate(90deg);"></div></div>
<div class="connection" data-from="offline" data-to="budget" data-relation="feedback"><div class="edge feedback" style="left: 1015px; top: 550px; width: 230px; transform: rotate(90deg);"></div><div class="edge feedback" style="left: 1015px; top: 780px; width: 225px; transform: rotate(180deg);"></div><div class="edge feedback" style="left: 790px; top: 780px; width: 25px; transform: rotate(-90deg);"></div><div class="edge feedback arrow" style="left: 790px; top: 755px; width: 60px; transform: rotate(180deg);"></div></div>
<div class="connection" data-from="budget" data-to="execute" data-relation="feedback"><div class="edge feedback" style="left: 440px; top: 755px; width: 230px; transform: rotate(180deg);"></div><div class="edge feedback arrow" style="left: 210px; top: 755px; width: 205px; transform: rotate(-90deg);"></div></div>
<div class="connection" data-from="execute" data-to="harness" data-relation="support"><div class="edge support" style="left: 120px; top: 550px; width: 360px; transform: rotate(90deg);"></div></div>
<div class="connection" data-from="offline" data-to="release" data-relation="flow"><div class="edge" style="left: 1145px; top: 550px; width: 310px; transform: rotate(90deg);"></div><div class="edge" style="left: 1145px; top: 860px; width: 130px; transform: rotate(180deg);"></div><div class="edge arrow" style="left: 1015px; top: 860px; width: 50px; transform: rotate(90deg);"></div></div>
<div class="connection" data-from="budget" data-to="pending" data-relation="flow"><div class="edge" style="left: 585px; top: 840px; width: 30px; transform: rotate(90deg);"></div><div class="edge" style="left: 585px; top: 870px; width: 215px; transform: rotate(0deg);"></div><div class="edge" style="left: 800px; top: 870px; width: 350px; transform: rotate(90deg);"></div><div class="edge arrow" style="left: 800px; top: 1220px; width: 70px; transform: rotate(180deg);"></div></div>
<div class="label" style="left: 740px; top: 370px; width: 135px;">完整轨迹</div>
<div class="label" style="left: 840px; top: 700px; width: 170px;">需真实执行</div>
<div class="label" style="left: 960px; top: 825px; width: 170px;">通过核验</div>
<div class="label" style="left: 255px; top: 685px; width: 140px;">有余量</div>
<div class="label" style="left: 820px; top: 1100px; width: 200px;">受阻 / 耗尽</div>
<div class="note" style="top: 1295px; width: 1120px;">流程设计：Offline 携问题和证据回流；执行始终由共享 Harness 承载。</div>
</main></div></foreignObject></svg>
