            title: 字节跳动 · PDI–Seed · Lark Base AI
            date: 2026.05 – 至今
            role: 大模型算法实习生 · ByteIntern
            text: 负责豆包办公 MoA 体系下 Lark Base AI 面向 Seed 2 的后训练，覆盖数据合成、Judge/Fix Infra Models、Verifier Agent 与 AutoResearch，以及 Spec–Verifier–SDK Coding Agent 和 Lark Base CLI。
            projects:
              - title: Spec-Refine 数据合成
                points:
                  - 构建覆盖 Table、Workflow、Dashboard、Permission、View 五大域的 Category–Rubric–Mode 三层体系与 Judge–Fix–Router 链路，结合多候选生成、根因路由、局部复核和修复记忆，通过投票、格式准出、早停及事务回滚控制质量与开销。
                  - 构建 Verifier Agent，将 token logprobs、多模态证据与 rollout 转化为稠密强化学习信号。E2E 机评和人评中，数据准确率由 <strong>29% 提升至 70%（+41 pp）</strong>。
              - title: Judge/Fix 模型训练
                points:
                  - 构建 Assumption-Based Truth Maintenance System，通过 DFS 集合传播计算最小假设组合和矛盾假设组合；基于 DSH harness 的 <strong>1 万余条</strong>合成轨迹，结合 Strict-SFT、分层 F1 Reward、课程式强化学习和在策略上下文蒸馏，对 Seed 2 Judge 进行后训练。
                  - 以 GRPO 训练的 Judge 为教师强化 Seed 2，准确率与 GPT-6.1 持平，Vote 一致率和 Rubric 覆盖率分别提升 <strong>35 pp、45 pp</strong>；使用多教师轨迹与 SFT + RFT + PPO 训练 Fix Model，准确率较 GPT-6.1 提升 <strong>20 pp</strong>。
              - title: Lark Base CLI 的 Agentic RL
                points:
                  - 将优化后的 Spec 作为 Coding Agent 的思维链，结合 CodeAct、E2E Reward 长轨迹与动态加载的 skills 训练。把需求覆盖、配置正确性、跨模块依赖和整体可用性转化为稠密反馈，结合 Learning-frontier 动态采样，并使用编译器报错、失败日志和成功 rollout 作为 privileged context。
                  - 构建自进化提示词优化 harness，结合跨批次对抗分析，以及证据、稳定性和净收益门控。token 利用效率提升 <strong>38 pp</strong>，<strong>P50 延迟从 3.1 分钟降至 23 秒</strong>。
