<div class="node process" id="CE" style="left: 90px; top: 440px; width: 220px; height: 60px; font-size: 20px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">単一ターンの編集</span></div>
<div class="node process" id="CF" style="left: 465px; top: 440px; width: 230px; height: 60px; font-size: 20px; line-height: 1.4;"><span style="min-width: 0; overflow-wrap: anywhere;">依存区間の編集</span></div>
