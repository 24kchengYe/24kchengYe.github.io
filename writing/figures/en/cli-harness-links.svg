<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" width="1200" height="1080" lang="en"><foreignObject width="1200" height="1080"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>*{box-sizing:border-box}.diagram-root{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;background:#fff;overflow:hidden}.heading{position:absolute;left:40px;top:24px;font-size:30px;line-height:1.3}.node{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px 18px;text-align:center;border:1px solid #a6b1a1;border-radius:5px;background:#fff;font-size:28px;line-height:1.25;z-index:2}.node.soft{background:#f1f5ec}.node.plan{border-style:dashed}.node.failed{background:#faf3e9;border-color:#d8bf9f}.sub{font-size:24px;line-height:1.35;color:#687568}.label{position:absolute;font-size:22px;line-height:1.35;color:#687568;background:#fff;padding:3px 6px;text-align:center;z-index:3}.region{position:absolute;border:1px solid #d4ddcd;border-radius:6px}.region-title{position:absolute;top:-19px;left:20px;padding:0 10px;background:#fff;font-size:26px}.edge{position:absolute;height:0;border-top:1.6px solid #98a58c;transform-origin:0 0;z-index:1}.edge.feedback,.edge.support{border-top-style:dashed}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #98a58c;border-top:4px solid transparent;border-bottom:4px solid transparent}.note{position:absolute;left:40px;font-size:22px;line-height:1.5;color:#687568}.math{font-family:Georgia,serif;font-style:italic;font-size:30px}</style><main class="canvas" data-fixed-type="" style="width:1200px;height:1080px"><div class="heading">Planning, shared Harness, and repair return</div>
<div class="region" style="left:30px;top:270px;width:740px;height:610px"><div class="region-title">Online · teacher-supervised execution</div></div>
<div class="region" style="left:860px;top:270px;width:310px;height:290px"><div class="region-title">Offline · editing and verification</div></div>
<div id="plan" class="node plan" style="left:70px;top:105px;width:660px;height:100px"><span style="min-width: 0; overflow-wrap: anywhere;"><div>Spec → TodoList</div><div class="sub">The plan guides execution; attribution revises it</div></span></div>
<div id="execute" class="node " style="left:70px;top:330px;width:280px;height:140px"><span style="min-width: 0; overflow-wrap: anywhere;"><div>Generate / continue / regenerate</div><div class="sub">Teacher correction covers each execution</div></span></div>
<div id="judge" class="node " style="left:440px;top:330px;width:290px;height:140px"><span style="min-width: 0; overflow-wrap: anywhere;"><div>Judge and issue attribution</div><div class="sub">Three reviews · routing</div></span></div>
<div id="offline" class="node " style="left:885px;top:330px;width:260px;height:140px"><span style="min-width: 0; overflow-wrap: anywhere;"><div>Local editing and verification</div><div class="sub">Dependencies · cleaning · three reviews</div></span></div>
<div id="budget" class="node " style="left:440px;top:550px;width:290px;height:100px"><span style="min-width: 0; overflow-wrap: anywhere;"><div>Cumulative repair budget</div><div class="sub">N is not reset for the same case</div></span></div>
<div id="harness" class="node soft" style="left:70px;top:720px;width:660px;height:100px"><span style="min-width: 0; overflow-wrap: anywhere;"><div>Shared Harness</div><div class="sub">Context · tools · real responses · checkpoints</div></span></div>
<div id="release" class="node soft" style="left:885px;top:720px;width:260px;height:100px"><span style="min-width: 0; overflow-wrap: anywhere;"><div>Training release</div><div class="sub">Quality · evidence · format</div></span></div>
<div id="pending" class="node " style="left:440px;top:930px;width:290px;height:100px"><span style="min-width: 0; overflow-wrap: anywhere;"><div>Pending</div><div class="sub">Retain version and reason</div></span></div>
<div class="connection" data-from="plan" data-to="execute" data-relation="flow"><div class="edge  arrow" style="left:210px;top:205px;width:125px;transform:rotate(90deg)"></div></div>
<div class="connection" data-from="judge" data-to="plan" data-relation="feedback"><div class="edge feedback" style="left:585px;top:330px;width:80px;transform:rotate(-90deg)"></div><div class="edge feedback" style="left:585px;top:250px;width:65px;transform:rotate(0deg)"></div><div class="edge feedback arrow" style="left:650px;top:250px;width:45px;transform:rotate(-90deg)"></div></div>
<div class="connection" data-from="execute" data-to="judge" data-relation="flow"><div class="edge  arrow" style="left:350px;top:400px;width:90px;transform:rotate(0deg)"></div></div>
<div class="connection" data-from="judge" data-to="offline" data-relation="flow"><div class="edge  arrow" style="left:730px;top:400px;width:155px;transform:rotate(0deg)"></div></div>
<div class="connection" data-from="judge" data-to="budget" data-relation="flow"><div class="edge  arrow" style="left:585px;top:470px;width:80px;transform:rotate(90deg)"></div></div>
<div class="connection" data-from="offline" data-to="budget" data-relation="feedback"><div class="edge feedback" style="left:1015px;top:470px;width:160px;transform:rotate(90deg)"></div><div class="edge feedback" style="left:1015px;top:630px;width:225px;transform:rotate(180deg)"></div><div class="edge feedback" style="left:790px;top:630px;width:30px;transform:rotate(-90deg)"></div><div class="edge feedback arrow" style="left:790px;top:600px;width:60px;transform:rotate(180deg)"></div></div>
<div class="connection" data-from="budget" data-to="execute" data-relation="feedback"><div class="edge feedback" style="left:440px;top:600px;width:230px;transform:rotate(180deg)"></div><div class="edge feedback arrow" style="left:210px;top:600px;width:130px;transform:rotate(-90deg)"></div></div>
<div class="connection" data-from="execute" data-to="harness" data-relation="support"><div class="edge support" style="left:120px;top:470px;width:250px;transform:rotate(90deg)"></div></div>
<div class="connection" data-from="offline" data-to="release" data-relation="flow"><div class="edge " style="left:1145px;top:470px;width:220px;transform:rotate(90deg)"></div><div class="edge " style="left:1145px;top:690px;width:130px;transform:rotate(180deg)"></div><div class="edge  arrow" style="left:1015px;top:690px;width:30px;transform:rotate(90deg)"></div></div>
<div class="connection" data-from="budget" data-to="pending" data-relation="flow"><div class="edge " style="left:585px;top:650px;width:30px;transform:rotate(90deg)"></div><div class="edge " style="left:585px;top:680px;width:215px;transform:rotate(0deg)"></div><div class="edge " style="left:800px;top:680px;width:300px;transform:rotate(90deg)"></div><div class="edge  arrow" style="left:800px;top:980px;width:70px;transform:rotate(180deg)"></div></div>
<div class="label" style="left:740px;top:350px;width:135px">Complete trajectory</div>
<div class="label" style="left:840px;top:570px;width:170px">Needs real execution</div>
<div class="label" style="left:960px;top:655px;width:170px">Verified</div>
<div class="label" style="left:255px;top:555px;width:140px">Budget remains</div>
<div class="label" style="left:820px;top:875px;width:200px">Blocked / exhausted</div>
<div class="note" style="top:1040px;width:1120px">Design: Offline returns issues with evidence; execution always runs on the shared Harness.</div>
</main></div></foreignObject></svg>
