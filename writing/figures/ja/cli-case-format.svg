<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1170" width="1200" height="1170" lang="ja"><foreignObject width="1200" height="1170"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>*{box-sizing:border-box}.diagram-root{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1200px;background:#fff;overflow:hidden}.heading{position:absolute;left:50px;top:22px;font-size:30px;line-height:1.3}.node{position:absolute;display:flex;align-items:center;justify-content:center;padding:14px 18px;text-align:center;border:1px solid #a6b1a1;border-radius:5px;background:#fff;font-size:28px;line-height:1.28;z-index:2}.soft{background:#f1f5ec}.node.foundation{background:#eaf0e4;border-color:#839675}.node.plan{border-style:dashed}.sub{display:block;margin-top:8px;font-size:24px;line-height:1.4;color:#687568}.label{position:absolute;font-size:22px;line-height:1.35;color:#687568;background:#fff;padding:3px 4px;text-align:center;z-index:3}.region{position:absolute;border:1px solid #c6d0bf;border-radius:8px}.region-title{position:absolute;top:-21px;left:22px;padding:0 12px;background:#fff;font-size:28px;line-height:1.4}.edge{position:absolute;height:0;border-top:1.5px solid #8b9b83;transform-origin:0 0;z-index:1}.edge.support{border-top-style:dashed;stroke-dasharray:4 4}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #8b9b83;border-top:4px solid transparent;border-bottom:4px solid transparent}.note{position:absolute;font-size:22px;line-height:1.45;color:#687568}</style><main class="canvas" data-fixed-type="" style="height:1170px"><div class="heading">軌跡の実行状態・修復バージョン・結果</div>
<div id="before" class="node " style="left:60px;top:120px;width:350px;height:330px"><span style="min-width: 0; overflow-wrap: anywhere;">Sₜ · 現在の状態<br /><span class="sub">メッセージ文脈 Mₜ<br />ファイル・Base の状態 Eₜ<br />計画 Pₜ（導入時）<br />残りの予算 Bₜ</span></span></div>
<div id="action" class="node " style="left:470px;top:135px;width:260px;height:140px"><span style="min-width: 0; overflow-wrap: anywhere;">aₜ · ツールの動作<br /><span class="sub">Read / Write / Bash</span></span></div>
<div id="observation" class="node " style="left:470px;top:310px;width:260px;height:140px"><span style="min-width: 0; overflow-wrap: anywhere;">oₜ · 実際の観察<br /><span class="sub">tool_call_id で対応付け</span></span></div>
<div id="after" class="node soft" style="left:790px;top:120px;width:350px;height:330px"><span style="min-width: 0; overflow-wrap: anywhere;">Sₜ₊₁ · 更新後の状態<br /><span class="sub">Mₜ に動作と返却値を追加<br />Eₜ は実際の実行結果に従う<br />Pₜ を必要に応じて更新<br />Bₜ から実消費を差し引く</span></span></div>
<div class="connection" data-from="before" data-to="action" data-relation="flow"><div class="edge flow arrow" style="left:410px;top:205px;width:60px;transform:rotate(0deg)"></div></div>
<div class="connection" data-from="action" data-to="after" data-relation="flow"><div class="edge flow arrow" style="left:730px;top:205px;width:60px;transform:rotate(0deg)"></div></div>
<div class="connection" data-from="action" data-to="observation" data-relation="flow"><div class="edge flow arrow" style="left:600px;top:275px;width:35px;transform:rotate(90deg)"></div></div>
<div class="connection" data-from="observation" data-to="after" data-relation="flow"><div class="edge flow arrow" style="left:730px;top:380px;width:60px;transform:rotate(0deg)"></div></div>
<div class="note" style="left:60px;top:490px;width:1080px">実行で環境が変わり、実際の観察が文脈に加わる。その状態から次のターンへ進む。</div>
<div class="heading" style="top:570px">修復例 · 同一 Case の各バージョンの証拠を保持</div>
<div id="original" class="node " style="left:60px;top:650px;width:300px;height:150px"><span style="min-width: 0; overflow-wrap: anywhere;">元の軌跡 v₀<br /><span class="sub">メッセージと実際の返却値</span></span></div>
<div id="regenerated" class="node " style="left:450px;top:650px;width:300px;height:150px"><span style="min-width: 0; overflow-wrap: anywhere;">再生成版 v₁<br /><span class="sub">新しい実行・新しい返却値</span></span></div>
<div id="edited" class="node " style="left:840px;top:650px;width:300px;height:150px"><span style="min-width: 0; overflow-wrap: anywhere;">編集版 v₁′<br /><span class="sub">パッチ・依存関係の検証</span></span></div>
<div class="connection" data-from="original" data-to="regenerated" data-relation="flow"><div class="edge flow arrow" style="left:360px;top:725px;width:90px;transform:rotate(0deg)"></div></div>
<div class="connection" data-from="regenerated" data-to="edited" data-relation="flow"><div class="edge flow arrow" style="left:750px;top:725px;width:90px;transform:rotate(0deg)"></div></div>
<div class="label" style="left:360px;top:679px;width:90px">Online</div>
<div class="label" style="left:750px;top:679px;width:90px">Offline</div>
<div class="heading" style="top:855px">各バージョンの結果を3種類に分けて記録</div>
<div id="execution" class="node " style="left:60px;top:925px;width:320px;height:135px"><span style="min-width: 0; overflow-wrap: anywhere;">実行結果<br /><span class="sub">succeeded / failed</span></span></div>
<div id="review" class="node " style="left:440px;top:925px;width:320px;height:135px"><span style="min-width: 0; overflow-wrap: anywhere;">Judge の判定<br /><span class="sub">問題・段階評価・証拠</span></span></div>
<div id="decision" class="node " style="left:820px;top:925px;width:320px;height:135px"><span style="min-width: 0; overflow-wrap: anywhere;">学習採用の判断<br /><span class="sub">Released / Pending</span></span></div>
<div class="note" style="left:60px;top:1100px;width:1080px">実行完了でも評価を通過するとは限らない。Pending は実行失敗と同義ではない。</div>
</main></div></foreignObject></svg>
