<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1340" width="1200" height="1340" lang="ja"><foreignObject width="1200" height="1340"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root" data-diagram-style="engineering" data-diagram-kind="flow"><style>*{box-sizing:border-box}.diagram-root{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;background:#fff;overflow:hidden}.heading{position:absolute;left:40px;top:24px;font-size:30px;line-height:1.3}.node{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px 18px;text-align:center;border:1px solid #a6b1a1;border-radius:5px;background:#fff;font-size:28px;line-height:1.25;z-index:2}.node.soft{background:#f1f5ec}.node.plan{border-style:dashed}.node.failed{background:#faf3e9;border-color:#d8bf9f}.sub{font-size:24px;line-height:1.35;color:#687568}.label{position:absolute;font-size:22px;line-height:1.35;color:#687568;background:#fff;padding:3px 6px;text-align:center;z-index:3}.region{position:absolute;border:1px solid #d4ddcd;border-radius:6px}.region-title{position:absolute;top:-19px;left:20px;padding:0 10px;background:#fff;font-size:26px}.edge{position:absolute;height:0;border-top:1.6px solid #98a58c;transform-origin:0 0;z-index:1}.edge.feedback,.edge.support{border-top-style:dashed}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #98a58c;border-top:4px solid transparent;border-bottom:4px solid transparent}.note{position:absolute;left:40px;font-size:22px;line-height:1.5;color:#687568}.math{font-family:Georgia,serif;font-style:italic;font-size:30px}.canvas { color:#303c38; }
.node,.bundle,.checkpoint,.restore { border-width:1.6px; border-color:#87938a; border-radius:8px; box-shadow:none; }
.region,.workspace { border-color:#d5ddd5; border-radius:8px; }
.workspace { background:#fafbf9; }
.node { font-size:28px; }
.title,.heading { font-size:30px; }
.sub,.bundle .small,.dependency-row { font-size:24px; color:#667269; }
.edge-label,.note { font-size:22px; color:#667269; }
.edge { border-top-width:1.6px; border-top-color:#748176; }
.edge.arrow:after { border-left-color:#748176; }
.edge.handoff { border-color:#7e9668; }
.edge.handoff.arrow:after { border-left-color:#7e9668; }
.edge.failure { border-color:#98a196; }
.edge.failure.arrow:after { border-left-color:#98a196; }
.node.plan { border-style:dashed; }
.node.output,.node.soft { background:#f3f6ef; }
.node.pending { background:#f7f8f6; }
.node.failed { background:#fcf7ef; border-color:#b99970; }
</style><main class="canvas" data-fixed-type="" style="width: 1200px; height: 1340px;"><div class="heading">計画・共有Harness・修復の戻り</div>
<div class="region" style="left: 30px; top: 270px; width: 740px; height: 810px;"><div class="region-title">Online · 教師監督下の実行</div></div>
<div class="region" style="left: 860px; top: 270px; width: 310px; height: 330px;"><div class="region-title">Offline · 編集と検証</div></div>
<div id="plan" class="node plan" style="left:70px;top:105px;width:660px;height:100px"><div>Spec → TodoList</div><div class="sub">計画が実行を導き、原因分析が計画を改訂</div></div>
<div id="execute" class="node " style="left: 50px; top: 330px; width: 320px; height: 220px;"><div>生成 / 継続実行 / 再生成</div><div class="sub">教師の修正が各実行をカバー</div></div>
<div id="judge" class="node " style="left: 440px; top: 330px; width: 290px; height: 220px;"><div>Judgeと問題の原因分析</div><div class="sub">3回の評価 · ルーティング</div></div>
<div id="offline" class="node " style="left: 885px; top: 330px; width: 260px; height: 220px;"><div>局所編集と検証</div><div class="sub">依存関係 · クリーニング · 3回評価</div></div>
<div id="budget" class="node " style="left: 440px; top: 670px; width: 290px; height: 170px;"><div>累積修復予算</div><div class="sub">同じCaseではNをリセットしない</div></div>
<div id="harness" class="node soft" style="left: 70px; top: 910px; width: 660px; height: 120px;"><div>共有Harness</div><div class="sub">文脈・ツール環境・実際の返却値・チェックポイント</div></div>
<div id="release" class="node soft" style="left: 885px; top: 910px; width: 260px; height: 140px;"><div>学習データへ</div><div class="sub">品質・真正性・形式</div></div>
<div id="pending" class="node " style="left: 440px; top: 1160px; width: 290px; height: 120px;"><div>Pending</div><div class="sub">バージョンと理由を保持</div></div>
<div class="connection" data-from="plan" data-to="execute" data-relation="flow"><div class="edge  arrow" style="left:210px;top:205px;width:125px;transform:rotate(90deg)"></div></div>
<div class="connection" data-from="judge" data-to="plan" data-relation="feedback"><div class="edge feedback" style="left:585px;top:330px;width:80px;transform:rotate(-90deg)"></div><div class="edge feedback" style="left:585px;top:250px;width:65px;transform:rotate(0deg)"></div><div class="edge feedback arrow" style="left:650px;top:250px;width:45px;transform:rotate(-90deg)"></div></div>
<div class="connection" data-from="execute" data-to="judge" data-relation="flow"><div class="edge arrow" style="left: 370px; top: 440px; width: 70px; transform: rotate(0deg);"></div></div>
<div class="connection" data-from="judge" data-to="offline" data-relation="flow"><div class="edge arrow" style="left: 730px; top: 440px; width: 155px; transform: rotate(0deg);"></div></div>
<div class="connection" data-from="judge" data-to="budget" data-relation="flow"><div class="edge arrow" style="left: 585px; top: 550px; width: 120px; transform: rotate(90deg);"></div></div>
<div class="connection" data-from="offline" data-to="budget" data-relation="feedback"><div class="edge feedback" style="left: 1015px; top: 550px; width: 230px; transform: rotate(90deg);"></div><div class="edge feedback" style="left: 1015px; top: 780px; width: 225px; transform: rotate(180deg);"></div><div class="edge feedback" style="left: 790px; top: 780px; width: 25px; transform: rotate(-90deg);"></div><div class="edge feedback arrow" style="left: 790px; top: 755px; width: 60px; transform: rotate(180deg);"></div></div>
<div class="connection" data-from="budget" data-to="execute" data-relation="feedback"><div class="edge feedback" style="left: 440px; top: 755px; width: 230px; transform: rotate(180deg);"></div><div class="edge feedback arrow" style="left: 210px; top: 755px; width: 205px; transform: rotate(-90deg);"></div></div>
<div class="connection" data-from="execute" data-to="harness" data-relation="support"><div class="edge support" style="left: 120px; top: 550px; width: 360px; transform: rotate(90deg);"></div></div>
<div class="connection" data-from="offline" data-to="release" data-relation="flow"><div class="edge" style="left: 1145px; top: 550px; width: 310px; transform: rotate(90deg);"></div><div class="edge" style="left: 1145px; top: 860px; width: 130px; transform: rotate(180deg);"></div><div class="edge arrow" style="left: 1015px; top: 860px; width: 50px; transform: rotate(90deg);"></div></div>
<div class="connection" data-from="budget" data-to="pending" data-relation="flow"><div class="edge" style="left: 585px; top: 840px; width: 30px; transform: rotate(90deg);"></div><div class="edge" style="left: 585px; top: 870px; width: 215px; transform: rotate(0deg);"></div><div class="edge" style="left: 800px; top: 870px; width: 350px; transform: rotate(90deg);"></div><div class="edge arrow" style="left: 800px; top: 1220px; width: 70px; transform: rotate(180deg);"></div></div>
<div class="label" style="left: 740px; top: 370px; width: 135px;">完全な軌跡</div>
<div class="label" style="left: 840px; top: 700px; width: 170px;">実行が必要</div>
<div class="label" style="left: 960px; top: 825px; width: 170px;">検証済み</div>
<div class="label" style="left: 255px; top: 685px; width: 140px;">予算が残る</div>
<div class="label" style="left: 820px; top: 1100px; width: 200px;">阻止 / 枯渇</div>
<div class="note" style="top: 1295px; width: 1120px;">設計：Offlineは問題と証拠を返し、実行は常に共有Harnessで行う。</div>
</main><style>[data-diagram-style="openai-blog"] {
  --diagram-ink:#202422;
  --diagram-muted:#59635b;
  --diagram-line:#545c55;
  --diagram-border:#656e66;
  --diagram-accent:#688e42;
  --diagram-failure:#997140;
  --diagram-paper:#fff;
  --diagram-soft:#f6f8f3;
  --diagram-warm:#fcf6ed;
  --diagram-grid:none;
  --diagram-vector-stroke:1.1px;
  --diagram-edge-width:1.8px;
  --diagram-box-width:1.5px;
}
[data-diagram-style="engineering"] {
  --diagram-ink:#1d2723;
  --diagram-muted:#4d6055;
  --diagram-line:#303432;
  --diagram-border:#424843;
  --diagram-accent:#537e36;
  --diagram-failure:#936321;
  --diagram-paper:#fff;
  --diagram-soft:#edf3e8;
  --diagram-warm:#fcf1df;
  --diagram-grid:radial-gradient(#dce3d8 .65px,transparent .65px);
  --diagram-vector-stroke:1.35px;
  --diagram-edge-width:2px;
  --diagram-box-width:1.7px;
}
[data-diagram-style] .tm-viewport,[data-diagram-style] .am-viewport {
  background-color:var(--diagram-paper);
  background-image:var(--diagram-grid);
  background-size:20px 20px;
}
[data-diagram-style] .canvas { color:var(--diagram-ink); background-color:var(--diagram-paper); }
[data-diagram-style] .canvas :is(.node,.event,.checkpoint,.restore,.bundle) {
  border-color:var(--diagram-border)!important;
  color:var(--diagram-ink);
}
[data-diagram-kind="flow"] :is(.node,.event,.checkpoint,.restore,.bundle) { border-width:var(--diagram-box-width); }
[data-diagram-style] .canvas :is(.sub,.note,.edge-label,.label:not(.title),.key,.index,.legend) { color:var(--diagram-muted); }
[data-diagram-style] .canvas :is(.node.soft,.node.accent,.node.output,.node.result,.event.repaired) { background-color:var(--diagram-soft)!important; border-color:var(--diagram-accent)!important; }
[data-diagram-style] .canvas :is(.node.failed,.node.issue,.event.failed) { background-color:var(--diagram-warm)!important; border-color:var(--diagram-failure)!important; }
[data-diagram-style] .canvas .edge { border-top-color:var(--diagram-line)!important; border-top-width:var(--diagram-edge-width); }
[data-diagram-style] .canvas .edge.arrow::after { border-left-color:var(--diagram-line)!important; }
[data-diagram-style] .canvas .edge:is(.feedback,.rewind,.retry,.handoff) { border-top-color:var(--diagram-accent)!important; }
[data-diagram-style] .canvas .edge:is(.feedback,.rewind,.retry,.handoff).arrow::after { border-left-color:var(--diagram-accent)!important; }
[data-diagram-style] .canvas .edge:is(.failure,.attempt) { border-top-color:var(--diagram-failure)!important; }
[data-diagram-style] .canvas .edge:is(.failure,.attempt).arrow::after { border-left-color:var(--diagram-failure)!important; }
[data-diagram-style] .canvas .wire { border-color:var(--diagram-line)!important; }
[data-diagram-style] .canvas .tip { border-top-color:var(--diagram-line)!important; border-right-color:var(--diagram-line)!important; }
[data-diagram-style] [data-diagram-stroke="neutral"] { stroke:var(--diagram-line)!important; stroke-width:var(--diagram-vector-stroke)!important; }
[data-diagram-style] [data-diagram-stroke="accent"] { stroke:var(--diagram-accent)!important; stroke-width:var(--diagram-vector-stroke)!important; }
[data-diagram-style] [data-diagram-fill="paper"] { fill:var(--diagram-paper)!important; }
[data-diagram-style="engineering"] [data-diagram-fill="node"] { fill:var(--diagram-paper)!important; }
[data-diagram-style="engineering"] .canvas :is(.node.soft,.node.accent) { background-color:var(--diagram-paper)!important; border-color:var(--diagram-border)!important; }
[data-diagram-style] [data-diagram-text="primary"] { fill:var(--diagram-ink)!important; }
[data-diagram-style] [data-diagram-text="secondary"] { fill:var(--diagram-muted)!important; }
[data-diagram-style] [data-diagram-text="accent"] { fill:var(--diagram-accent)!important; }
[data-diagram-style] .canvas .connection.is-active .edge { border-top-color:var(--diagram-accent)!important; border-top-width:2.6px; }
[data-diagram-style] .canvas .connection.is-active .edge.arrow::after { border-left-color:var(--diagram-accent)!important; }
[data-diagram-style] .canvas.tm-replaying .connection.is-active .edge { border-top-width:0; }
[data-diagram-style] .canvas .connection.is-active [data-diagram-stroke] { stroke:var(--diagram-accent)!important; stroke-width:2px!important; }
[data-diagram-style] .diagram-style-control { max-width:150px; font-weight:400; }
.diagram-style-dialog &gt; .diagram-style-control { position:fixed; top:22px; left:22px; z-index:1; padding:8px 12px; color:#202422; background:#fff; border:1px solid #656e66; border-radius:6px; font:14px Arial,sans-serif; }
[data-diagram-style] .automation-map,.automation-map[data-diagram-style] { --map-border:var(--diagram-border); --map-accent:var(--diagram-accent); --map-soft:var(--diagram-soft); }
[data-diagram-style] .am-edge { stroke:var(--diagram-line); stroke-width:var(--diagram-edge-width); }
[data-diagram-style] marker path { stroke:var(--diagram-line); }
[data-diagram-style] .am-node { border-color:var(--diagram-border); border-width:var(--diagram-box-width); border-radius:8px; box-shadow:none; color:var(--diagram-ink); }
[data-diagram-style] .am-node-note,[data-diagram-style] .am-label { color:var(--diagram-muted); }
[data-diagram-style] .am-label { background:var(--diagram-paper); }
[data-diagram-style="engineering"] .am-node { background:var(--diagram-soft); }
[data-diagram-style] .am-edge.is-active { stroke:var(--diagram-accent); stroke-width:2.6px; }
@media print { [data-diagram-style] .diagram-style-control { display:none; } }
</style></div></foreignObject></svg>
