編集後は業務判断を再確認
形式不備による差し戻しは1回</span></div><div class="node result" id="result" style="left:1010px;top:680px;width:360px;height:165px"><strong>合格 / 不合格</strong><span>Spec・投票・軌跡を保存</span><span data-node-detail="true" hidden="">最終結果を記録
