<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" width="1440" height="640" lang="zh"><foreignObject width="1440" height="640"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root" data-diagram-style="engineering" data-diagram-kind="flow"><style>
*{box-sizing:border-box}.diagram-root{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1440px;height:640px;background:#fff;overflow:hidden}.node{position:absolute;display:flex;align-items:center;justify-content:center;border:1.5px solid #63716a;background:#fff;padding:12px 16px;text-align:center;font-size:26px;line-height:1.4;border-radius:3px}.soft{background:#edf3e9;border-color:#768d6d}.quiet{background:#f6f7f5;border-color:#c6cdc6}.dotted{background-image:radial-gradient(#c7d3bd .9px,transparent .9px);background-size:7px 7px}.label{position:absolute;font-size:23px;line-height:1.45;color:#65736a}.title{font-size:28px;font-weight:500;color:#303c38}.mono{font-family:ui-monospace,Menlo,monospace}.arrow{position:absolute;height:0;border-top:1.5px solid #7b897f}.arrow:after{content:"";position:absolute;right:-1px;top:-4.5px;border-left:7px solid #7b897f;border-top:4px solid transparent;border-bottom:4px solid transparent}.vertical{position:absolute;width:0;border-left:1.5px solid #7b897f}.down:after{content:"";position:absolute;left:-4.5px;bottom:-1px;border-top:7px solid #7b897f;border-left:4px solid transparent;border-right:4px solid transparent}.up:after{content:"";position:absolute;left:-4.5px;top:-1px;border-bottom:7px solid #7b897f;border-left:4px solid transparent;border-right:4px solid transparent}.rule{position:absolute;border-top:1px solid #dce2dc;height:0}.note{position:absolute;font-size:22px;line-height:1.55;color:#65736a}

.diagram-root{font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.label,.legend,.note,.annotation,.small-note,.caption,.axis{font-size:22px}.title,.label.title{font-size:30px}.group-title,.chart h2{font-size:26px}.chart-row,.plot-row,.matrix&gt;div,.stat-grid p,.val{font-size:26px}.matrix .muted,.math,.legend,.small{font-size:24px}</style><main class="canvas">
<div class="label title" style="left:42px;top:32px">同一参考分布，两种监督目标</div>
<div class="node quiet" style="left: 42px; top: 250px; width: 280px; height: 120px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">Agent 参考概率<br /><span class="mono" style="font-size:21px;white-space:nowrap">q = [0.1, 0.8, 0.1]</span></span></div>
<div class="label" style="left:42px;top:386px;width:280px;font-size:19px;text-align:center">Sheet / Base / Others · 示意</div>
<div class="arrow" style="left:322px;top:310px;width:36px"></div><div class="vertical" style="left:358px;top:186px;height:246px"></div>
<div class="arrow" style="left:358px;top:186px;width:58px"></div><div class="arrow" style="left:358px;top:432px;width:58px"></div>
<div class="label" style="left:416px;top:96px">硬标签</div>
<div class="node" style="left: 416px; top: 134px; width: 304px; height: 104px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">取最大概率类别<br /><span class="mono">t = [0, 1, 0]</span></span></div>
<div class="arrow" style="left:720px;top:186px;width:56px"></div>
<div class="node" style="left: 776px; top: 134px; width: 316px; height: 104px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">硬交叉熵<br /><span class="mono">−log p(Base)</span></span></div>
<div class="label" style="left:416px;top:342px">软标签</div>
<div class="node soft dotted" style="left: 416px; top: 380px; width: 304px; height: 104px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">保留完整概率<br /><span class="mono">t = q</span></span></div>
<div class="arrow" style="left:720px;top:432px;width:56px"></div>
<div class="node soft" style="left: 776px; top: 380px; width: 316px; height: 104px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">软交叉熵<br /><span class="mono">−Σ qᵢ log pᵢ</span></span></div>
<div class="node quiet" style="left: 1164px; top: 250px; width: 234px; height: 120px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">模型输出<br /><span class="mono">p</span></span></div>
<div class="vertical" style="left:1128px;top:186px;height:246px"></div><div class="rule" style="left:1128px;top:310px;width:36px;border-color:#7b897f"></div>
<div class="arrow" style="left:1092px;top:186px;width:36px;transform:rotate(180deg)"></div><div class="arrow" style="left:1092px;top:432px;width:36px;transform:rotate(180deg)"></div>
<div class="rule" style="left:42px;top:542px;width:1356px"></div>
<div class="note" style="left:42px;top:565px;width:1356px">参考分布只进入损失；推理输入仍是规则、用户需求与候选说明。</div></main><style>[data-diagram-style="openai-blog"] {
  --diagram-ink:#202422;
  --diagram-muted:#59635b;
  --diagram-line:#545c55;
  --diagram-border:#656e66;
  --diagram-accent:#688e42;
  --diagram-failure:#997140;
  --diagram-paper:#fff;
  --diagram-soft:#f6f8f3;
  --diagram-warm:#fcf6ed;
  --diagram-grid:none;
  --diagram-vector-stroke:1.1px;
  --diagram-edge-width:1.8px;
  --diagram-box-width:1.5px;
}
[data-diagram-style="engineering"] {
  --diagram-ink:#1d2723;
  --diagram-muted:#4d6055;
  --diagram-line:#303432;
  --diagram-border:#424843;
  --diagram-accent:#537e36;
  --diagram-failure:#936321;
  --diagram-paper:#fff;
  --diagram-soft:#edf3e8;
  --diagram-warm:#fcf1df;
  --diagram-grid:radial-gradient(#dce3d8 .65px,transparent .65px);
  --diagram-vector-stroke:1.35px;
  --diagram-edge-width:2px;
  --diagram-box-width:1.7px;
}
[data-diagram-style] .tm-viewport,[data-diagram-style] .am-viewport {
  background-color:var(--diagram-paper);
  background-image:var(--diagram-grid);
  background-size:20px 20px;
}
[data-diagram-style] .canvas { color:var(--diagram-ink); background-color:var(--diagram-paper); }
[data-diagram-style] .canvas :is(.node,.event,.checkpoint,.restore,.bundle) {
  border-color:var(--diagram-border)!important;
  color:var(--diagram-ink);
}
[data-diagram-kind="flow"] :is(.node,.event,.checkpoint,.restore,.bundle) { border-width:var(--diagram-box-width); }
[data-diagram-style] .canvas :is(.sub,.note,.edge-label,.label:not(.title),.key,.index,.legend) { color:var(--diagram-muted); }
[data-diagram-style] .canvas :is(.node.soft,.node.accent,.node.output,.node.result,.event.repaired) { background-color:var(--diagram-soft)!important; border-color:var(--diagram-accent)!important; }
[data-diagram-style] .canvas :is(.node.failed,.node.issue,.event.failed) { background-color:var(--diagram-warm)!important; border-color:var(--diagram-failure)!important; }
[data-diagram-style] .canvas .edge { border-top-color:var(--diagram-line)!important; border-top-width:var(--diagram-edge-width); }
[data-diagram-style] .canvas .edge.arrow::after { border-left-color:var(--diagram-line)!important; }
[data-diagram-style] .canvas .edge:is(.feedback,.rewind,.retry,.handoff) { border-top-color:var(--diagram-accent)!important; }
[data-diagram-style] .canvas .edge:is(.feedback,.rewind,.retry,.handoff).arrow::after { border-left-color:var(--diagram-accent)!important; }
[data-diagram-style] .canvas .edge:is(.failure,.attempt) { border-top-color:var(--diagram-failure)!important; }
[data-diagram-style] .canvas .edge:is(.failure,.attempt).arrow::after { border-left-color:var(--diagram-failure)!important; }
[data-diagram-style] .canvas .wire { border-color:var(--diagram-line)!important; }
[data-diagram-style] .canvas .tip { border-top-color:var(--diagram-line)!important; border-right-color:var(--diagram-line)!important; }
[data-diagram-style] [data-diagram-stroke="neutral"] { stroke:var(--diagram-line)!important; stroke-width:var(--diagram-vector-stroke)!important; }
[data-diagram-style] [data-diagram-stroke="accent"] { stroke:var(--diagram-accent)!important; stroke-width:var(--diagram-vector-stroke)!important; }
[data-diagram-style] [data-diagram-fill="paper"] { fill:var(--diagram-paper)!important; }
[data-diagram-style="engineering"] [data-diagram-fill="node"] { fill:var(--diagram-paper)!important; }
[data-diagram-style="engineering"] .canvas :is(.node.soft,.node.accent) { background-color:var(--diagram-paper)!important; border-color:var(--diagram-border)!important; }
[data-diagram-style] [data-diagram-text="primary"] { fill:var(--diagram-ink)!important; }
[data-diagram-style] [data-diagram-text="secondary"] { fill:var(--diagram-muted)!important; }
[data-diagram-style] [data-diagram-text="accent"] { fill:var(--diagram-accent)!important; }
[data-diagram-style] .canvas .connection.is-active .edge { border-top-color:var(--diagram-accent)!important; border-top-width:2.6px; }
[data-diagram-style] .canvas .connection.is-active .edge.arrow::after { border-left-color:var(--diagram-accent)!important; }
[data-diagram-style] .canvas.tm-replaying .connection.is-active .edge { border-top-width:0; }
[data-diagram-style] .canvas .connection.is-active [data-diagram-stroke] { stroke:var(--diagram-accent)!important; stroke-width:2px!important; }
[data-diagram-style] .diagram-style-control { max-width:150px; font-weight:400; }
.diagram-style-dialog &gt; .diagram-style-control { position:fixed; top:22px; left:22px; z-index:1; padding:8px 12px; color:#202422; background:#fff; border:1px solid #656e66; border-radius:6px; font:14px Arial,sans-serif; }
[data-diagram-style] .automation-map,.automation-map[data-diagram-style] { --map-border:var(--diagram-border); --map-accent:var(--diagram-accent); --map-soft:var(--diagram-soft); }
[data-diagram-style] .am-edge { stroke:var(--diagram-line); stroke-width:var(--diagram-edge-width); }
[data-diagram-style] marker path { stroke:var(--diagram-line); }
[data-diagram-style] .am-node { border-color:var(--diagram-border); border-width:var(--diagram-box-width); border-radius:8px; box-shadow:none; color:var(--diagram-ink); }
[data-diagram-style] .am-node-note,[data-diagram-style] .am-label { color:var(--diagram-muted); }
[data-diagram-style] .am-label { background:var(--diagram-paper); }
[data-diagram-style="engineering"] .am-node { background:var(--diagram-soft); }
[data-diagram-style] .am-edge.is-active { stroke:var(--diagram-accent); stroke-width:2.6px; }
@media print { [data-diagram-style] .diagram-style-control { display:none; } }
</style></div></foreignObject></svg>
