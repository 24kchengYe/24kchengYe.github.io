   <g id="text_1"><text x="118.8" y="58.688906" font-size="14.000000000000002" font-family="Arial, PingFang SC, Hiragino Sans, Microsoft YaHei, sans-serif" fill="#161616" text-anchor="middle" textLength="84" lengthAdjust="spacingAndGlyphs">選べる候補あり？</text></g>
   <g id="text_2"><text x="378" y="58.653906" font-size="14.000000000000002" font-family="Arial, PingFang SC, Hiragino Sans, Microsoft YaHei, sans-serif" fill="#161616" text-anchor="middle" textLength="112" lengthAdjust="spacingAndGlyphs">一つ選択、結合しない</text></g>
