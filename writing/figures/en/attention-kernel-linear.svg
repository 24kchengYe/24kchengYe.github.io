<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 630" width="1440" height="630" lang="en"><foreignObject width="1440" height="630"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>*{box-sizing:border-box}.diagram-root{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1440px;overflow:hidden;background:#fff}.node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;border:1.5px solid #a4afa5;background:#fff;border-radius:4px;padding:10px 16px;font-size:24px;line-height:1.4;z-index:2}.node.soft{background:#eff4ec;border-color:#9eaf94}.math{font-size:.86em;color:#56645b}.title{position:absolute;left:40px;top:28px;font-size:29px;font-weight:500}.legend{position:absolute;top:36px;font-size:18px;color:#6a766d}.legend:before{content:"";display:inline-block;width:30px;border-top:1.5px solid #91a08f;vertical-align:middle;margin-right:12px}.legend.control:before{border-top-style:dashed}.edge{position:absolute;height:0;border-top:1.5px solid #91a08f;transform-origin:0 0;z-index:1}.edge.control{border-top-style:dashed}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #91a08f;border-top:4px solid transparent;border-bottom:4px solid transparent}.note{position:absolute;left:40px;width:1360px;font-size:20px;line-height:1.5;color:#68766c;border-top:1px solid #e0e6dc;padding-top:20px}.annotation{position:absolute;font-size:22px;color:#68766c}
.diagram-root{font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.label,.legend,.note,.annotation,.small-note,.caption,.axis{font-size:22px}.title,.label.title{font-size:30px}.group-title,.chart h2{font-size:26px}.chart-row,.plot-row,.matrix&gt;div,.stat-grid p,.val{font-size:26px}.matrix .muted,.math,.legend,.small{font-size:24px}</style><main class="canvas" style="height:630px">
<div class="title">Kernel linear attention</div><div class="legend" style="left:760px">Solid: tensor flow</div><div class="legend control" style="left:1070px">Dashed: selection / gates</div>
<div class="edge arrow" data-from="previous" data-to="update" style="left:290px;top:225px;width:120px;transform:rotate(0deg)"></div>
<div class="edge arrow" data-from="kv" data-to="update" style="left: 575px; top: 410px; width: 110px; transform: rotate(-90deg);"></div>
<div class="edge arrow" data-from="query" data-to="read" style="left:1205px;top:420px;width:120px;transform:rotate(-90deg)"></div>
<div class="edge arrow" data-from="update" data-to="read" style="left:820px;top:220px;width:190px;transform:rotate(0deg)"></div>
<div class="node soft" id="previous" style="left: 40px; top: 170px; width: 250px; height: 110px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">Previous state<br /><span class="math">Sₜ₋₁, zₜ₋₁</span></span></div>
<div class="node " id="kv" style="left: 410px; top: 410px; width: 330px; height: 120px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">Current-state projections<br /><span class="math">xₜ → φ(kₜ), vₜ</span></span></div>
<div class="node soft" id="update" style="left: 410px; top: 140px; width: 410px; height: 160px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">Outer-product sum + normalizer<br /><span class="math">Sₜ = Sₜ₋₁ + vₜφ(kₜ)ᵀ<br />zₜ = zₜ₋₁ + φ(kₜ)</span></span></div>
<div class="node " id="query" style="left: 1010px; top: 420px; width: 390px; height: 100px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">Current-state projections<br /><span class="math">xₜ → φ(qₜ)</span></span></div>
<div class="node soft" id="read" style="left: 1010px; top: 140px; width: 390px; height: 160px; font-size: 28px; line-height: 1.25;" data-type-role="primary"><span style="min-width: 0; overflow-wrap: anywhere;">Read and normalize<br /><span class="math">oₜ = Sₜφ(qₜ) / (zₜᵀφ(qₜ))</span></span></div>

<div class="note" style="top:535px">S: value × key features; z normalizes the read. Both states carry over to the next step.</div>
</main></div></foreignObject></svg>
