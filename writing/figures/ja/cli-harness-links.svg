<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" lang="ja"><foreignObject width="1200" height="820"><div xmlns="http://www.w3.org/1999/xhtml" class="diagram-root"><style>*{box-sizing:border-box}.diagram-root{margin:0;background:#fff;color:#303c38;font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif}.canvas{position:relative;width:1200px;background:#fff;overflow:hidden}.heading{position:absolute;left:50px;top:22px;font-size:30px;line-height:1.3}.node{position:absolute;display:flex;align-items:center;justify-content:center;padding:14px 18px;text-align:center;border:1px solid #a6b1a1;border-radius:5px;background:#fff;font-size:28px;line-height:1.28;z-index:2}.node.soft{background:#f1f5ec}.node.plan{border-style:dashed}.sub{display:block;margin-top:8px;font-size:24px;line-height:1.3;color:#687568}.label{position:absolute;font-size:22px;line-height:1.35;color:#687568;background:#fff;padding:3px 8px;text-align:center;z-index:3}.region{position:absolute;border:1px solid #d1d8cc;border-radius:8px}.region-title{position:absolute;top:-21px;left:22px;padding:0 12px;background:#fff;font-size:28px;line-height:1.4}.edge{position:absolute;height:0;border-top:1.4px solid #8b9b83;transform-origin:0 0;z-index:1}.edge.dashed{border-top-style:dashed}.edge.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border-left:8px solid #8b9b83;border-top:4px solid transparent;border-bottom:4px solid transparent}.note{position:absolute;font-size:22px;line-height:1.45;color:#687568}.field{font-family:Arial,"PingFang SC","Hiragino Sans",sans-serif;font-size:24px;line-height:1.65}.panel{position:absolute;border:1px solid #c6d0bf;border-radius:6px;padding:22px 26px;background:#fff}.panel h2{font-size:28px;font-weight:400;line-height:1.35;margin:0 0 18px}.panel .rule{border-top:1px solid #d9dfd3;margin:18px 0}.muted{color:#687568}</style><main class="canvas" data-fixed-type="" style="height:820px"><div class="heading">計画・実行・修復のつながり</div>
<div id="plan" class="node plan" style="left:60px;top:100px;width:500px;height:135px"><span style="min-width: 0; overflow-wrap: anywhere;">Spec → TodoList<br /><span class="sub">業務上の制約 → タスク・依存・状態</span></span></div>
<div class="note" style="left:660px;top:113px;width:480px">計画が動作を導き、実際の返却値で計画を更新する。</div>
<div id="harness" class="node " style="left:60px;top:310px;width:240px;height:120px"><span style="min-width: 0; overflow-wrap: anywhere;">Harness<br /><span class="sub">実行・記録</span></span></div>
<div id="online" class="node soft" style="left:410px;top:310px;width:310px;height:120px"><span style="min-width: 0; overflow-wrap: anywhere;">Online<br /><span class="sub">評価・上限付き再生成</span></span></div>
<div id="offline" class="node " style="left:840px;top:310px;width:300px;height:120px"><span style="min-width: 0; overflow-wrap: anywhere;">Offline<br /><span class="sub">局所編集・検証</span></span></div>
<div id="pending" class="node " style="left:500px;top:625px;width:220px;height:85px"><span style="min-width: 0; overflow-wrap: anywhere;">Pending</span></div>
<div id="training" class="node soft" style="left:840px;top:605px;width:300px;height:125px"><span style="min-width: 0; overflow-wrap: anywhere;">学習データ<br /><span class="sub">真正性・形式の確認</span></span></div>
<div class="connection" data-from="plan" data-to="harness"><div class="edge dashed arrow" style="left:100px;top:235px;width:75px;transform:rotate(90deg)"></div></div>
<div class="connection" data-from="harness" data-to="online"><div class="edge arrow" style="left:300px;top:370px;width:110px;transform:rotate(0deg)"></div></div>
<div class="connection" data-from="online" data-to="offline"><div class="edge arrow" style="left:720px;top:370px;width:120px;transform:rotate(0deg)"></div></div>
<div class="connection" data-from="online" data-to="harness"><div class="edge dashed" style="left:470px;top:430px;width:95px;transform:rotate(90deg)"></div><div class="edge dashed" style="left:470px;top:525px;width:290px;transform:rotate(180deg)"></div><div class="edge dashed arrow" style="left:180px;top:525px;width:95px;transform:rotate(-90deg)"></div></div>
<div class="connection" data-from="online" data-to="pending"><div class="edge arrow" style="left:520px;top:430px;width:195px;transform:rotate(90deg)"></div></div>
<div class="connection" data-from="offline" data-to="pending"><div class="edge" style="left:900px;top:430px;width:130px;transform:rotate(90deg)"></div><div class="edge" style="left:900px;top:560px;width:230px;transform:rotate(180deg)"></div><div class="edge arrow" style="left:670px;top:560px;width:65px;transform:rotate(90deg)"></div></div>
<div class="connection" data-from="offline" data-to="training"><div class="edge arrow" style="left:1080px;top:430px;width:175px;transform:rotate(90deg)"></div></div>
<div class="label" style="left:120px;top:255px;width:185px">計画を文脈へ</div>
<div class="label" style="left:302px;top:316px;width:106px">軌跡</div>
<div class="label" style="left:730px;top:243px;width:140px">再生成不要</div>
<div class="label" style="left:65px;top:540px;width:420px">文脈と環境を復元して再生成</div>
<div class="label" style="left:535px;top:465px;width:190px">実行不能・予算切れ</div>
<div class="label" style="left:735px;top:484px;width:300px">検証不能・再生成が必要</div>
<div class="label" style="left:945px;top:530px;width:185px">検証を通過</div>
<div class="note" style="left:60px;top:760px;width:1080px">Online → Offline の一方向の引き渡し。Pending は問題と証拠を保持。</div>
<div class="connection" data-from="harness" data-to="plan"><div class="edge dashed" style="left:270px;top:310px;width:40px;transform:rotate(-90deg)"></div><div class="edge dashed" style="left:270px;top:270px;width:250px;transform:rotate(0deg)"></div><div class="edge dashed arrow" style="left:520px;top:270px;width:35px;transform:rotate(-90deg)"></div></div>
<div class="connection" data-from="online" data-to="plan"><div class="edge dashed" style="left:600px;top:310px;width:145px;transform:rotate(-90deg)"></div><div class="edge dashed arrow" style="left:600px;top:165px;width:40px;transform:rotate(180deg)"></div></div>
<div class="label" style="left:305px;top:243px;width:255px">実際の返却値で状態を更新</div>
<div class="label" style="left:650px;top:210px;width:360px">原因分析 · 計画修訂</div>
</main></div></foreignObject></svg>
